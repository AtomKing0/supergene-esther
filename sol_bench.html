<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>솔리테어 런칭 동기간 벤치 비교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box} body{font-family:'Noto Sans KR',sans-serif;background:#fff;color:#1c2530;padding:26px 30px 34px}
 h1{font-size:20px;font-weight:900} h1 b{color:#4F8EF7}
 .sub{font-size:12px;color:#7A7F94;margin:6px 0 14px}
 .seg{display:inline-flex;border:1.5px solid #D8DEE9;border-radius:22px;overflow:hidden;margin-bottom:16px}
 .seg button{border:0;background:#fff;color:#5a6273;font-size:13px;font-weight:800;padding:8px 22px;cursor:pointer}
 .seg button.on{background:#1c2530;color:#fff}
 table{width:100%;border-collapse:collapse;font-size:15px}
 th{font-size:12px;color:#9AA0B8;font-weight:700;padding:8px 12px;border-bottom:2px solid #E2E6EF;text-align:right} th:first-child{text-align:left}
 td{padding:9px 12px;border-bottom:1px solid #F0F2F7;text-align:right}
 td.m{text-align:left;font-weight:700;color:#4A5068;font-size:13px}
 tr.grp td{background:#F5F7FB;color:#6B7280;font-weight:900;font-size:11px;letter-spacing:.04em;padding:6px 12px;border-bottom:1px solid #E2E6EF;text-align:left}
 .policy{margin-top:12px;background:#F8FAFC;border:1px solid #E2E6EF;border-radius:8px;padding:8px 13px;font-size:11px;color:#475569;line-height:1.7}
 .foot{margin-top:10px;font-size:11px;color:#9AA0B8;line-height:1.7}
</style></head><body>
<h1><b>Solitaire City Journey</b> — 런칭 동기간 벤치마크 비교</h1>
<div class="sub">런칭 D+0~D+16 창(대시보드 기준·벤치 성숙 vs 솔 진행중) · 런칭일 솔 7/10(퍼블리시)·코지 1/4·퍼블마 10/18 · <span id="vlbl">글로벌</span> · 갱신 2026-07-13 23:00:25</div>
<div class="seg"><button id="b-global" class="on" onclick="setV('g')">글로벌</button><button id="b-us" onclick="setV('us')">US</button></div>
<table id="tbl"></table>
<div class="policy"><b>빌드 정책(EQRV4 퀄리티 빌드, ~8/12)</b> · IT 광고(클리어/게임 진입): 초반 리텐션 저하 방지 위해 OFF · 컨텍스트 스위치(토너먼트·공유 팝업): 첫 게임 진입 방해·저관여 유입 우려로 OFF — 해당 지면 지표 0은 정상. RV(보상형)는 유지</div>
<div class="foot" id="foot"></div>
<script>
const P = {"g": {"sol": {"nru": 1860, "d1": 17.5, "d1n": 584, "ru_d1": 52.9, "touch": 59.5, "nru_rounds": 9.7, "ru_rounds": 22.3, "p60": 52.9, "p600": 26.0, "rvpr": 0.212}, "cozy": {"nru": 60082, "d1": 14.0, "d1n": 60082, "ru_d1": 41.3, "touch": 69.5, "nru_rounds": 8.5, "ru_rounds": 23.5, "p60": 67.9, "p600": 21.6, "rvpr": 0.044}, "pbm": {"nru": 47435, "d1": 15.1, "d1n": 47435, "ru_d1": 39.8, "touch": 78.1, "nru_rounds": 7.9, "ru_rounds": 19.1, "p60": 80.0, "p600": 33.8, "rvpr": 0.058}}, "us": {"sol": {"nru": 237, "d1": 32.6, "d1n": 46, "ru_d1": 100.0, "touch": 77.6, "nru_rounds": 14.6, "ru_rounds": 21.1, "p60": 74.3, "p600": 41.4, "rvpr": 0.255}, "cozy": {"nru": 4853, "d1": 20.7, "d1n": 4853, "ru_d1": 49.8, "touch": 70.4, "nru_rounds": 9.7, "ru_rounds": 20.3, "p60": 68.5, "p600": 31.7, "rvpr": 0.076}, "pbm": {"nru": 4198, "d1": 20.7, "d1n": 4198, "ru_d1": 46.6, "touch": 78.9, "nru_rounds": 9.8, "ru_rounds": 18.5, "p60": 79.3, "p600": 43.3, "rvpr": 0.062}}, "groups": [["유입", [["유입 누적 (신규)", "nru", "count", true]]], ["리텐션", [["D1 리텐션 ★", "d1", "pct", true], ["복귀 재복귀율 D1", "ru_d1", "pct", true]]], ["인게이지먼트", [["첫터치 도달", "touch", "pct", true], ["신규(NRU) 누적 판수 / 인", "nru_rounds", "round", true], ["복귀(RU) 누적 판수 / 인", "ru_rounds", "round", true], ["60초+ 세션 도달", "p60", "pct", true], ["600초+ 몰입", "p600", "pct", true]]], ["수익 (참고·티어 무관)", [["판당 RV", "rvpr", "rv", null]]]], "names": {"sol": "솔리테어", "cozy": "코지", "pbm": "퍼블마"}, "colors": {"sol": "#4F8EF7", "cozy": "#2CB87A", "pbm": "#E8832A"}, "order": ["sol", "cozy", "pbm"], "N": 3};
let V = 'g';
const D = () => V==='g' ? P.g : P.us;
const fmt = (v,f) => v==null?'—':(f=='count'?v.toLocaleString()+'명':f=='pct'?v+'%':f=='round'?v+'판':v.toFixed(3));
function status(sol,cz,pb,hb){ if(hb==null||sol==null) return null;
  const vs=[cz,pb].filter(x=>x!=null); const b=vs.filter(x=> hb?sol>x:sol<x).length;
  return [['🔴','#DC2626'],['🔶','#D97706'],['✅','#059669']][b]; }
function render(){
  const d=D(); let h='<tr><th>지표</th>'+P.order.map(k=>`<th style="color:${P.colors[k]}">${P.names[k]}</th>`).join('')+'</tr>';
  for(const [gname, metrics] of P.groups){
    h+=`<tr class="grp"><td colspan="4">${gname}</td></tr>`;
    for(const [lab,key,f,hb] of metrics){
      const sol=d.sol[key], cz=d.cozy[key], pb=d.pbm[key];
      let solTd;
      if(f=='rv'){ solTd=`<td style="font-weight:700;color:#7A7F94">${fmt(sol,f)}</td>`; }
      else { const st=status(sol,cz,pb,hb);
        solTd = st ? `<td style="color:${st[1]};font-weight:900">${fmt(sol,f)} ${st[0]}</td>`
                   : `<td style="font-weight:800;color:#4A5068">${fmt(sol,f)}</td>`; }
      const bc = f=='rv' ? 'color:#9AA0B8' : 'font-weight:400';
      h+=`<tr><td class="m">${lab}</td>${solTd}<td style="${bc}">${fmt(cz,f)}</td><td style="${bc}">${fmt(pb,f)}</td></tr>`;
    }
  }
  document.getElementById('tbl').innerHTML=h;
  const n=d.sol.d1n||0;
  document.getElementById('foot').innerHTML=`✅ 벤치 2종 상회 · 🔶 일부 · 🔴 모두 하회 (솔리테어 기준) · <b>${V==='g'?'글로벌':'US'}</b> 관객<br>대시보드(20_fb_funnel) 정합 · 런칭 D+0~D+16 창 · 리텐션=런칭 코호트 D1 풀링(벤치 성숙 코지14.0·퍼블마15.1 / 솔 n=${n.toLocaleString()}) · 판수=유저당 누적 완료판 · 60/600초=신규 첫세션 도달률 · RV=판당 RV_FINISH(참고) · 솔 진행중 소폭 과소`;
}
function setV(v){ V=v; document.getElementById('b-global').classList.toggle('on',v==='g');
  document.getElementById('b-us').classList.toggle('on',v==='us');
  document.getElementById('vlbl').textContent = v==='g'?'글로벌':'US'; render(); }
render();
</script></body></html>
