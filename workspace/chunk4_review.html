function scoreClass(s) {
  if (s >= 950) return 's-high';
  if (s >= 900) return 's-mid';
  return 's-low';
}
function ratioClass(r) {
  if (r >= 0.60) return 'r-high';
  if (r >= 0.40) return 'r-mid';
  return 'r-low';
}

// Hard tier bounds: ratio > 0.30 (min), ratio <= 0.75 (max)
const RATIO_MIN = 0.30, RATIO_MAX = 0.75;

function deckAdjust(d) {
  const minDeck = Math.floor(d.field * RATIO_MIN) + 1;  // ratio > 0.30
  const maxDeck = Math.floor(d.field * RATIO_MAX);       // ratio <= 0.75
  const cur = d.deck;

  if (cur < minDeck) {
    return `<span style="background:#ff7675;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px">
      ${cur} → <b>${minDeck}</b> <span style="font-weight:400;opacity:.85">(ratio 낮음)</span>
    </span>`;
  }
  if (cur > maxDeck) {
    return `<span style="background:#fdcb6e;color:#2d3436;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px">
      ${cur} → <b>${maxDeck}</b> <span style="font-weight:400;opacity:.75">(ratio 높음)</span>
    </span>`;
  }
  return `<span style="color:#00b894;font-size:12px;font-weight:700">✓ OK</span>
    <span style="font-size:11px;color:#b2bec3;margin-left:4px">범위 ${minDeck}~${maxDeck}</span>`;
}

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  DATA.forEach((d, i) => {
    const tr = document.createElement('tr');
    tr.id = 'row_' + i;
    tr.innerHTML = `
      <td><input class="cb" type="checkbox" onchange="onCheck(${i})" id="cb_${i}"></td>
      <td>${i+1}</td>
      <td>
        <span style="display:inline-block;background:#6c5ce7;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-right:7px;font-family:monospace">${d.stage_id}</span>
        <span style="font-size:11px;color:#636e72;font-family:monospace">${d.fname.replace('Hard_obj_','').replace('.json','')}</span>
      </td>
      <td class="num"><span class="score-badge ${scoreClass(d.score)}">${d.score}</span></td>
      <td class="num">${d.field}</td>
      <td class="num">${d.depth}</td>
      <td class="num">${d.face_down}</td>
      <td class="num">${d.deck}</td>
      <td class="num">${d.clear}</td>
      <td>
        <div class="ratio-bar">
          <div class="ratio-track"><div class="ratio-fill ${ratioClass(d.ratio)}" style="width:${d.ratio/0.75*100}%"></div></div>
          <span style="font-size:12px">${d.ratio.toFixed(3)}</span>
        </div>
      </td>
      <td>${deckAdjust(d)}</td>`;
    tbody.appendChild(tr);
  });
  updateStats();
}

function onCheck(i) {
  const tr = document.getElementById('row_' + i);
  tr.classList.toggle('checked', document.getElementById('cb_' + i).checked);
  updateStats();
}

function updateStats() {
  const checked = DATA.filter((_, i) => document.getElementById('cb_' + i)?.checked);
  document.getElementById('checkedCount').textContent = checked.length;
  document.getElementById('removeBtn').disabled = checked.length === 0;
  const visible = DATA.filter((_, i) => {
    const row = document.getElementById('row_' + i);
    return row && !row.classList.contains('hidden');
  });
  const avgS = visible.length ? (visible.reduce((a,d)=>a+d.score,0)/visible.length).toFixed(0) : '-';
  const avgR = visible.length ? (visible.reduce((a,d)=>a+d.ratio,0)/visible.length).toFixed(3) : '-';
  document.getElementById('avgScore').textContent = avgS;
  document.getElementById('avgRatio').textContent = avgR;
  document.getElementById('totalCount').textContent = visible.length;
}

function selectAll() {
  DATA.forEach((_, i) => {
    const cb = document.getElementById('cb_' + i);
    const row = document.getElementById('row_' + i);
    if (cb && !row.classList.contains('hidden')) cb.checked = true;
    if (row) row.classList.toggle('checked', cb.checked);
  });
  updateStats();
}

function selectNone() {
  DATA.forEach((_, i) => {
    const cb = document.getElementById('cb_' + i);
    if (cb) cb.checked = false;
    const row = document.getElementById('row_' + i);
    if (row) row.classList.remove('checked');
  });
  updateStats();
}

function confirmRemove() {
  const items = DATA.filter((_, i) => document.getElementById('cb_' + i)?.checked);
  const container = document.getElementById('removedItems');
  container.innerHTML = items.map(d => `<code>${d.fname}</code>`).join('');
  document.getElementById('removedCount').textContent = items.length;
  document.getElementById('removedList').style.display = 'block';
  document.getElementById('removedList').scrollIntoView({ behavior: 'smooth' });
}

function copyList() {
  const items = DATA.filter((_, i) => document.getElementById('cb_' + i)?.checked);
  const text = items.map(d => d.fname).join('\n');
  navigator.clipboard.writeText(text).then(() => alert('클립보드에 복사됐습니다.'));
}

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  DATA.forEach((d, i) => {
    const row = document.getElementById('row_' + i);
    if (!row) return;
    row.classList.toggle('hidden', q && !d.fname.toLowerCase().includes(q));
  });
  updateStats();
});

render();
</script>
