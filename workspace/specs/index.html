<!DOCTYPE html>
<html lang="ko">
<head>
<script id="theme-init">(function(){var t=localStorage.getItem("spec-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");document.addEventListener("DOMContentLoaded",function(){var g=document.createElement("button");g.className="theme-toggle";g.title="라이트/다크 모드 전환";g.textContent=t==="light"?"☀️":"🌙";document.body.prepend(g);g.addEventListener("click",function(){var l=document.documentElement.getAttribute("data-theme")==="light";document.documentElement[l?"removeAttribute":"setAttribute"]("data-theme","light");g.textContent=l?"🌙":"☀️";localStorage.setItem("spec-theme",l?"dark":"light");});});})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업데이트 스펙 인덱스 · Solitaire TriPeaks</title>
<style>
/* ── 디자인 토큰 ── */
:root {
  /* Surface */
  --bg: #0f1117; --surface: #1a1d27; --surface2: #222635; --surface3: #2a2e3f;
  --border: #2e3348;
  /* Text */
  --text: #e4e6f0; --text-dim: #9ea3b5;
  /* Brand */
  --accent: #a78bfa; --accent2: #c4b5fd;
  /* Semantic colors — value + bg + border 3종 세트 */
  --green:  #34d399; --green-bg:  rgba(52,211,153,0.12);  --green-border:  rgba(52,211,153,0.25);
  --yellow: #fbbf24; --yellow-bg: rgba(251,191,36,0.12);  --yellow-border: rgba(251,191,36,0.25);
  --red:    #f87171; --red-bg:    rgba(248,113,113,0.12); --red-border:    rgba(248,113,113,0.25);
  --blue:   #60a5fa; --blue-bg:   rgba(96,165,250,0.12);  --blue-border:   rgba(96,165,250,0.25);
  --purple: #a78bfa; --purple-bg: rgba(167,139,250,0.12); --purple-border: rgba(167,139,250,0.25);
  --pink:   #e879f9; --pink-bg:   rgba(232,121,249,0.12); --pink-border:   rgba(232,121,249,0.25);
  --orange: #fb923c; --orange-bg: rgba(251,146,60,0.12);  --orange-border: rgba(251,146,60,0.25);
  --slate:  #94a3b8; --slate-bg:  rgba(148,163,184,0.12); --slate-border:  rgba(148,163,184,0.25);
  --teal:   #2dd4bf; --teal-bg:   rgba(45,212,191,0.12);  --teal-border:   rgba(45,212,191,0.25);
  /* Gradient */
  --hero-bg: linear-gradient(135deg, #1a1d27 0%, #1e1a35 50%, #1a1d27 100%);
  --nav-bg: rgba(15,17,23,0.92);
  /* Shape */
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 12px; --radius-full: 9999px;
  /* Typography scale */
  --text-xs:   0.7rem;
  --text-sm:   0.8rem;
  --text-base: 0.95rem;
  --text-lg:   1rem;
  --text-xl:   1.6rem;
  --text-2xl:  2rem;
  /* Motion */
  --dur-fast: 0.15s; --dur-base: 0.2s;
  /* Elevation */
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
  --shadow-md: 0 8px 28px rgba(0,0,0,0.4);
  /* Z-index scale */
  --z-sticky:   100;
  --z-float:    200;
  --z-modal:    700;
  --z-dropdown: 800;
}
[data-theme="light"] {
  --bg: #f5f6f8; --surface: #ffffff; --surface2: #f0f1f4; --surface3: #e8e9ee;
  --border: #dfe1e6; --text: #1a1d27; --text-dim: #5e6278;
  --accent: #7c3aed; --accent2: #6d28d9;
  --green:  #059669; --green-bg:  rgba(5,150,105,0.1);   --green-border:  rgba(5,150,105,0.25);
  --yellow: #d97706; --yellow-bg: rgba(217,119,6,0.1);   --yellow-border: rgba(217,119,6,0.25);
  --red:    #dc2626; --red-bg:    rgba(220,38,38,0.1);   --red-border:    rgba(220,38,38,0.25);
  --blue:   #2563eb; --blue-bg:   rgba(37,99,235,0.1);   --blue-border:   rgba(37,99,235,0.25);
  --purple: #7c3aed; --purple-bg: rgba(124,58,237,0.1);  --purple-border: rgba(124,58,237,0.25);
  --pink:   #c026d3; --pink-bg:   rgba(192,38,211,0.1);  --pink-border:   rgba(192,38,211,0.25);
  --orange: #ea580c; --orange-bg: rgba(234,88,12,0.1);   --orange-border: rgba(234,88,12,0.25);
  --slate:  #64748b; --slate-bg:  rgba(100,116,139,0.1); --slate-border:  rgba(100,116,139,0.25);
  --teal:   #0d9488; --teal-bg:   rgba(13,148,136,0.1);  --teal-border:   rgba(13,148,136,0.25);
  --hero-bg: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 50%, #e0e7ff 100%);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 8px 28px rgba(0,0,0,0.15);
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }

.theme-toggle { position:fixed;top:16px;right:16px;z-index:var(--z-float);width:40px;height:40px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--dur-base);box-shadow:var(--shadow-sm); }
.theme-toggle:hover { transform:scale(1.1); }

/* ── 히어로 ── */
.hero { background:var(--hero-bg);border-bottom:1px solid var(--border);padding:56px 40px 40px;position:relative;overflow:hidden; }
.hero::before { content:'';position:absolute;top:-40%;right:-5%;width:500px;height:500px;background:radial-gradient(circle,var(--purple-bg) 0%,transparent 65%); }
.hero-inner { max-width:1100px;margin:0 auto;position:relative; }
.hero-eyebrow { font-size:var(--text-xs);color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px; }
.hero h1 { font-size:var(--text-2xl);font-weight:800;letter-spacing:-0.4px;margin-bottom:8px; }
.hero h1 span { background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
.hero-sub { color:var(--text-dim);font-size:var(--text-base);margin-bottom:24px; }

.kpi-row { display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:24px; }
.kpi-card { background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px; }
[data-theme="light"] .kpi-card { background:rgba(0,0,0,0.03); }
.kpi-label { font-size:var(--text-xs);color:var(--text-dim);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px; }
.kpi-value { font-size:var(--text-xl);font-weight:800;line-height:1; }
.kpi-value--accent { color:var(--accent); }
.kpi-value--blue   { color:var(--blue); }
.kpi-value--yellow { color:var(--yellow); }
.kpi-value--green  { color:var(--green); }
.kpi-sub { font-size:var(--text-xs);color:var(--text-dim);margin-top:4px; }

/* ── 필터 바 ── */
.filter-bar { background:var(--surface);border-bottom:1px solid var(--border);padding:0 40px;display:flex;align-items:center;gap:8px;height:48px;overflow-x:auto;position:sticky;top:0;z-index:var(--z-sticky); }
.filter-bar::-webkit-scrollbar { height:0; }
.filter-btn { background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:4px 14px;border-radius:var(--radius-full);font-size:var(--text-sm);cursor:pointer;transition:all var(--dur-fast);white-space:nowrap;flex-shrink:0; }
.filter-btn:hover { border-color:var(--accent);color:var(--accent); }
.filter-btn.active { background:var(--purple-bg);border-color:var(--accent);color:var(--accent2); }
.filter-sep { width:1px;height:20px;background:var(--border);flex-shrink:0; }
.sort-label { font-size:var(--text-xs);color:var(--text-dim);white-space:nowrap; }

/* ── 메인 ── */
.main { max-width:1100px;margin:0 auto;padding:32px 40px 80px; }

.list-header { display:flex;align-items:center;gap:10px;margin-bottom:16px; }
.list-title { font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim); }
.count-badge { background:var(--surface2);color:var(--text-dim);font-size:var(--text-xs);padding:2px 10px;border-radius:var(--radius-md); }
.drag-hint { margin-left:auto;font-size:var(--text-xs);color:var(--text-dim); }

/* ── 카드 ── */
.spec-list { display:flex;flex-direction:column;gap:8px; }

.spec-card {
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px 20px;cursor:pointer;transition:all var(--dur-fast);
  display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:14px;
  text-decoration:none;color:inherit;user-select:none;
}
.spec-card:hover { border-color:var(--purple-border);background:var(--surface2);transform:translateX(2px);text-decoration:none; }
.spec-card.dragging { opacity:0.3; }
.spec-card.drag-over { border-color:var(--accent);border-style:dashed; }
.spec-card.status-done { opacity:0.45; }
.spec-card.status-done .spec-title { text-decoration:line-through;color:var(--text-dim); }

.drag-handle { color:var(--border);font-size:18px;cursor:grab;transition:color var(--dur-fast); }
.spec-card:hover .drag-handle { color:var(--text-dim); }

.spec-num { font-family:monospace;font-size:var(--text-xs);color:var(--text-dim);background:var(--surface2);padding:2px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);white-space:nowrap; }

.spec-info { min-width:0; }
.spec-title { font-size:var(--text-base);font-weight:700;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.spec-meta  { display:flex;align-items:center;gap:6px;flex-wrap:wrap; }

/* ── 배지 (토큰 참조) ── */
.badge { display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:var(--radius-md);font-size:var(--text-xs);font-weight:600; }
.badge-ux       { color:var(--pink);   background:var(--pink-bg);   border:1px solid var(--pink-border);   }
.badge-review   { color:var(--blue);   background:var(--blue-bg);   border:1px solid var(--blue-border);   }
.badge-feature  { color:var(--green);  background:var(--green-bg);  border:1px solid var(--green-border);  }
.badge-balance  { color:var(--yellow); background:var(--yellow-bg); border:1px solid var(--yellow-border); }
.badge-bug      { color:var(--red);    background:var(--red-bg);    border:1px solid var(--red-border);    }
.badge-content  { color:var(--orange); background:var(--orange-bg); border:1px solid var(--orange-border); }
.badge-monetize { color:var(--teal);   background:var(--teal-bg);   border:1px solid var(--teal-border);   }
.badge-etc      { color:var(--slate);  background:var(--slate-bg);  border:1px solid var(--slate-border);  }

.pri-badge { font-size:var(--text-xs);font-weight:700;padding:2px 9px;border-radius:var(--radius-md);border:1px solid;cursor:pointer;transition:all var(--dur-fast);background:transparent; }
.pri-high { color:var(--red);    border-color:var(--red-border);    }
.pri-mid  { color:var(--yellow); border-color:var(--yellow-border); }
.pri-low  { color:var(--text-dim);border-color:var(--border);       }
.pri-badge:hover { opacity:0.7; }

.status-pill { font-size:var(--text-xs);padding:2px 8px;border-radius:var(--radius-md);border:1px solid;font-weight:600; }
.status-open { color:var(--blue);     border-color:var(--blue-border);   background:var(--blue-bg);   }
.status-wip  { color:var(--yellow);   border-color:var(--yellow-border); background:var(--yellow-bg); }
.status-done { color:var(--green);    border-color:var(--green-border);  background:var(--green-bg);  }
.status-hold { color:var(--text-dim); border-color:var(--border);        background:var(--surface2);  }

.spec-date  { font-size:var(--text-xs);color:var(--text-dim); }
.spec-arrow { color:var(--border);font-size:var(--text-lg);transition:all var(--dur-fast); }
.spec-card:hover .spec-arrow { color:var(--accent);transform:translateX(2px); }

/* ── 섹션 구분 ── */
.section-divider { font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);padding:20px 0 8px;border-bottom:1px solid var(--border);margin-bottom:12px; }

/* ── 빈 상태 ── */
.empty-state { text-align:center;padding:80px 20px;color:var(--text-dim); }
.empty-state .icon { font-size:40px;margin-bottom:14px; }
.empty-state p { font-size:var(--text-base);line-height:1.8; }

::-webkit-scrollbar { width:5px;height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border);border-radius:3px; }

/* ── 빈 섹션 드롭존 ── */
.section-empty { border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:18px;text-align:center;color:var(--text-dim);font-size:var(--text-xs);margin-bottom:4px;transition:all var(--dur-fast); }
.section-empty.drag-over { border-color:var(--accent);background:var(--purple-bg);color:var(--accent); }

/* ── 완료/아카이브 박스 행 ── */
.boxes-row { display:flex;gap:12px;margin-bottom:4px; }
.boxes-row > * { flex:1;min-width:0; }

/* ── 완료함 ── */
.done-box { background:linear-gradient(160deg,var(--green-bg) 0%,rgba(52,211,153,0.03) 100%);border:1.5px solid var(--green-border);border-radius:var(--radius-lg);padding:22px 16px;cursor:pointer;transition:all var(--dur-base);user-select:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px; }
.done-box:hover,.done-box.drag-over { border-color:var(--green);background:linear-gradient(160deg,rgba(52,211,153,0.18) 0%,rgba(52,211,153,0.07) 100%);transform:translateY(-2px);box-shadow:0 6px 24px rgba(52,211,153,0.15); }
.done-box-icon { font-size:2.2rem;line-height:1; }
.done-box-label { font-weight:700;font-size:var(--text-sm);color:var(--text); }
.done-box-hint { font-size:var(--text-xs);color:var(--text-dim); }
.done-count { background:rgba(52,211,153,0.15);color:var(--green);border:1px solid var(--green-border);font-size:var(--text-xs);font-weight:700;padding:2px 12px;border-radius:var(--radius-full);margin-top:2px; }

/* ── 아카이브함 ── */
.archive-box { background:linear-gradient(160deg,var(--slate-bg) 0%,rgba(148,163,184,0.02) 100%);border:1.5px solid var(--slate-border);border-radius:var(--radius-lg);padding:22px 16px;cursor:pointer;transition:all var(--dur-base);user-select:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px; }
.archive-box:hover,.archive-box.drag-over { border-color:var(--text-dim);background:linear-gradient(160deg,rgba(148,163,184,0.15) 0%,rgba(148,163,184,0.05) 100%);transform:translateY(-2px);box-shadow:0 6px 24px rgba(148,163,184,0.1); }
.archive-count { background:var(--slate-bg);color:var(--text-dim);border:1px solid var(--slate-border);font-size:var(--text-xs);font-weight:700;padding:2px 12px;border-radius:var(--radius-full);margin-top:2px; }

/* ── 공통 시트 모달 ── */
@keyframes slideUp { from{transform:translateY(32px);opacity:0}to{transform:translateY(0);opacity:1} }

.sheet-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:var(--z-modal);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px); }
.sheet-overlay.open { display:flex; }
.sheet-modal { background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:860px;max-height:80vh;display:flex;flex-direction:column;animation:slideUp var(--dur-base) ease; }
.sheet-header { display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px;border-bottom:1px solid var(--border);flex-shrink:0; }
.sheet-title { font-size:var(--text-lg);font-weight:700;display:flex;align-items:center;gap:10px; }
.sheet-close { background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;font-size:var(--text-sm);display:flex;align-items:center;justify-content:center;transition:all var(--dur-fast); }
.sheet-close:hover { color:var(--text);border-color:var(--accent); }
.sheet-body { overflow-y:auto;padding:16px 24px 32px;display:flex;flex-direction:column;gap:8px; }

/* ── restore 버튼 ── */
.restore-btn { background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:5px 12px;border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:600;cursor:pointer;transition:all var(--dur-fast);white-space:nowrap;flex-shrink:0; }
.restore-btn:hover { border-color:var(--accent);color:var(--accent);background:var(--purple-bg); }

/* ── 메타 드롭다운 ── */
.meta-dropdown { position:fixed;z-index:var(--z-dropdown);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:5px;min-width:130px;display:none; }
.meta-dropdown.open { display:block; }
.dd-label { font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);padding:5px 10px 3px; }
.dd-item { display:flex;align-items:center;padding:7px 10px;border-radius:var(--radius-sm);font-size:var(--text-sm);cursor:pointer;color:var(--text);transition:background var(--dur-fast);white-space:nowrap;gap:6px; }
.dd-item:hover { background:var(--surface2); }
.dd-item.active { color:var(--accent);font-weight:700;background:var(--purple-bg); }
</style>
</head>
<body>

<!-- ── 히어로 ── -->
<div class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">Solitaire TriPeaks · Update Planning</div>
    <h1>업데이트 스펙 <span>인덱스</span></h1>
    <p class="hero-sub">게임 리뷰 &amp; 개선 아이디어를 기획서로 관리합니다. 카드를 드래그해 우선순위를 조정하세요.</p>
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">전체 기획서</div>
        <div class="kpi-value kpi-value--accent" id="statTotal">0</div>
        <div class="kpi-sub">누적 아이템</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">검토중</div>
        <div class="kpi-value kpi-value--blue" id="statOpen">0</div>
        <div class="kpi-sub">미착수</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">진행중</div>
        <div class="kpi-value kpi-value--yellow" id="statWip">0</div>
        <div class="kpi-sub">작업 중</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">완료</div>
        <div class="kpi-value kpi-value--green" id="statDone">0</div>
        <div class="kpi-sub">확정·완료</div>
      </div>
    </div>
  </div>
</div>

<!-- ── 필터 바 ── -->
<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('all')">전체</button>
  <button class="filter-btn" onclick="setFilter('review')">🔍 리뷰</button>
  <button class="filter-btn" onclick="setFilter('feature')">✨ 기능</button>
  <button class="filter-btn" onclick="setFilter('balance')">⚖️ 밸런스</button>
  <button class="filter-btn" onclick="setFilter('bug')">🐛 버그</button>
  <button class="filter-btn" onclick="setFilter('ux')">🎨 UX/UI</button>
  <button class="filter-btn" onclick="setFilter('content')">📦 콘텐츠</button>
  <button class="filter-btn" onclick="setFilter('monetize')">💰 수익화</button>
  <div class="filter-sep"></div>
  <span class="sort-label">↕ 드래그로 순서 변경 &nbsp;·&nbsp; 배지 클릭 → 드롭다운으로 태그·우선순위·상태 변경</span>
</div>

<!-- ── 리스트 ── -->
<div class="main">
  <div class="list-header">
    <span class="list-title">기획서 목록</span>
    <span class="count-badge" id="countBadge">0</span>
  </div>
  <div class="spec-list" id="specList"
       ondragover="onDragOver(event)" ondrop="onDrop(event)"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="icon">📄</div>
    <p>아직 기획서가 없습니다.<br>Claude에게 아이디어를 던지면<br>기획서 파일을 만들어드립니다.</p>
  </div>
</div>

<div class="meta-dropdown" id="metaDropdown"></div>

<!-- ── 완료 모달 ── -->
<div class="sheet-overlay" id="doneOverlay" onclick="closeDoneModal(event)">
  <div class="sheet-modal" onclick="event.stopPropagation()">
    <div class="sheet-header">
      <div class="sheet-title">📦 완료된 기획서 <span class="done-count" id="doneModalCount"></span></div>
      <button class="sheet-close" onclick="closeDoneModal()">✕</button>
    </div>
    <div class="sheet-body" id="doneModalList"></div>
  </div>
</div>

<!-- ── 아카이브 모달 ── -->
<div class="sheet-overlay" id="archiveOverlay" onclick="closeArchiveModal(event)">
  <div class="sheet-modal" onclick="event.stopPropagation()">
    <div class="sheet-header">
      <div class="sheet-title">🗄️ 아카이브된 기획서 <span class="archive-count" id="archiveModalCount"></span></div>
      <button class="sheet-close" onclick="closeArchiveModal()">✕</button>
    </div>
    <div class="sheet-body" id="archiveModalList"></div>
  </div>
</div>

<script>
// ── 기획서 목록 ── 새 기획서 추가 시 여기에 push ──────────
const SPECS = [
  {
    id: 'spec-001', file: 'spec-001-daily-task-alert.html',
    title: '데일리 태스크 달성 플로팅 알럿',
    tag: 'ux', priority: 'mid', status: 'open', date: '2026. 4. 2.',
  },
  {
    id: 'spec-002', file: 'spec-002-share-surfaces.html',
    title: '공유 지면 3종 설계',
    tag: 'ux', priority: 'mid', status: 'open', date: '2026. 4. 2.',
  },
  {
    id: 'spec-003', file: 'spec-003-rv-milestone.html',
    title: 'RV 누적 마일스톤 보상',
    tag: 'monetize', priority: 'mid', status: 'open', date: '2026. 4. 2.',
  },
  {
    id: 'spec-004', file: 'spec-004-explorer-rush.html',
    title: 'Explorer Rush',
    tag: 'ux', priority: 'mid', status: 'open', date: '2026. 4. 3.',
  },
  {
    id: 'spec-005', file: 'spec-005-streak-blaze.html',
    title: 'Streak Blaze',
    tag: 'ux', priority: 'mid', status: 'open', date: '2026. 4. 3.',
  },
  {
    id: 'spec-006', file: 'spec-006-friend-o-meter.html',
    title: 'Friend-O-Meter',
    tag: 'social', priority: 'mid', status: 'open', date: '2026. 4. 3.',
  },
];

// ── 상수 ──────────────────────────────────────────────────
const TAG_INFO = {
  review:   { label: '🔍 리뷰',   cls: 'badge-review'   },
  feature:  { label: '✨ 기능',   cls: 'badge-feature'  },
  balance:  { label: '⚖️ 밸런스', cls: 'badge-balance'  },
  bug:      { label: '🐛 버그',   cls: 'badge-bug'      },
  ux:       { label: '🎨 UX/UI',  cls: 'badge-ux'       },
  content:  { label: '📦 콘텐츠', cls: 'badge-content'  },
  monetize: { label: '💰 수익화', cls: 'badge-monetize' },
  etc:      { label: '📌 기타',   cls: 'badge-etc'      },
};
const PRI_LABEL  = { high: '🔴 높음', mid: '🟡 보통', low: '⚪ 낮음' };
const PRI_CYCLE    = { high: 'mid', mid: 'low', low: 'high' };
const STATUS_CYCLE = { open: 'wip', wip: 'done', done: 'hold', hold: 'open' };
const TAG_CYCLE    = ['review','feature','balance','bug','ux','content','monetize','etc'];
const STATUS_INFO = {
  open:    { label: '🔵 검토중',    cls: 'status-open' },
  wip:     { label: '🟡 진행중',    cls: 'status-wip'  },
  done:    { label: '✅ 완료',      cls: 'status-done' },
  archive: { label: '🗄️ 아카이브', cls: 'status-hold' },
  hold:    { label: '⏸ 보류',      cls: 'status-hold' },
};

let activeFilter = 'all';
let dragSrcId    = null;

// ── 로컬 오버라이드 ────────────────────────────────────────
function getOv()   { return JSON.parse(localStorage.getItem('spec-ov')    || '{}'); }
function getOrder(){ return JSON.parse(localStorage.getItem('spec-order') || '[]'); }
function saveOv(ov)   { localStorage.setItem('spec-ov',    JSON.stringify(ov));    }
function saveOrder(o) { localStorage.setItem('spec-order', JSON.stringify(o));     }
function applyOv(id, key, val) {
  const ov = getOv(); if (!ov[id]) ov[id] = {};
  ov[id][key] = val; saveOv(ov);
}

function buildList() {
  const ov    = getOv();
  const order = getOrder();
  let items   = SPECS.map(s => ({ ...s, ...(ov[s.id] || {}) }));
  if (order.length) {
    const map    = Object.fromEntries(items.map(i => [i.id, i]));
    const sorted = order.map(id => map[id]).filter(Boolean);
    const rest   = items.filter(i => !order.includes(i.id));
    items = [...sorted, ...rest];
  }
  if (activeFilter !== 'all') items = items.filter(i => i.tag === activeFilter);
  return items;
}

const STATUS_SECTIONS = [
  { key: 'open',  label: '🔵 검토중' },
  { key: 'wip',   label: '🟡 진행중' },
  { key: 'hold',  label: '⏸ 보류'   },
  { key: 'boxes', label: '📦 완료 · 아카이브' },
];

// ── 렌더 ──────────────────────────────────────────────────
function render() {
  const items     = buildList();
  const all       = SPECS.map(s => ({ ...s, ...(getOv()[s.id] || {}) }));
  const container = document.getElementById('specList');
  const empty     = document.getElementById('emptyState');

  // KPI 업데이트
  document.getElementById('statTotal').textContent = all.length;
  document.getElementById('statOpen').textContent  = all.filter(i => i.status === 'open').length;
  document.getElementById('statWip').textContent   = all.filter(i => i.status === 'wip').length;
  document.getElementById('statDone').textContent  = all.filter(i => i.status === 'done').length;
  document.getElementById('countBadge').textContent = items.length;

  if (!items.length) { container.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  let html = '';
  STATUS_SECTIONS.forEach(sec => {
    const group = sec.key === 'boxes'
      ? items.filter(i => i.status === 'done' || i.status === 'archive')
      : items.filter(i => (i.status || 'open') === sec.key);
    html += `<div class="section-divider">${sec.label} <span style="font-weight:400;opacity:0.55;font-size:var(--text-xs)">${group.length}</span></div>`;
    if (sec.key === 'boxes') {
      const doneGroup    = items.filter(i => (i.status || 'open') === 'done');
      const archiveGroup = items.filter(i => i.status === 'archive');
      html += `<div class="boxes-row">
        <div class="done-box" onclick="openDoneModal()"
          ondragover="onDragOverEmpty(event)" ondragleave="onDragLeaveEmpty(event)"
          ondrop="onDropEmpty(event,'done')">
          <div class="done-box-icon">📦</div>
          <div class="done-box-label">완료함</div>
          <div class="done-box-hint">클릭해서 열기 · 드래그로 완료 처리</div>
          <span class="done-count">${doneGroup.length}개</span>
        </div>
        <div class="archive-box" onclick="openArchiveModal()"
          ondragover="onDragOverEmpty(event)" ondragleave="onDragLeaveEmpty(event)"
          ondrop="onDropEmpty(event,'archive')">
          <div class="done-box-icon">🗄️</div>
          <div class="done-box-label">아카이브함</div>
          <div class="done-box-hint">클릭해서 열기 · 드래그로 아카이브 처리</div>
          <span class="archive-count">${archiveGroup.length}개</span>
        </div>
      </div>`;
    } else if (group.length) {
      html += group.map(item => renderCard(item)).join('');
    } else {
      html += `<div class="section-empty" data-status="${sec.key}"
        ondragover="onDragOverEmpty(event)" ondragleave="onDragLeaveEmpty(event)"
        ondrop="onDropEmpty(event,'${sec.key}')">여기로 드래그하세요</div>`;
    }
  });
  container.innerHTML = html;
  if (doneModalOpen) renderDoneModal();
  if (archiveModalOpen) renderArchiveModal();

  // 필터 버튼 active 동기화
  document.querySelectorAll('.filter-btn').forEach(b => {
    const f = b.getAttribute('onclick').match(/'(\w+)'/)?.[1];
    b.classList.toggle('active', f === activeFilter);
  });
}

function renderCard(item) {
  const tag    = TAG_INFO[item.tag]       || TAG_INFO.etc;
  const status = STATUS_INFO[item.status] || STATUS_INFO.open;
  return `
<div class="spec-card ${item.status==='done'?'status-done':''}"
     data-id="${item.id}" draggable="true"
     ondragstart="onDragStart(event,'${item.id}')"
     ondragend="onDragEnd()"
     onclick="goTo('${item.file}')">
  <span class="drag-handle">⠿</span>
  <span class="spec-num">${item.id.toUpperCase()}</span>
  <div class="spec-info">
    <div class="spec-title">${escHtml(item.title)}</div>
    <div class="spec-meta">
      <span class="badge ${tag.cls}" onclick="openDropdown(event,'${item.id}','tag')" title="태그 변경" style="cursor:pointer">${tag.label}</span>
      <span class="pri-badge pri-${item.priority}"
            onclick="openDropdown(event,'${item.id}','priority')"
            title="우선순위 변경">${PRI_LABEL[item.priority]}</span>
      <span class="status-pill ${status.cls}" onclick="openDropdown(event,'${item.id}','status')" title="상태 변경" style="cursor:pointer">${status.label}</span>
      <span class="spec-date">${item.date}</span>
    </div>
  </div>
  <span class="spec-arrow">→</span>
</div>`;
}

function goTo(file) { window.location.href = file; }

function setFilter(tag) { activeFilter = tag; render(); }

const DD_OPTIONS = {
  tag: [
    { val:'review',   label:'🔍 리뷰'   },
    { val:'feature',  label:'✨ 기능'   },
    { val:'balance',  label:'⚖️ 밸런스' },
    { val:'bug',      label:'🐛 버그'   },
    { val:'ux',       label:'🎨 UX/UI'  },
    { val:'content',  label:'📦 콘텐츠' },
    { val:'monetize', label:'💰 수익화' },
    { val:'etc',      label:'📌 기타'   },
  ],
  priority: [
    { val:'high', label:'🔴 높음' },
    { val:'mid',  label:'🟡 보통' },
    { val:'low',  label:'⚪ 낮음' },
  ],
  status: [
    { val:'open',    label:'🔵 검토중'    },
    { val:'wip',     label:'🟡 진행중'    },
    { val:'done',    label:'✅ 완료'      },
    { val:'archive', label:'🗄️ 아카이브' },
    { val:'hold',    label:'⏸ 보류'      },
  ],
};
const DD_LABEL = { tag:'태그', priority:'우선순위', status:'상태' };
let ddCtx = null;

function openDropdown(e, id, field) {
  e.stopPropagation();
  const dd  = document.getElementById('metaDropdown');
  const ov  = getOv();
  const cur = (ov[id] && ov[id][field]) || SPECS.find(s => s.id === id)?.[field] || '';

  dd.innerHTML =
    `<div class="dd-label">${DD_LABEL[field]}</div>` +
    DD_OPTIONS[field].map(o =>
      `<div class="dd-item${o.val === cur ? ' active' : ''}" data-val="${o.val}">${o.label}</div>`
    ).join('');

  const rect = e.currentTarget.getBoundingClientRect();
  dd.style.left = Math.min(rect.left, window.innerWidth - 160) + 'px';
  dd.style.top  = (rect.bottom + 5) + 'px';
  dd.classList.add('open');
  ddCtx = { id, field };
}

document.addEventListener('click', () => {
  document.getElementById('metaDropdown')?.classList.remove('open');
  ddCtx = null;
});
document.getElementById('metaDropdown')?.addEventListener('click', e => {
  e.stopPropagation();
  const item = e.target.closest('.dd-item');
  if (!item || !ddCtx) return;
  applyOv(ddCtx.id, ddCtx.field, item.dataset.val);
  document.getElementById('metaDropdown').classList.remove('open');
  ddCtx = null;
  render();
});

// ── 드래그 앤 드롭 ────────────────────────────────────────
function onDragStart(e, id) {
  dragSrcId = id; e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => { const el = document.querySelector(`[data-id="${id}"]`); if (el) el.classList.add('dragging'); }, 0);
}
function onDragEnd() {
  dragSrcId = null;
  document.querySelectorAll('.spec-card').forEach(c => c.classList.remove('dragging','drag-over'));
  document.querySelectorAll('.section-empty,.done-box,.archive-box').forEach(z => z.classList.remove('drag-over'));
}
function onDragOver(e) {
  e.preventDefault();
  const t = e.target.closest('.spec-card');
  document.querySelectorAll('.spec-card').forEach(c => c.classList.remove('drag-over'));
  if (t && t.dataset.id !== dragSrcId) t.classList.add('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  const t = e.target.closest('.spec-card');
  if (!t || !dragSrcId || t.dataset.id === dragSrcId) return;
  const allItems     = buildList();
  const targetStatus = allItems.find(i => i.id === t.dataset.id)?.status || 'open';
  const srcStatus    = allItems.find(i => i.id === dragSrcId)?.status    || 'open';
  if (targetStatus !== srcStatus) applyOv(dragSrcId, 'status', targetStatus);
  const ids = buildList().map(i => i.id);
  const si  = ids.indexOf(dragSrcId), ti = ids.indexOf(t.dataset.id);
  if (si === -1 || ti === -1) { render(); return; }
  ids.splice(si, 1); ids.splice(ti, 0, dragSrcId);
  saveOrder(ids); render();
}
function onDragOverEmpty(e) {
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.add('drag-over');
}
function onDragLeaveEmpty(e) {
  e.currentTarget.classList.remove('drag-over');
}
function onDropEmpty(e, statusKey) {
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');
  if (!dragSrcId) return;
  applyOv(dragSrcId, 'status', statusKey);
  render();
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 완료 모달 ────────────────────────────────────────────
let doneModalOpen = false;

function openDoneModal() {
  doneModalOpen = true;
  renderDoneModal();
  document.getElementById('doneOverlay').classList.add('open');
}

function closeDoneModal(e) {
  if (e && e.target !== document.getElementById('doneOverlay')) return;
  doneModalOpen = false;
  document.getElementById('doneOverlay').classList.remove('open');
}

function renderDoneCard(item) {
  const tag = TAG_INFO[item.tag] || TAG_INFO.etc;
  return `
<div class="spec-card status-done" data-id="${item.id}" onclick="goTo('${item.file}')">
  <span class="spec-num">${item.id.toUpperCase()}</span>
  <div class="spec-info">
    <div class="spec-title">${escHtml(item.title)}</div>
    <div class="spec-meta">
      <span class="badge ${tag.cls}" onclick="openDropdown(event,'${item.id}','tag')" title="태그 변경" style="cursor:pointer">${tag.label}</span>
      <span class="pri-badge pri-${item.priority}" onclick="openDropdown(event,'${item.id}','priority')" title="우선순위 변경">${PRI_LABEL[item.priority]}</span>
      <span class="spec-date">${item.date}</span>
    </div>
  </div>
  <button class="restore-btn" onclick="restoreItem(event,'${item.id}')" title="보류로 되돌리기">↩ 꺼내기</button>
</div>`;
}

function restoreItem(e, id) {
  e.stopPropagation();
  applyOv(id, 'status', 'hold');
  render();
}

function renderDoneModal() {
  const ov   = getOv();
  const done = SPECS.map(s => ({ ...s, ...(ov[s.id] || {}) })).filter(i => i.status === 'done');
  const count = document.getElementById('doneModalCount');
  const list  = document.getElementById('doneModalList');
  if (count) count.textContent = done.length + '개';
  if (!list) return;
  if (!done.length) {
    list.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text-dim);font-size:var(--text-sm)">완료된 기획서가 없습니다.</div>';
    doneModalOpen = false;
    document.getElementById('doneOverlay').classList.remove('open');
    return;
  }
  list.innerHTML = done.map(item => renderDoneCard(item)).join('');
}

// ── 아카이브 모달 ─────────────────────────────────────────
let archiveModalOpen = false;

function openArchiveModal() {
  archiveModalOpen = true;
  renderArchiveModal();
  document.getElementById('archiveOverlay').classList.add('open');
}

function closeArchiveModal(e) {
  if (e && e.target !== document.getElementById('archiveOverlay')) return;
  archiveModalOpen = false;
  document.getElementById('archiveOverlay').classList.remove('open');
}

function renderArchiveCard(item) {
  const tag = TAG_INFO[item.tag] || TAG_INFO.etc;
  return `
<div class="spec-card status-done" data-id="${item.id}" onclick="goTo('${item.file}')">
  <span class="spec-num">${item.id.toUpperCase()}</span>
  <div class="spec-info">
    <div class="spec-title">${escHtml(item.title)}</div>
    <div class="spec-meta">
      <span class="badge ${tag.cls}" onclick="openDropdown(event,'${item.id}','tag')" title="태그 변경" style="cursor:pointer">${tag.label}</span>
      <span class="pri-badge pri-${item.priority}" onclick="openDropdown(event,'${item.id}','priority')" title="우선순위 변경">${PRI_LABEL[item.priority]}</span>
      <span class="spec-date">${item.date}</span>
    </div>
  </div>
  <button class="restore-btn" onclick="restoreFromArchive(event,'${item.id}')" title="보류로 되돌리기">↩ 꺼내기</button>
</div>`;
}

function restoreFromArchive(e, id) {
  e.stopPropagation();
  applyOv(id, 'status', 'hold');
  render();
}

function renderArchiveModal() {
  const ov       = getOv();
  const archived = SPECS.map(s => ({ ...s, ...(ov[s.id] || {}) })).filter(i => i.status === 'archive');
  const count    = document.getElementById('archiveModalCount');
  const list     = document.getElementById('archiveModalList');
  if (count) count.textContent = archived.length + '개';
  if (!list) return;
  if (!archived.length) {
    list.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text-dim);font-size:var(--text-sm)">아카이브된 기획서가 없습니다.</div>';
    archiveModalOpen = false;
    document.getElementById('archiveOverlay').classList.remove('open');
    return;
  }
  list.innerHTML = archived.map(item => renderArchiveCard(item)).join('');
}

render();
</script>

<script src="memo.js"></script>
</body>
