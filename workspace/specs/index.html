<script id="theme-init">(function(){var t=localStorage.getItem("spec-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");document.addEventListener("DOMContentLoaded",function(){var g=document.createElement("button");g.className="theme-toggle";g.title="라이트/다크 모드 전환";g.textContent=t==="light"?"☀️":"🌙";document.body.prepend(g);g.addEventListener("click",function(){var l=document.documentElement.getAttribute("data-theme")==="light";document.documentElement[l?"removeAttribute":"setAttribute"]("data-theme","light");g.textContent=l?"🌙":"☀️";localStorage.setItem("spec-theme",l?"dark":"light");});});})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>업데이트 스펙 인덱스 · Solitaire TriPeaks</title>

<style>
/* ── 디자인 토큰 ── */
:root {
  /* Surface */
  --bg: #0f1117; --surface: #1a1d27; --surface2: #222635; --surface3: #2a2e3f;
  --border: #2e3348;
  /* Text */
  --text: #e4e6f0; --text-dim: #9ea3b5;
  /* Brand */
  --accent: #a78bfa; --accent2: #c4b5fd;
  /* Semantic colors — value + bg + border 3종 세트 */
  --green:  #34d399; --green-bg:  rgba(52,211,153,0.12);  --green-border:  rgba(52,211,153,0.25);
  --yellow: #fbbf24; --yellow-bg: rgba(251,191,36,0.12);  --yellow-border: rgba(251,191,36,0.25);
  --red:    #f87171; --red-bg:    rgba(248,113,113,0.12); --red-border:    rgba(248,113,113,0.25);
  --blue:   #60a5fa; --blue-bg:   rgba(96,165,250,0.12);  --blue-border:   rgba(96,165,250,0.25);
  --purple: #a78bfa; --purple-bg: rgba(167,139,250,0.12); --purple-border: rgba(167,139,250,0.25);
  --pink:   #e879f9; --pink-bg:   rgba(232,121,249,0.12); --pink-border:   rgba(232,121,249,0.25);
  --orange: #fb923c; --orange-bg: rgba(251,146,60,0.12);  --orange-border: rgba(251,146,60,0.25);
  --slate:  #94a3b8; --slate-bg:  rgba(148,163,184,0.12); --slate-border:  rgba(148,163,184,0.25);
  --teal:   #2dd4bf; --teal-bg:   rgba(45,212,191,0.12);  --teal-border:   rgba(45,212,191,0.25);
  /* Gradient */
  --hero-bg: linear-gradient(135deg, #1a1d27 0%, #1e1a35 50%, #1a1d27 100%);
  --nav-bg: rgba(15,17,23,0.92);
  /* Shape */
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 12px; --radius-full: 9999px;
  /* Typography scale */
  --text-xs:   0.7rem;
  --text-sm:   0.8rem;
  --text-base: 0.95rem;
  --text-lg:   1rem;
  --text-xl:   1.6rem;
  --text-2xl:  2rem;
  /* Motion */
  --dur-fast: 0.15s; --dur-base: 0.2s;
  /* Elevation */
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
  --shadow-md: 0 8px 28px rgba(0,0,0,0.4);
  /* Z-index scale */
  --z-sticky:   100;
  --z-float:    200;
  --z-modal:    700;
  --z-dropdown: 800;
}
[data-theme="light"] {
  --bg: #f5f6f8; --surface: #ffffff; --surface2: #f0f1f4; --surface3: #e8e9ee;
  --border: #dfe1e6; --text: #1a1d27; --text-dim: #5e6278;
  --accent: #7c3aed; --accent2: #6d28d9;
  --green:  #059669; --green-bg:  rgba(5,150,105,0.1);   --green-border:  rgba(5,150,105,0.25);
  --yellow: #d97706; --yellow-bg: rgba(217,119,6,0.1);   --yellow-border: rgba(217,119,6,0.25);
  --red:    #dc2626; --red-bg:    rgba(220,38,38,0.1);   --red-border:    rgba(220,38,38,0.25);
  --blue:   #2563eb; --blue-bg:   rgba(37,99,235,0.1);   --blue-border:   rgba(37,99,235,0.25);
  --purple: #7c3aed; --purple-bg: rgba(124,58,237,0.1);  --purple-border: rgba(124,58,237,0.25);
  --pink:   #c026d3; --pink-bg:   rgba(192,38,211,0.1);  --pink-border:   rgba(192,38,211,0.25);
  --orange: #ea580c; --orange-bg: rgba(234,88,12,0.1);   --orange-border: rgba(234,88,12,0.25);
  --slate:  #64748b; --slate-bg:  rgba(100,116,139,0.1); --slate-border:  rgba(100,116,139,0.25);
  --teal:   #0d9488; --teal-bg:   rgba(13,148,136,0.1);  --teal-border:   rgba(13,148,136,0.25);
  --hero-bg: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 50%, #e0e7ff 100%);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 8px 28px rgba(0,0,0,0.15);
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }

.theme-toggle { position:fixed;top:16px;right:16px;z-index:var(--z-float);width:40px;height:40px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--dur-base);box-shadow:var(--shadow-sm); }
.theme-toggle:hover { transform:scale(1.1); }

/* ── 히어로 ── */
.hero { background:var(--hero-bg);border-bottom:1px solid var(--border);padding:56px 40px 40px;position:relative;overflow:hidden; }
.hero::before { content:'';position:absolute;top:-40%;right:-5%;width:500px;height:500px;background:radial-gradient(circle,var(--purple-bg) 0%,transparent 65%); }
.hero-inner { max-width:1100px;margin:0 auto;position:relative; }
.hero-eyebrow { font-size:var(--text-xs);color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px; }
.hero h1 { font-size:var(--text-2xl);font-weight:800;letter-spacing:-0.4px;margin-bottom:8px; }
.hero h1 span { background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
.hero-sub { color:var(--text-dim);font-size:var(--text-base);margin-bottom:24px; }

.kpi-row { display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:24px; }
.kpi-card { background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px; }
[data-theme="light"] .kpi-card { background:rgba(0,0,0,0.03); }
.kpi-label { font-size:var(--text-xs);color:var(--text-dim);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px; }
.kpi-value { font-size:var(--text-xl);font-weight:800;line-height:1; }
.kpi-value--accent { color:var(--accent); }
.kpi-value--blue   { color:var(--blue); }
.kpi-value--yellow { color:var(--yellow); }
.kpi-value--green  { color:var(--green); }
.kpi-sub { font-size:var(--text-xs);color:var(--text-dim);margin-top:4px; }
.kpi-sparkline { display:none;margin-top:12px;height:48px;border:1px solid var(--border);border-radius:var(--radius-lg);background:rgba(255,255,255,0.035);padding:6px 10px; }
[data-theme="light"] .kpi-sparkline { background:rgba(0,0,0,0.025); }
.kpi-sparkline svg { display:block;width:100%;height:100%;overflow:visible; }
.kpi-sparkline .spark-label { fill:var(--text-dim);font-size:10px; }

/* ── 필터 바 ── */
.filter-bar { background:var(--surface);border-bottom:1px solid var(--border);padding:0 40px;display:flex;align-items:center;gap:8px;height:48px;overflow-x:auto;position:sticky;top:0;z-index:var(--z-sticky); }
.filter-bar::-webkit-scrollbar { height:0; }
.filter-btn { background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:4px 14px;border-radius:var(--radius-full);font-size:var(--text-sm);cursor:pointer;transition:all var(--dur-fast);white-space:nowrap;flex-shrink:0; }
.filter-btn:hover { border-color:var(--accent);color:var(--accent); }
.filter-btn.active { background:var(--purple-bg);border-color:var(--accent);color:var(--accent2); }
.filter-sep { width:1px;height:20px;background:var(--border);flex-shrink:0; }
.sort-label { font-size:var(--text-xs);color:var(--text-dim);white-space:nowrap; }
.filter-search { margin-left:auto;position:relative;display:flex;align-items:center;min-width:220px;flex:0 0 240px; }
.filter-search input { width:100%;height:30px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-full);color:var(--text);font-size:var(--text-sm);padding:4px 32px 4px 12px;outline:none; }
.filter-search input:focus { border-color:var(--accent);box-shadow:0 0 0 2px var(--purple-bg); }
.filter-search input::placeholder { color:var(--text-dim); }
.search-clear { position:absolute;right:5px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;background:transparent;color:var(--text-dim);font-size:15px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;border-radius:var(--radius-full); }
.filter-search.has-value .search-clear { display:flex; }
.search-clear:hover { color:var(--text);background:var(--surface3); }

/* ── 메인 ── */
.main { max-width:1100px;margin:0 auto;padding:32px 40px 80px; }

.list-header { display:flex;align-items:center;gap:10px;margin-bottom:16px; }
.list-title { font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim); }
.count-badge { background:var(--surface2);color:var(--text-dim);font-size:var(--text-xs);padding:2px 10px;border-radius:var(--radius-md); }
.drag-hint { margin-left:auto;font-size:var(--text-xs);color:var(--text-dim); }
.list-actions { margin-left:auto;display:flex;align-items:center;gap:8px;position:relative; }
.header-btn,.sort-select { height:30px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);font-size:var(--text-xs);padding:0 10px;cursor:pointer; }
.header-btn:hover,.sort-select:hover { border-color:var(--accent);color:var(--accent); }
.export-wrap { position:relative; }
.export-menu { position:absolute;right:0;top:calc(100% + 6px);z-index:var(--z-dropdown);min-width:130px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:5px;display:none; }
.export-menu.open { display:block; }
.export-menu button { width:100%;background:transparent;border:0;color:var(--text);font-size:var(--text-sm);padding:7px 10px;border-radius:var(--radius-sm);text-align:left;cursor:pointer; }
.export-menu button:hover { background:var(--surface2); }

/* ── 카드 ── */
.spec-list { display:flex;flex-direction:column;gap:8px; }

.spec-card {
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:12px 14px;cursor:pointer;transition:all var(--dur-fast);
  display:grid;grid-template-columns:16px 36px 1fr auto;align-items:start;gap:10px;
  text-decoration:none;color:inherit;user-select:none;
}
.spec-card:hover { border-color:var(--purple-border);background:var(--surface2);transform:translateX(2px);text-decoration:none; }
.spec-card.dragging { opacity:0.3; }
.spec-card.drag-over { border-color:var(--accent);border-style:dashed; }
.spec-card.status-done { opacity:0.45; }
.spec-card.status-done .spec-title { text-decoration:line-through;color:var(--text-dim); }
.spec-card.drag-disabled { cursor:pointer; }
.spec-card.drag-disabled .drag-handle { opacity:0.3;cursor:default; }
.sheet-body .spec-card { grid-template-columns:1fr auto; }

.drag-handle { color:var(--border);font-size:18px;cursor:grab;transition:color var(--dur-fast);text-align:center; }
.spec-card:hover .drag-handle { color:var(--text-dim); }
.bulk-select { width:16px;height:16px;accent-color:var(--accent);opacity:0;pointer-events:none;transition:opacity var(--dur-fast); }
.spec-card:hover .bulk-select, body.has-bulk-selection .bulk-select { opacity:1;pointer-events:auto; }

.spec-num { display:inline-block;font-family:monospace;font-size:10px;color:var(--text-dim);background:var(--surface2);padding:1px 6px;border-radius:var(--radius-sm);border:1px solid var(--border);white-space:nowrap;margin-bottom:4px; }

.spec-info { min-width:0; }
.spec-title { font-size:var(--text-base);font-weight:700;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.spec-meta  { display:flex;align-items:center;gap:6px;flex-wrap:wrap; }
.history-line { flex-basis:100%;font-size:var(--text-xs);color:var(--text-dim);line-height:1.4;margin-top:1px; }
.due-chip,.related-chip { display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);font-weight:700;padding:2px 8px;border-radius:var(--radius-md);border:1px solid;cursor:pointer; }
.due-green { color:var(--green);background:var(--green-bg);border-color:var(--green-border); }
.due-yellow { color:var(--yellow);background:var(--yellow-bg);border-color:var(--yellow-border); }
.due-red { color:var(--red);background:var(--red-bg);border-color:var(--red-border); }
.related-chip { color:var(--text-dim);background:var(--surface2);border-color:var(--border);text-decoration:none; }
.related-chip:hover { color:var(--accent);border-color:var(--accent); }

/* ── 배지 (토큰 참조) ── */
.badge { display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:var(--radius-md);font-size:var(--text-xs);font-weight:600; }
.badge-ux       { color:var(--pink);   background:var(--pink-bg);   border:1px solid var(--pink-border);   }
.badge-review   { color:var(--blue);   background:var(--blue-bg);   border:1px solid var(--blue-border);   }
.badge-feature  { color:var(--green);  background:var(--green-bg);  border:1px solid var(--green-border);  }
.badge-balance  { color:var(--yellow); background:var(--yellow-bg); border:1px solid var(--yellow-border); }
.badge-bug      { color:var(--red);    background:var(--red-bg);    border:1px solid var(--red-border);    }
.badge-content  { color:var(--orange); background:var(--orange-bg); border:1px solid var(--orange-border); }
.badge-monetize { color:var(--teal);   background:var(--teal-bg);   border:1px solid var(--teal-border);   }
.badge-social   { color:var(--blue);   background:var(--blue-bg);   border:1px solid var(--blue-border);   }
.badge-etc      { color:var(--slate);  background:var(--slate-bg);  border:1px solid var(--slate-border);  }

.pri-badge { font-size:var(--text-xs);font-weight:700;padding:2px 9px;border-radius:var(--radius-md);border:1px solid;cursor:pointer;transition:all var(--dur-fast);background:transparent; }
.pri-high { color:var(--red);    border-color:var(--red-border);    }
.pri-mid  { color:var(--yellow); border-color:var(--yellow-border); }
.pri-low  { color:var(--text-dim);border-color:var(--border);       }
.pri-badge:hover { opacity:0.7; }

.status-pill { font-size:var(--text-xs);padding:2px 8px;border-radius:var(--radius-md);border:1px solid;font-weight:600; }
.status-open { color:var(--blue);     border-color:var(--blue-border);   background:var(--blue-bg);   }
.status-wip  { color:var(--yellow);   border-color:var(--yellow-border); background:var(--yellow-bg); }
.status-done { color:var(--green);    border-color:var(--green-border);  background:var(--green-bg);  }
.status-hold    { color:var(--text-dim); border-color:var(--border);          background:var(--surface2);    }
/* ── 관측 그룹 바 ── */
.mgroup { border:1.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:10px;background:var(--surface); }
.mgroup.ok   { border-color:var(--green); }
.mgroup.warn { border-color:#D9A441; }
.mgroup.crit { border-color:var(--red,#EF4444); }
.mbar { display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--border); }
.mbar .mdot { width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;animation:mpulse 1.8s ease-in-out infinite; }
.mgroup.warn .mbar .mdot { background:#D9A441; }
.mgroup.crit .mbar .mdot { background:var(--red,#EF4444); }
.mbar .mname { font-size:var(--text-sm);font-weight:800;color:var(--text); }
.mbar .mmeta { font-size:var(--text-xs);color:var(--text-dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.mbar .mstate { font-size:var(--text-xs);font-weight:800;padding:2px 9px;border-radius:var(--radius-full);
  color:var(--green);background:var(--green-bg,rgba(52,211,153,.12));border:1px solid var(--green); }
.mgroup.warn .mbar .mstate { color:#8A6414;background:rgba(217,164,65,.14);border-color:#D9A441; }
.mgroup.crit .mbar .mstate { color:var(--red,#EF4444);background:rgba(239,68,68,.12);border-color:var(--red,#EF4444); }
.mbar .mopen { margin-left:auto;height:28px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--accent);
  background:var(--accent);color:#fff;font-size:var(--text-xs);font-weight:700;cursor:pointer;display:inline-flex;align-items:center; }
.mbar .mopen:hover { filter:brightness(1.08); }
.mline { padding:7px 14px;font-size:var(--text-xs);color:var(--text-dim);background:var(--surface2);border-bottom:1px solid var(--border); }
.mline b { color:var(--text); }
.mgroup .spec-card { border:0;border-radius:0;border-top:1px solid var(--border);margin:0; }
.mgroup .spec-card:first-of-type { border-top:0; }
.status-monitor { color:var(--green);border-color:var(--green);background:var(--green-bg,rgba(52,211,153,.12)); }
.monitor-chip { display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);font-weight:700;
  color:var(--green);background:var(--green-bg,rgba(52,211,153,.12));border:1px solid var(--green);
  border-radius:var(--radius-full);padding:2px 9px;cursor:pointer;white-space:nowrap; }
.monitor-chip:hover { filter:brightness(1.1); }
.monitor-chip .dot { width:5px;height:5px;border-radius:50%;background:var(--green);
  animation:mpulse 1.8s ease-in-out infinite; }
@keyframes mpulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.status-planned { color:var(--purple);  border-color:var(--purple-border,var(--purple)); background:var(--purple-bg);  }

.spec-date  { font-size:var(--text-xs);color:var(--text-dim); }
.spec-arrow { color:var(--border);font-size:var(--text-lg);transition:all var(--dur-fast);align-self:center; }
.spec-card:hover .spec-arrow { color:var(--accent);transform:translateX(2px); }

/* ── 섹션 구분 ── */
.section-divider { font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);padding:20px 0 8px;border-bottom:1px solid var(--border);margin-bottom:12px; }

/* ── 빈 상태 ── */
.empty-state { text-align:center;padding:80px 20px;color:var(--text-dim); }
.empty-state .icon { font-size:40px;margin-bottom:14px; }
.empty-state p { font-size:var(--text-base);line-height:1.8; }

::-webkit-scrollbar { width:5px;height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border);border-radius:3px; }

/* ── GPT FAB ── */
.claude-fab { position:fixed;bottom:24px;right:24px;z-index:var(--z-float);width:56px;height:56px;border-radius:var(--radius-full);border:none;background:var(--accent);color:#fff;font-size:24px;cursor:pointer;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;transition:all var(--dur-base); }
.claude-fab:hover { transform:scale(1.08); }
.claude-result { white-space:pre-wrap;font-size:var(--text-sm);line-height:1.8;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;max-height:320px;overflow-y:auto; }
.claude-submit { width:100%;height:42px;background:var(--accent);border:0;border-radius:var(--radius-md);color:#fff;font-size:var(--text-base);font-weight:700;cursor:pointer;transition:opacity var(--dur-fast); }
.claude-submit:disabled { opacity:0.5;cursor:not-allowed; }

/* ── 모바일 반응형 ── */
@media (max-width: 640px) {
  .hero { padding:24px 16px 20px; }
  .hero h1 { font-size:1.4rem; }
  .hero-sub { font-size:var(--text-sm); }
  .kpi-row { grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px; }

    if (rec.tag) { delete rec.tag; changed = true; }
    if (typeof rec.relatedTo === 'string') { rec.relatedTo = [rec.relatedTo]; changed = true; }
    if (!Array.isArray(rec.relatedTo) && rec.relatedTo != null) { rec.relatedTo = []; changed = true; }
  });
  if (changed) saveOv(_ov);
  return _ov;
}
function getOrder() { return _order; }
// 화면 필터와 무관하게 전체 카드 기준의 현재 순서 id 배열을 만든다(숨은 카드 유실 방지)
function currentOrderIds() {
  const order    = getOrder();
  const allItems = getAllItems();
  if (!order.length) return allItems.map(i => i.id);
  const map    = Object.fromEntries(allItems.map(i => [i.id, i]));
  const sorted = order.map(id => map[id]).filter(Boolean);
  const rest   = allItems.filter(i => !order.includes(i.id));
  return [...sorted, ...rest].map(i => i.id);
}
function saveOv(ov) {
  _ov = ov;
  localStorage.setItem('spec-ov', JSON.stringify(ov));
}
function saveOrder(o) {
  _order = o;
  localStorage.setItem('spec-order', JSON.stringify(o));
  const _op = { id: 1, order_list: o, updated_at: new Date().toISOString() };
  if (_sb) _sb.rpc('spec_order_upsert', { p_key: getEditKey(), p_order: o }).then(({ error }) => { _editErr(error, 'spec_order'); });
  else { try { showToast('순서가 이 브라우저에만 저장됨 — Supabase 연결 실패'); } catch(e) {} }
}
function normalizeItem(item) {
  const tagVal = item.tag;
  if (!Array.isArray(item.tags)) item.tags = item.tags ? [item.tags] : (tagVal ? [tagVal] : ['etc']);
  item.tags = item.tags.filter(Boolean);
  if (!item.tags.length) item.tags = ['etc'];
  if (!Array.isArray(item.relatedTo)) item.relatedTo = item.relatedTo ? [item.relatedTo] : [];
  if (!item.dueDate) item.dueDate = null;
  return item;
}
function getAllItems() {
  const ov = getOv();
  return SPECS.map(s => normalizeItem({ ...s, ...(ov[s.id] || {}) }));
}
function applyOv(id, key, val) {
  const ov = getOv(); if (!ov[id]) ov[id] = {};
  if (key === 'status') {
    const from = ov[id].status || (SPECS.find(s => s.id === id) || {}).status || null;
    if (from !== val) {
      // Supabase 상태 변경 이력 (브라우저 직접 → 라이브 저장, 프록시 폴백)
      if (_sb) _sb.rpc('spec_log_insert', { p_key: getEditKey(), p_spec_id: id, p_from: from, p_to: val }).then(({ error }) => { _editErr(error, 'spec_status_log'); });
      else fetch('/api/sb/spec_status_log', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ spec_id: id, from_status: from, to_status: val }) }).catch(()=>{});
      // localStorage 이력 (호환)
      const logKey = id + '-log';
      let logs; try { logs = JSON.parse(localStorage.getItem(logKey) || '[]'); } catch(e) { logs = []; }
      const now = new Date();
      const date = now.getFullYear() + '. ' + (now.getMonth()+1) + '. ' + now.getDate() + '.';
      logs.push({ date, from, to: val });
      localStorage.setItem(logKey, JSON.stringify(logs));
    }
  }
  ov[id][key] = val;
  _ov = ov;
  localStorage.setItem('spec-ov', JSON.stringify(ov));
  // Supabase write-through: 브라우저 직접(anon, public write 정책) → 라이브에서도 저장. server.py 없을 때 프록시 폴백.
  const r = ov[id];
  const _payload = {
    spec_id:    id,
    tags:       r.tags       || [],
    priority:   r.priority   || 'mid',
    status:     r.status     || 'open',
    due_date:   r.dueDate    || null,
    related_to: r.relatedTo  || [],
    updated_at: new Date().toISOString(),
  };
  if (_sb) _sb.rpc('spec_ov_upsert', { p_key: getEditKey(), p_spec_id: id, p_tags: r.tags||[], p_priority: r.priority||'mid', p_status: r.status||'open', p_due_date: r.dueDate||null, p_related_to: r.relatedTo||[] }).then(({ error }) => { _editErr(error, 'spec_overrides'); });
  else fetch('/api/sb/spec_overrides', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(_payload) }).catch(() => {});
}

function buildList() {
  const order = getOrder();
  let items   = getAllItems();
  if (order.length) {
    const map    = Object.fromEntries(items.map(i => [i.id, i]));
    const sorted = order.map(id => map[id]).filter(Boolean);
    const rest   = items.filter(i => !order.includes(i.id));
    items = [...sorted, ...rest];
  }
  if (sortMode === 'date') items = [...items].sort((a,b) => parseSpecDate(b.date) - parseSpecDate(a.date));
  if (sortMode === 'priority') items = [...items].sort((a,b) => (PRI_ORDER[b.priority] || 0) - (PRI_ORDER[a.priority] || 0));
  if (activeFilter !== 'all') items = items.filter(i => i.tags.includes(activeFilter));
  if (activeStatusFilter !== 'all') items = items.filter(i => (i.status || 'open') === activeStatusFilter);
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    items = items.filter(i => (i.title || '').toLowerCase().includes(q));
  }
  return items;
}

const STATUS_SECTIONS = [
  { key: 'monitor', label: '📈 적용 후 모니터링중' },
  { key: 'wip',     label: '🟡 진행중'    },
  { key: 'planned', label: '🟣 진행 예정' },
  { key: 'open',    label: '🔵 검토중'    },
  { key: 'hold',    label: '⏸ 보류'       },
  { key: 'boxes',   label: '📦 완료 · 아카이브' },
];

// ── 렌더 ──────────────────────────────────────────────────
function render() {
  const items     = buildList();
  const all       = getAllItems();
  const container = document.getElementById('specList');
  const empty     = document.getElementById('emptyState');

  // KPI 업데이트
  document.getElementById('statTotal').textContent = all.length;
  document.getElementById('statOpen').textContent  = all.filter(i => i.status === 'open').length;
  document.getElementById('statWip').textContent   = all.filter(i => i.status === 'wip').length;
  document.getElementById('statDone').textContent  = all.filter(i => i.status === 'done').length;
  document.getElementById('countBadge').textContent = items.length;
  saveKpiSnapshot(all);
  renderKpiSparkline();

  if (!items.length) {
    container.innerHTML = '';
    empty.style.display = 'block';
    syncControls();
    updateBulkBar();
    return;
  }
  empty.style.display = 'none';

  let html = '';
  STATUS_SECTIONS.forEach(sec => {
    if (activeStatusFilter !== 'all' && sec.key !== activeStatusFilter) return;
    if (activeStatusFilter !== 'all' && sec.key === 'boxes') return;
    const group = sec.key === 'boxes'
      ? items.filter(i => i.status === 'done' || i.status === 'archive')
      : items.filter(i => (i.status || 'open') === sec.key);
    html += `<div class="section-divider">${sec.label} <span style="font-weight:400;opacity:0.55;font-size:var(--text-xs)">${group.length}</span></div>`;
    if (sec.key === 'boxes') {
      const doneGroup    = items.filter(i => (i.status || 'open') === 'done');
      const archiveGroup = items.filter(i => i.status === 'archive');
      html += `<div class="boxes-row">
        <div class="done-box" onclick="openDoneModal()"
          ondragover="onDragOverEmpty(event)" ondragleave="onDragLeaveEmpty(event)"
          ondrop="onDropEmpty(event,'done')">
          <div class="done-box-icon">📦</div>
          <div class="done-box-label">완료함</div>
          <div class="done-box-hint">클릭해서 열기 · 드래그로 완료 처리</div>
          <span class="done-count">${doneGroup.length}개</span>
        </div>
        <div class="archive-box" onclick="openArchiveModal()"
          ondragover="onDragOverEmpty(event)" ondragleave="onDragLeaveEmpty(event)"
          ondrop="onDropEmpty(event,'archive')">
          <div class="done-box-icon">🗄️</div>
          <div class="done-box-label">아카이브함</div>
          <div class="done-box-hint">클릭해서 열기 · 드래그로 아카이브 처리</div>
          <span class="archive-count">${archiveGroup.length}개</span>
        </div>
      </div>`;
    } else if (sec.key === 'monitor' && group.length) {
      html += renderMonitorGroups(group);
    } else if (group.length) {
      html += group.map(item => renderCard(item)).join('');
    } else {
      html += `<div class="section-empty" data-status="${sec.key}"
        ondragover="onDragOverEmpty(event)" ondragleave="onDragLeaveEmpty(event)"
        ondrop="onDropEmpty(event,'${sec.key}')">여기로 드래그하세요</div>`;
    }
  });
  container.innerHTML = html;
  if (doneModalOpen) renderDoneModal();
  if (archiveModalOpen) renderArchiveModal();
  syncControls();
  updateBulkBar();
}

function renderMonitorGroups(items) {
  const G = (window.SPEC_META && SPEC_META.MONITOR_GROUPS) || {};
  const buckets = {}, loose = [];
  items.forEach(i => {
    const k = i.monitorGroup;
    if (k && G[k]) (buckets[k] = buckets[k] || []).push(i);
    else loose.push(i);
  });
  let out = '';
  Object.keys(buckets).forEach(k => {
    const g  = G[k];
    const st = MONITOR_STATUS[k] || {};
    const lv = st.level || 'ok';
    const badge = st.nCrit ? `위반 ${st.nCrit}` : (st.nWarn ? `주의 ${st.nWarn}` : '이상 없음');
    const dn = (st.dn != null) ? `D+${st.dn}` : '';
    out += `<div class="mgroup ${lv}">
      <div class="mbar">
        <span class="mdot"></span>
        <span class="mname">${escHtml(g.label)}</span>
        <span class="mmeta">${dn}${dn ? ' · ' : ''}${g.since} 배포</span>
        <span class="mstate">${badge}</span>
        <button type="button" class="mopen"
          onclick="event.stopPropagation();openMonitorModal('${g.url}','${k}')">리포트 열기</button>
      </div>
      ${st.headline ? `<div class="mline">${escHtml(st.headline)}${st.nextGate ? ` · 다음 게이트 <b>${escHtml(st.nextGate)}</b>` : ''}${st.stamp ? ` · ${escHtml(st.stamp)} 기준` : ''}</div>` : ''}
      ${buckets[k].map(item => renderCard(item)).join('')}
    </div>`;
  });
  out += loose.map(item => renderCard(item)).join('');
  return out;
}

function renderCard(item) {
  const tags       = item.tags || ['etc'];
  const tagBadges  = tags.map(t => {
    const tag = TAG_INFO[t] || TAG_INFO.etc;
    return `<span class="badge ${tag.cls}" onclick="event.preventDefault();openDropdown(event,'${item.id}','tags')" title="태그 변경" style="cursor:pointer">${tag.label}</span>`;
  }).join('');
  const status     = STATUS_INFO[item.status] || STATUS_INFO.open;
  const history    = renderHistoryLine(item.id);
  const dueChip    = renderDueChip(item);
  const related    = renderRelatedChips(item);
  const dragOn     = sortMode === 'manual';
  const selected   = selectedIds.has(item.id);
  return `
<a href="${item.file}" class="spec-card ${item.status==='done'?'status-done':''} ${dragOn?'':'drag-disabled'}"
     data-id="${item.id}" draggable="${dragOn?'true':'false'}"
     onclick="onCardClick(event,'${item.id}')"
     ondragstart="onDragStart(event,'${item.id}')"
     ondragend="onDragEnd()">
  <input class="bulk-select" type="checkbox" ${selected?'checked':''} aria-label="${item.id.toUpperCase()} 선택"
         onclick="event.stopPropagation()"
         onchange="toggleSelection(event,'${item.id}')">
  <span class="drag-handle">⠿</span>
  <div class="spec-info">
    <div><span class="spec-num">${item.id.toUpperCase()}</span></div>
    <div class="spec-title">${escHtml(item.title)}</div>
    <div class="spec-meta">
      ${tagBadges}
      <span class="pri-badge pri-${item.priority}"
            onclick="event.preventDefault();openDropdown(event,'${item.id}','priority')"
            title="우선순위 변경">${PRI_LABEL[item.priority]}</span>
      <span class="status-pill ${status.cls}" onclick="event.preventDefault();openDropdown(event,'${item.id}','status')" title="상태 변경" style="cursor:pointer">${status.label}</span>
      <span class="spec-date">${item.date}</span>
      ${dueChip}
      ${related}
      <span class="related-chip" onclick="event.preventDefault();openDropdown(event,'${item.id}','related')" title="관련 기획서 연결">관련</span>
      ${history}
    </div>
  </div>
  <span class="spec-arrow">→</span>
</a>`;
}

function goTo(file) { window.location.href = file; }
function goToRelated(id) {
  const item = SPECS.find(s => s.id === id);
  if (item) goTo(item.file);
}

function setFilter(tag) {
  activeFilter = (tag !== 'all' && activeFilter === tag) ? 'all' : tag;
  render();
}

function setStatusFilter(status) {
  activeStatusFilter = (status !== 'all' && activeStatusFilter === status) ? 'all' : status;
  render();
}

function setSearch(value) {
  searchQuery = value || '';
  render();
}

function clearSearch() {
  searchQuery = '';
  const input = document.getElementById('searchInput');
  if (input) input.value = '';
  render();
}

function setSortMode(value) {
  sortMode = value || 'manual';
  render();
}

const DD_OPTIONS = SPEC_META.DD_OPTIONS;
const DD_LABEL = SPEC_META.DD_LABEL;
let ddCtx = null;

function dropdownMarkup(id, field) {
  const ov  = getOv();
  const base = normalizeItem({ ...(SPECS.find(s => s.id === id) || {}), ...(ov[id] || {}) });
  const cur = field === 'tags' ? base.tags : field === 'related' ? base.relatedTo : base[field] || '';
  const options = field === 'related'
    ? SPECS.filter(s => s.id !== id).map(s => ({ val:s.id, label:s.id.toUpperCase() }))
    : DD_OPTIONS[field];

  return `<div class="dd-label">${DD_LABEL[field]}</div>` +
    options.map(o => {
      const active = Array.isArray(cur) ? cur.includes(o.val) : o.val === cur;
      const check = field === 'tags' || field === 'related' ? `<span class="check">${active ? '✓' : ''}</span>` : '';
      return `<div class="dd-item${active ? ' active' : ''}" data-val="${o.val}">${check}${o.label}</div>`;
    }
    ).join('');
}

function openDropdown(e, id, field) {
  e.stopPropagation();
  const dd  = document.getElementById('metaDropdown');
  dd.innerHTML = dropdownMarkup(id, field);

  const rect = e.currentTarget.getBoundingClientRect();
  dd.style.left = Math.min(rect.left, window.innerWidth - 190) + 'px';
  dd.style.top  = (rect.bottom + 5) + 'px';
  dd.classList.add('open');
  if (rect.bottom + 5 + dd.offsetHeight > window.innerHeight) {
    dd.style.top = (rect.top - dd.offsetHeight - 5) + 'px';
  }
  ddCtx = { id, field };
}

function closeMetaDropdown() {
  document.getElementById('metaDropdown')?.classList.remove('open');
  ddCtx = null;
}

document.addEventListener('click', () => {
  closeMetaDropdown();
  closeExportMenu();
  closeDateEditor();
});
document.getElementById('dateEditor')?.addEventListener('click', e => e.stopPropagation());
document.getElementById('exportMenu')?.addEventListener('click', e => e.stopPropagation());
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeDoneModal();
  closeArchiveModal();
  closeMetaDropdown();
  closeExportMenu();
  closeDateEditor();
});
document.getElementById('metaDropdown')?.addEventListener('click', e => {
  e.stopPropagation();
  const item = e.target.closest('.dd-item');
  if (!item || !ddCtx) return;
  if (ddCtx.field === 'tags' || ddCtx.field === 'related') {
    const ctx = { ...ddCtx };
    const curItem = getAllItems().find(i => i.id === ctx.id) || {};
    const key = ctx.field === 'tags' ? 'tags' : 'relatedTo';
    let next = Array.isArray(curItem[key]) ? [...curItem[key]] : [];
    if (next.includes(item.dataset.val)) next = next.filter(v => v !== item.dataset.val);
    else next.push(item.dataset.val);
    if (ctx.field === 'tags' && !next.length) next = ['etc'];
    applyOv(ctx.id, key, next);
    document.getElementById('metaDropdown').innerHTML = dropdownMarkup(ctx.id, ctx.field);
    ddCtx = ctx;
    render();
    return;
  }
  applyOv(ddCtx.id, ddCtx.field, item.dataset.val);
  closeMetaDropdown();
  render();
});

// ── 드래그 앤 드롭 ────────────────────────────────────────
function onDragStart(e, id) {
  if (sortMode !== 'manual') { e.preventDefault(); return; }
  dragSrcId = id; e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => { const el = document.querySelector(`[data-id="${id}"]`); if (el) el.classList.add('dragging'); }, 0);
}
function onDragEnd() {
  dragSrcId = null;
  document.querySelectorAll('.spec-card').forEach(c => c.classList.remove('dragging','drag-over'));
  document.querySelectorAll('.section-empty,.done-box,.archive-box').forEach(z => z.classList.remove('drag-over'));
}
function onDragOver(e) {
  if (sortMode !== 'manual') return;
  e.preventDefault();
  const t = e.target.closest('.spec-card');
  document.querySelectorAll('.spec-card').forEach(c => c.classList.remove('drag-over'));
  if (t && t.dataset.id !== dragSrcId) t.classList.add('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  if (sortMode !== 'manual') return;
  const t = e.target.closest('.spec-card');
  if (!t || !dragSrcId || t.dataset.id === dragSrcId) return;
  const allItems  = getAllItems();
  const targetStatus = allItems.find(i => i.id === t.dataset.id)?.status || 'open';
  const srcStatus    = allItems.find(i => i.id === dragSrcId)?.status    || 'open';
  if (targetStatus !== srcStatus) applyOv(dragSrcId, 'status', targetStatus);
  const ids = currentOrderIds();
  const si = ids.indexOf(dragSrcId), ti = ids.indexOf(t.dataset.id);
  if (si === -1 || ti === -1) { render(); return; }
  ids.splice(si, 1); ids.splice(ti, 0, dragSrcId);
  saveOrder(ids); render();
}
function onDragOverEmpty(e) {
  if (sortMode !== 'manual') return;
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.add('drag-over');
}
function onDragLeaveEmpty(e) {
  e.currentTarget.classList.remove('drag-over');
}
function onDropEmpty(e, statusKey) {
  e.preventDefault(); e.stopPropagation();
  if (sortMode !== 'manual') return;
  e.currentTarget.classList.remove('drag-over');
  if (!dragSrcId) return;
  applyOv(dragSrcId, 'status', statusKey);
  // 상태만 바뀌고 순서가 저장되지 않던 버그 수정 — 드롭한 카드를 해당 구간 끝으로 이동해 함께 저장
  const ids = currentOrderIds();
  const si  = ids.indexOf(dragSrcId);
  if (si !== -1) { ids.splice(si, 1); ids.push(dragSrcId); saveOrder(ids); }
  render();
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return escHtml(s).replace(/"/g,'&quot;');
}

function parseSpecDate(dateText) {
  const nums = (dateText || '').match(/\d+/g) || [];
  if (nums.length < 3) return 0;
  return new Date(Number(nums[0]), Number(nums[1]) - 1, Number(nums[2])).getTime();
}

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function statusText(status) {
  return (STATUS_INFO[status] && STATUS_INFO[status].label) || status || '-';
}

function renderHistoryLine(id) {
  const logs = readJson(id + '-log', []);
  if (!Array.isArray(logs) || !logs.length) return '';
  const last = logs[logs.length - 1];
  return `<div class="history-line">↺ ${escHtml(statusText(last.from))} → ${escHtml(statusText(last.to))} · ${escHtml(last.date || '')}</div>`;
}

function dueState(dueDate) {
  const today = new Date(todayKey() + 'T00:00:00');
  const due = new Date(dueDate + 'T00:00:00');
  const diff = Math.ceil((due - today) / 86400000);
  if (diff < 0) return 'red';
  if (diff <= 3) return 'yellow';
  return 'green';
}

function renderDueChip(item) {
  if (!item.dueDate) return '';
  const state = dueState(item.dueDate);
  return `<span class="due-chip due-${state}" onclick="event.preventDefault();openDueEditor(event,'${item.id}')" title="마감일 변경">마감 ${escHtml(item.dueDate)}</span>`;
}

function renderRelatedChips(item) {
  if (!Array.isArray(item.relatedTo) || !item.relatedTo.length) return '';
  return item.relatedTo.map(id => {
    const rel = SPECS.find(s => s.id === id);
    if (!rel) return '';
    return `<span class="related-chip" onclick="event.preventDefault();goToRelated('${id}')" title="${escAttr(rel.title)}">→ ${id.toUpperCase()}</span>`;
  }).join('');
}

function openDueEditor(e, id) {
  e.stopPropagation();
  dueEditId = id;
  closeMetaDropdown();
  closeExportMenu();
  const item = getAllItems().find(i => i.id === id) || {};
  const pop = document.getElementById('dateEditor');
  const input = document.getElementById('dateEditorInput');
  const rect = e.currentTarget.getBoundingClientRect();
  input.value = item.dueDate || '';
  pop.style.left = Math.min(rect.left, window.innerWidth - 170) + 'px';
  pop.style.top = (rect.bottom + 5) + 'px';
  pop.classList.add('open');
  input.focus();
}

function saveDueDate(value) {
  if (!dueEditId) return;
  applyOv(dueEditId, 'dueDate', value || null);
  closeDateEditor();
  render();
}

function closeDateEditor() {
  document.getElementById('dateEditor')?.classList.remove('open');
  dueEditId = null;
}

function toggleSelection(e, id) {
  e.stopPropagation();
  if (e.target.checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBulkBar();
}

function updateBulkBar() {
  const count = selectedIds.size;
  document.body.classList.toggle('has-bulk-selection', count > 0);
  const bar = document.getElementById('bulkBar');
  const label = document.getElementById('bulkCount');
  if (label) label.textContent = count + '개 선택됨';
  if (bar) bar.classList.toggle('open', count > 0);
}

function applyBulkStatus(status) {
  [...selectedIds].forEach(id => applyOv(id, 'status', status));
  selectedIds.clear();
  render();
}

function syncControls() {

function exportRows() {
  return buildList().map(i => [

    (i.tags || []).join('|'),

  ]);
}

function csvCell(value) {
  const s = String(value == null ? '' : value);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

async function copyExport(type) {
  const headers = ['ID','제목','태그','우선순위','상태','날짜','마감일'];
  const rows = exportRows();
  const text = type === 'csv'
    ? [headers, ...rows].map(row => row.map(csvCell).join(',')).join('\n')
    : ['| ' + headers.join(' | ') + ' |', '| ' + headers.map(() => '---').join(' | ') + ' |', ...rows.map(row => '| ' + row.map(v => String(v).replace(/\|/g,'/')).join(' | ') + ' |')].join('\n');
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('clipboard fallback');
    await navigator.clipboard.writeText(text);
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  closeExportMenu();
  showToast('복사됨 ✓');
}

}

function saveKpiSnapshot(all) {
  const date = todayKey();
  const next = {
    date,
    total: all.length,
    open: all.filter(i => i.status === 'open').length,
    wip: all.filter(i => i.status === 'wip').length,
    done: all.filter(i => i.status === 'done').length
  };
  let history = readJson('spec-kpi-history', []);
  if (!Array.isArray(history)) history = [];
  history = history.filter(h => h && h.date !== date);
  history.push(next);
  history = history.slice(-30);
  localStorage.setItem('spec-kpi-history', JSON.stringify(history));
}

function sparkPoints(history, key, width, height, pad) {
  const maxVal = Math.max(1, ...history.flatMap(h => [h.done || 0, h.wip || 0]));
  return history.map((h, idx) => {
    const x = history.length === 1 ? width / 2 : pad + idx * ((width - pad * 2) / (history.length - 1));
    const y = height - pad - ((h[key] || 0) / maxVal) * (height - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
}

function renderKpiSparkline() {
  const el = document.getElementById('kpiSparkline');
  if (!el) return;
  const history = readJson('spec-kpi-history', []);
  if (!Array.isArray(history) || history.length < 2) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  const width = 320, height = 48, pad = 6;
  el.style.display = 'block';
  el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="KPI 추세">
    <polyline points="${sparkPoints(history,'done',width,height,pad)}" fill="none" stroke="var(--green)" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
    <polyline points="${sparkPoints(history,'wip',width,height,pad)}" fill="none" stroke="var(--blue)" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
    <text x="4" y="12" class="spark-label">done</text>
    <text x="4" y="26" class="spark-label">wip</text>
  </svg>`;
}

var _chatHistory = [];

function mdToHtml(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\n/g,'<br>');
}

function appendMsg(role, text) {
  const history = document.getElementById('chatHistory');
  const wrap = document.createElement('div');
  wrap.className = 'chat-msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble';
  if (role === 'ai') bubble.innerHTML = mdToHtml(text);
  else bubble.textContent = text;
  wrap.appendChild(bubble);
  history.appendChild(wrap);
  history.scrollTop = history.scrollHeight;
  return bubble;
}

function showTyping() {
  const history = document.getElementById('chatHistory');
  const wrap = document.createElement('div');
  wrap.className = 'chat-msg ai';
  wrap.id = 'chatTyping';
  wrap.innerHTML = '<div class="chat-bubble chat-typing"><span></span><span></span><span></span></div>';
  history.appendChild(wrap);
  history.scrollTop = history.scrollHeight;
}
function removeTyping() {
  const t = document.getElementById('chatTyping');
  if (t) t.remove();
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderChatImagePreview() {
  const wrap = document.getElementById('chatAttachPreview');
  if (!wrap) return;

  ).join('');
}

  _chatImages.splice(idx, 1);
  renderChatImagePreview();

async function handleChatImages(files) {
  const incoming = Array.from(files || []);
  const room = Math.max(0, 4 - _chatImages.length);
  for (const file of incoming.slice(0, room)) {
    if (!file.type.startsWith('image/')) continue;
    if (file.size > 8 * 1024 * 1024) {
      appendMsg('ai', '⚠️ 이미지 용량은 8MB 이하만 가능합니다: ' + file.name);

    _chatImages.push({ name: file.name, data: await fileToDataUrl(file) });

  ta.value = '';
  ta.style.height = 'auto';
  _chatImages = [];
  renderChatImagePreview();

  _chatHistory.push({ role: 'user', text: userText });
  appendMsg('user', userText + (images.length ? '\n\n📎 이미지 ' + images.length + '장 첨부' : ''));
  showTyping();

  // 대화 기록을 컨텍스트로 포함
  let prompt = userText;
  if (_chatHistory.length > 1) {
    const ctx = _chatHistory.slice(0, -1).map(m =>
      (m.role === 'user' ? '사용자: ' : 'GPT: ') + m.text
    ).join('\n\n');
    prompt = '[이전 대화]\n' + ctx + '\n\n[현재 질문]\n' + userText;
  }

  try {
    const res = await fetch(apiBase + '/api/gpt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, agent: 'content-spec-writer', images }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || '서버 오류');
    }
    removeTyping();
    const bubble = appendMsg('ai', '');
    let full = '';

    async function readStream() {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        full += decoder.decode(value, { stream: true });
        bubble.innerHTML = mdToHtml(full);
        document.getElementById('chatHistory').scrollTop = 9999;
      }
    }

    if (res.body && res.body.getReader) {
      await readStream();
    } else {
      full = await res.text();
      bubble.innerHTML = mdToHtml(full);
    }

    _chatHistory.push({ role: 'ai', text: full });
    // 응답에 spec 파일명이 포함됐으면 해당 페이지로 이동
    const specMatch = full.match(/spec-0*(\d+)-[\w-]+\.html/);
    if (specMatch) {
      bubble.innerHTML += '<br><br><small style="opacity:0.6">⏳ 기획서로 이동 중...</small>';
      setTimeout(() => {
        document.getElementById('claudeOverlay').classList.remove('open');
        window.location.href = specMatch[0];
      }, 1800);
    }
  } catch (err) {
    removeTyping();
    appendMsg('ai', '⚠️ ' + err.message);
  } finally {
    btn.disabled = false;
    document.getElementById('claudePrompt').focus();
  }
}

// 이전 onclick/모바일 스크립트 호환용 alias.
window.openClaudeModal = openClaudeModal;
window.openGptModal = openGptModal;
window.submitClaude = submitClaude;
</script>
