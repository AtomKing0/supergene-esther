<script id="theme-init">(function(){var t=localStorage.getItem("spec-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");document.addEventListener("DOMContentLoaded",function(){var g=document.createElement("button");g.className="theme-toggle";g.title="라이트/다크 모드 전환";g.textContent=t==="light"?"☀️":"🌙";document.body.prepend(g);g.addEventListener("click",function(){var l=document.documentElement.getAttribute("data-theme")==="light";document.documentElement[l?"removeAttribute":"setAttribute"]("data-theme","light");g.textContent=l?"🌙":"☀️";localStorage.setItem("spec-theme",l?"dark":"light");});});})();</script>

<title>SPEC-XXX · 제목</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #222635;
  --surface3: #2a2e3f;
  --border: #2e3348;
  --text: #e4e6f0;
  --text2: #9ea3b5;
  --text-dim: #9ea3b5;
  --accent: #a78bfa;
  --accent2: #c4b5fd;
  --green: #34d399;   --green-bg: rgba(52,211,153,0.12);
  --yellow: #fbbf24;  --yellow-bg: rgba(251,191,36,0.12);
  --red: #f87171;     --red-bg: rgba(248,113,113,0.12);
  --blue: #60a5fa;    --blue-bg: rgba(96,165,250,0.12);
  --purple: #a78bfa;  --purple-bg: rgba(167,139,250,0.12);
  --hero-bg: linear-gradient(135deg, #1a1d27 0%, #1e1a35 45%, #1a1d27 100%);
  --radius: 12px;
}
[data-theme="light"] {
  --bg: #f5f6f8; --surface: #ffffff; --surface2: #f0f1f4; --surface3: #e8e9ee;
  --border: #dfe1e6; --text: #1a1d27; --text2: #5e6278; --text-dim: #5e6278;
  --accent: #7c3aed; --accent2: #6d28d9;
  --green: #059669; --green-bg: rgba(5,150,105,0.1);
  --yellow: #d97706; --yellow-bg: rgba(217,119,6,0.1);
  --red: #dc2626;   --red-bg: rgba(220,38,38,0.1);
  --blue: #2563eb;  --blue-bg: rgba(37,99,235,0.1);
  --purple: #7c3aed; --purple-bg: rgba(124,58,237,0.1);
  --hero-bg: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 45%, #e0e7ff 100%);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }

.theme-toggle { position:fixed;top:16px;right:16px;z-index:300;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.2); }
.theme-toggle:hover { transform:scale(1.1); }
.back-btn { position:fixed;top:16px;right:68px;z-index:300;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.2);text-decoration:none; }
.back-btn:hover { color:var(--text);transform:translateY(-1px);text-decoration:none; }

.nav-toggle { position:fixed;left:16px;top:16px;z-index:300;background:var(--surface2);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s; }
.nav-toggle:hover { border-color:var(--accent); }
.nav-sidebar { position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:20px 0;z-index:200;transform:translateX(-100%);transition:transform 0.25s; }
.nav-sidebar.open { transform:translateX(0); }
.nav-title { padding:14px 20px 6px;font-size:0.68rem;font-weight:700;text-transform:uppercase;color:var(--accent);letter-spacing:1.5px; }
.nav-sidebar a { display:block;padding:7px 20px;color:var(--text2);text-decoration:none;font-size:0.82rem;border-left:3px solid transparent;transition:all 0.2s; }
.nav-sidebar a:hover,.nav-sidebar a.active { color:var(--text);background:var(--surface2);border-left-color:var(--accent);text-decoration:none; }

.hero { background:var(--hero-bg);border-bottom:1px solid var(--border);padding:64px 40px 44px;position:relative;overflow:hidden; }
.hero::before { content:'';position:absolute;top:-40%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(167,139,250,0.1) 0%,transparent 60%); }
.hero-inner { max-width:1100px;margin:0 auto;position:relative; }
.hero-eyebrow { display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap; }
.spec-id-badge { font-family:monospace;font-size:0.75rem;font-weight:700;color:var(--accent);background:var(--purple-bg);border:1px solid rgba(167,139,250,0.3);padding:3px 10px;border-radius:6px; }
.hero h1 { font-size:2.2rem;font-weight:800;letter-spacing:-0.5px;margin-bottom:10px;line-height:1.2; }
.hero h1 span { background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
.hero-sub { color:var(--text2);font-size:1rem;margin-bottom:20px;max-width:640px; }
.badge { display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:600; }
.badge-purple { background:var(--purple-bg);color:var(--purple);border:1px solid rgba(167,139,250,0.3); }
.badge-blue   { background:var(--blue-bg);color:var(--blue);border:1px solid rgba(96,165,250,0.3); }
.badge-yellow { background:var(--yellow-bg);color:var(--yellow);border:1px solid rgba(251,191,36,0.3); }
.badge-green  { background:var(--green-bg);color:var(--green);border:1px solid rgba(52,211,153,0.3); }
.badge-red    { background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,0.3); }

.kpi-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:28px; }
.kpi-card { background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px; }
[data-theme="light"] .kpi-card { background:rgba(0,0,0,0.03); }
.kpi-label { font-size:0.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px; }
.kpi-value { font-size:1.7rem;font-weight:800;line-height:1; }
.kpi-sub   { font-size:0.75rem;color:var(--text2);margin-top:4px; }
.kpi-trend { font-size:0.72rem;font-weight:700;margin-top:6px; }
.trend-up   { color:var(--green); }
.trend-down { color:var(--red); }

.container { max-width:1100px;margin:0 auto;padding:0 32px; }
section { padding:52px 0;border-bottom:1px solid var(--border); }
section:last-child { border-bottom:none; }

.section-header { display:flex;align-items:center;gap:12px;margin-bottom:28px; }
.section-num { width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:800;flex-shrink:0; }
.section-num-1 { background:var(--purple-bg);color:var(--purple);border:1px solid rgba(167,139,250,0.3); }
.section-num-2 { background:var(--blue-bg);color:var(--blue);border:1px solid rgba(96,165,250,0.3); }
.section-num-3 { background:var(--green-bg);color:var(--green);border:1px solid rgba(52,211,153,0.3); }
.section-meta { display:flex;flex-direction:column;gap:2px; }
.section-title { font-size:1.45rem;font-weight:700;line-height:1.2; }
.section-audience { display:inline-flex;align-items:center;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:2px; }
.aud-all { background:var(--purple-bg);color:var(--purple); }
.aud-art { background:var(--blue-bg);color:var(--blue); }
.aud-dev { background:var(--green-bg);color:var(--green); }

h3 { font-size:1.05rem;font-weight:700;margin:28px 0 12px;color:var(--text2); }
h4 { font-size:0.95rem;font-weight:700;margin:24px 0 10px;color:var(--accent); }
p  { margin-bottom:14px;color:var(--text2);font-size:0.93rem; }
p strong { color:var(--text); }

table { width:100%;border-collapse:collapse;margin-bottom:20px;font-size:0.85rem; }
thead th { background:var(--surface2);color:var(--text);font-weight:700;padding:10px 14px;text-align:left;border-bottom:2px solid var(--border); }
tbody td { padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top; }
tbody tr:hover td { background:var(--surface2); }
tbody td:first-child { color:var(--text);font-weight:600; }

.sheet-var { font-family:monospace;font-size:0.82rem;background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.25);border-radius:6px;padding:2px 7px;color:var(--blue); }

.callout { border-radius:var(--radius);padding:16px 20px;margin:20px 0;font-size:0.88rem; }
.callout-blue   { background:var(--blue-bg);border-left:3px solid var(--blue); }
.callout-yellow { background:var(--yellow-bg);border-left:3px solid var(--yellow); }
.callout-purple { background:var(--purple-bg);border-left:3px solid var(--purple); }
.callout strong { color:var(--text); }
.callout p { margin:0;color:var(--text2); }

ul,ol { padding-left:1.4em;color:var(--text2);font-size:0.92rem; }
ul li,ol li { margin-bottom:6px; }
ul li strong,ol li strong { color:var(--text); }

.sheet-block { background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin:20px 0; }
.sheet-block-title { font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--blue);margin-bottom:14px; }
.sheet-row { display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:0.86rem; }
.sheet-row:last-child { border-bottom:none; }
.sheet-row-var     { font-family:monospace;color:var(--blue);font-weight:600;min-width:300px; }
.sheet-row-default { font-family:monospace;color:var(--green);font-size:0.8rem;min-width:72px; }
.sheet-row-unit    { font-size:0.75rem;color:var(--text2);min-width:100px; }
.sheet-row-desc    { color:var(--text2);font-size:0.82rem;flex:1; }

.flow-step { display:flex;gap:14px;margin-bottom:14px;align-items:flex-start; }
.flow-dot  { width:28px;height:28px;border-radius:50%;background:var(--purple-bg);border:2px solid var(--purple);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:var(--purple);flex-shrink:0;margin-top:2px; }
.flow-body { flex:1; }
.flow-body strong { color:var(--text);font-size:0.9rem; }
.flow-body p { margin:2px 0 0;font-size:0.84rem;color:var(--text2); }
</style>
</head>

<script>
// ── 메타 배지 드롭다운 (index.html과 localStorage 공유) ──────────────
(function () {
  // ✏️ SPEC-XXX를 실제 spec ID로 변경 (예: 'spec-003')
  const SPEC_ID = 'spec-xxx';

  const TAG_INFO = {
    review:  { label: '🔍 리뷰',    cls: 'badge-blue'   },
    feature: { label: '✨ 기능',    cls: 'badge-green'  },
    balance: { label: '⚖️ 밸런스',  cls: 'badge-yellow' },
    bug:     { label: '🐛 버그',    cls: 'badge-red'    },
    ux:      { label: '🎨 UX/UI',   cls: 'badge-purple' },
    content: { label: '📦 콘텐츠',  cls: 'badge-yellow' },
    etc:     { label: '📌 기타',    cls: 'badge-blue'   },
  };
  const PRI_INFO = {
    high: { label: '🔴 높은 우선순위', cls: 'badge-red'    },
    mid:  { label: '🟡 보통 우선순위', cls: 'badge-yellow' },
    low:  { label: '⚪ 낮은 우선순위', cls: 'badge-blue'   },
  };
  const STATUS_INFO = {
    open:    { label: '🔵 검토중',    cls: 'badge-blue'   },
    wip:     { label: '🟡 진행중',    cls: 'badge-yellow' },
    done:    { label: '✅ 완료',      cls: 'badge-green'  },
    archive: { label: '🗄️ 아카이브', cls: 'badge-blue'   },
    hold:    { label: '⏸ 보류',      cls: 'badge-blue'   },
  };
  const DD_OPTIONS = {
    tag:      Object.entries(TAG_INFO).map(([v,i])    => ({ val: v, label: i.label })),
    priority: Object.entries(PRI_INFO).map(([v,i])    => ({ val: v, label: i.label })),
    status:   Object.entries(STATUS_INFO).map(([v,i]) => ({ val: v, label: i.label })),
  };
  const DD_LABEL  = { tag: '태그', priority: '우선순위', status: '상태' };
  const DEFAULTS  = { tag: 'ux', priority: 'mid', status: 'open' };
  let ddField = null;

  // ── 드롭다운 HTML (body에 append) ──
  const dd = document.createElement('div');
  dd.id = 'metaBadgeDropdown';
  dd.style.cssText = 'position:fixed;z-index:800;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,0.4);padding:5px;min-width:150px;display:none;';
  document.body.appendChild(dd);

  const ddCss = document.createElement('style');
  ddCss.textContent = '.dd-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);padding:5px 10px 3px;display:block}.dd-itm{display:flex;align-items:center;padding:7px 10px;border-radius:7px;font-size:.8rem;cursor:pointer;color:var(--text);transition:background .1s;white-space:nowrap;gap:6px}.dd-itm:hover{background:var(--surface2)}.dd-itm.active{color:var(--accent);font-weight:700;background:var(--purple-bg)}';
  document.head.appendChild(ddCss);

  function getOv()      { return JSON.parse(localStorage.getItem('spec-ov') || '{}'); }
  function saveOv(ov)   { localStorage.setItem('spec-ov', JSON.stringify(ov)); }
  function getVal(k)    { const ov = getOv(); return (ov[SPEC_ID] && ov[SPEC_ID][k]) || DEFAULTS[k]; }
  function setVal(k, v) { const ov = getOv(); if (!ov[SPEC_ID]) ov[SPEC_ID] = {}; ov[SPEC_ID][k] = v; saveOv(ov); }

  function applyBadge(el, info) {
    el.className = 'badge ' + info.cls;
    el.textContent = info.label;
    el.style.cursor = 'pointer';
  }

  function updateHero() {
    applyBadge(document.getElementById('hero-tag'),      TAG_INFO[getVal('tag')]      || TAG_INFO.etc);
    applyBadge(document.getElementById('hero-priority'), PRI_INFO[getVal('priority')] || PRI_INFO.mid);
    applyBadge(document.getElementById('hero-status'),   STATUS_INFO[getVal('status')]|| STATUS_INFO.open);
  }

  function openDropdown(e, field) {
    e.stopPropagation();
    const cur = getVal(field);
    dd.innerHTML = `<span class="dd-lbl">${DD_LABEL[field]}</span>` +
      DD_OPTIONS[field].map(o =>
        `<div class="dd-itm${o.val === cur ? ' active' : ''}" data-val="${o.val}">${o.label}</div>`
      ).join('');
    const rect = e.currentTarget.getBoundingClientRect();
    dd.style.left = Math.min(rect.left, window.innerWidth - 170) + 'px';
    dd.style.top  = (rect.bottom + 5) + 'px';
    dd.style.display = 'block';
    ddField = field;
  }

  document.addEventListener('DOMContentLoaded', function () {
    updateHero();
    const fieldMap = { 'hero-tag': 'tag', 'hero-priority': 'priority', 'hero-status': 'status' };
    Object.keys(fieldMap).forEach(elId => {
      document.getElementById(elId).addEventListener('click', e => openDropdown(e, fieldMap[elId]));
    });
    dd.addEventListener('click', function (e) {
      e.stopPropagation();
      const item = e.target.closest('.dd-itm');
      if (!item || !ddField) return;
      setVal(ddField, item.dataset.val);
      dd.style.display = 'none';
      ddField = null;
      updateHero();
    });
    document.addEventListener('click', () => { dd.style.display = 'none'; ddField = null; });
  });

  // ── 사이드바 네비 ──
  var links    = document.querySelectorAll('.nav-sidebar a');
  var sections = document.querySelectorAll('section[id]');
  function activate() {
    var scrollY = window.pageYOffset + 120;
    sections.forEach(function (s) {
      if (s.offsetTop <= scrollY && s.offsetTop + s.offsetHeight > scrollY) {
        links.forEach(function (l) { l.classList.remove('active'); });
        var a = document.querySelector('.nav-sidebar a[href="#' + s.id + '"]');
        if (a) a.classList.add('active');
      }
    });
  }
  window.addEventListener('scroll', activate);
  activate();
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.nav-sidebar') && !e.target.closest('.nav-toggle'))
