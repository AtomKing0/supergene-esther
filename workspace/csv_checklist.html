<style>

.sum-bar { display:flex; gap:18px; background:#fff; border-radius:10px; padding:10px 18px;
  margin-bottom:14px; font-size:13px; box-shadow:0 1px 4px rgba(0,0,0,.08); flex-wrap:wrap; }
.sum-bar span b { color:#0984e3; }

/* Table */

  overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); }
thead { background:#2d3436; color:#fff; }
th { padding:9px 10px; text-align:left; font-size:11px; font-weight:600; letter-spacing:.4px; white-space:nowrap; }
th.num { text-align:right; }
td { padding:8px 10px; font-size:12px; border-bottom:1px solid #f0f0f0; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
tr:last-child td { border-bottom:none; }
tr.checked { background:#fff5f5; }
tr.hidden { display:none; }
.cb { width:15px; height:15px; cursor:pointer; accent-color:#d63031; }

/* Badges */
.diff-badge {
  display:inline-block; padding:1px 7px; border-radius:10px;
  font-size:10px; font-weight:700; white-space:nowrap;
}
.d-VeryEasy { background:#81ecec; color:#00695c; }
.d-Easy { background:#a8d8ea; color:#1565c0; }
.d-Normal { background:#dfe6e9; color:#546e7a; }
.d-Hard { background:#fab1a0; color:#c0392b; }
.d-VeryHard { background:#e17055; color:#fff; }

.tier-badge {
  display:inline-block; padding:1px 7px; border-radius:10px;
  font-size:10px; font-weight:700;
}
.t-Normal { background:#dfe6e9; color:#546e7a; }
.t-Hard { background:#fdcb6e; color:#6c5ce7; }
.t-SH { background:#6c5ce7; color:#fff; }

.score-n { color:#636e72; }
.score-h { color:#e17055; font-weight:700; }
.score-sh { color:#6c5ce7; font-weight:700; }

.ratio-bar { display:flex; align-items:center; gap:5px; }
.ratio-track { width:52px; height:5px; background:#dfe6e9; border-radius:3px; overflow:hidden; }
.ratio-fill { height:100%; border-radius:3px; }
.r-low { background:#74b9ff; }
.r-mid { background:#00b894; }
.r-high { background:#fdcb6e; }

.adj-ok { color:#00b894; font-weight:700; font-size:11px; }
.adj-fix { background:#ff7675; color:#fff; font-size:11px; font-weight:700; padding:2px 7px; border-radius:4px; }

/* Export */
.export-box { display:none; margin-top:16px; background:#fff; border-radius:10px;
  padding:16px 18px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.export-box h3 { font-size:14px; margin-bottom:8px; color:#d63031; }
.export-box textarea { width:100%; height:140px; font-size:11px; font-family:monospace;

.copy-btn { margin-top:8px; padding:5px 14px; background:#0984e3; color:#fff;

f": "Normal", "fname": "Normal_obj_5811656403611471358_5811656403611471358.json", "field": 20, "deck": 7, "clear": 5, "ratio": 0.35, "score": 300, "tier": "Normal", "status": "ok", "min_deck": 1, "max_deck": 16, "cap": 0.8, "min_r": 0}];
const STATS = {"Normal": {"count": 273, "min": 0.2, "avg": 0.498, "max": 0.8, "median": 0.5}, "Hard": {"count": 2, "min": 0.562, "avg": 0.636, "max": 0.71, "median": 0.636}, "SH": null};
const CAPS = {"VeryEasy": 0.9, "Easy": 0.85, "Normal": 0.8, "Hard": 0.75, "VeryHard": 0.7};
const MINS = {"Hard": 0.3};

// Render stats cards
function renderStats() {
  const wrap = document.getElementById('statsWrap');
  const tiers = [['Normal','tier-normal','#dfe6e9'],['Hard','tier-hard','#fdcb6e'],['SH','tier-sh','#e8d5ff']];
  tiers.forEach(([t, cls, bg]) => {
    const s = STATS[t];
    const card = document.createElement('div');
    card.className = `stat-card ${cls}`;
    card.style.borderTop = `3px solid ${bg}`;
    if (!s) {
      card.innerHTML = `<h3>Score Tier: ${t}</h3><p style="font-size:12px;color:#b2bec3">데이터 없음</p>`;
    } else {
      card.innerHTML = `
        <h3>Score Tier: ${t} (${s.count}개)</h3>
        <div class="stat-grid">
          <span>min</span><b>${s.min.toFixed(3)}</b>
          <span>avg</span><b>${s.avg.toFixed(3)}</b>
          <span>max</span><b>${s.max.toFixed(3)}</b>
          <span>median</span><b>${s.median.toFixed(3)}</b>
        </div>`;
    }
    wrap.appendChild(card);
  });
}

function scoreClass(s) {
  if (s >= 1060) return 'score-sh';
  if (s >= 871) return 'score-h';
  return 'score-n';
}
function ratioClass(r) {
  if (r >= 0.60) return 'r-high';
  if (r >= 0.40) return 'r-mid';
  return 'r-low';
}
function deckAdjust(d) {
  if (d.status === 'low')
    return `<span class="adj-fix">↑ ${d.deck} → ${d.min_deck}</span>`;
  if (d.status === 'high')
    return `<span class="adj-fix">↓ ${d.deck} → ${d.max_deck}</span>`;
  return `<span class="adj-ok">✓</span> <span style="font-size:10px;color:#b2bec3">${d.min_deck}~${d.max_deck}</span>`;
}

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  DATA.forEach((d, i) => {
    const tr = document.createElement('tr');
    tr.id = 'row_' + i;
    tr.innerHTML = `
      <td><input class="cb" type="checkbox" onchange="onCheck(${i})" id="cb_${i}"></td>
      <td><b style="font-size:12px">${d.sid}</b></td>
      <td><span class="diff-badge d-${d.diff}">${d.diff}</span></td>
      <td><span class="tier-badge t-${d.tier}">${d.tier}</span></td>
      <td class="num"><span class="${scoreClass(d.score)}">${d.score}</span></td>
      <td class="num">${d.field}</td>
      <td class="num">${d.deck}</td>
      <td class="num">${d.clear}</td>
      <td>
        <div class="ratio-bar">
          <div class="ratio-track"><div class="ratio-fill ${ratioClass(d.ratio)}" style="width:${Math.min(d.ratio/0.9*100,100)}%"></div></div>
          <span style="font-size:11px">${d.ratio.toFixed(3)}</span>
        </div>
      </td>
      <td>${deckAdjust(d)}</td>
      <td style="font-size:10px;color:#b2bec3;font-family:monospace;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.fname}</td>`;
    tbody.appendChild(tr);
  });
  updateSumBar();
}

function onCheck(i) {
  const tr = document.getElementById('row_' + i);
  tr.classList.toggle('checked', document.getElementById('cb_' + i).checked);
  updateSumBar();
}

function updateSumBar() {
  const visible = DATA.filter((_,i) => {
    const r = document.getElementById('row_'+i);
    return r && !r.classList.contains('hidden');
  });
  const checked = DATA.filter((_,i) => document.getElementById('cb_'+i)?.checked);
  const issues = visible.filter(d => d.status !== 'ok');
  document.getElementById('sumBar').innerHTML = `
    <span>표시 <b>${visible.length}</b>개</span>
    <span>선택 <b style="color:#d63031">${checked.length}</b>개</span>
    <span>조정 필요 <b style="color:#e17055">${issues.length}</b>개</span>
    <span>Hard tier <b>${visible.filter(d=>d.tier==='Hard').length}</b>개</span>
    <span>SH tier <b style="color:#6c5ce7">${visible.filter(d=>d.tier==='SH').length}</b>개</span>`;
}

function applyFilter() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const diff = document.getElementById('filterDiff').value;
  const tier = document.getElementById('filterTier').value;
  DATA.forEach((d,i) => {
    const row = document.getElementById('row_'+i);
    if (!row) return;
    const matchQ = !q || d.sid.toLowerCase().includes(q) || d.fname.toLowerCase().includes(q);
    const matchD = !diff || d.diff === diff;
    const matchT = !tier || d.tier === tier;
    row.classList.toggle('hidden', !(matchQ && matchD && matchT));
  });
  updateSumBar();
}

document.getElementById('searchInput').addEventListener('input', applyFilter);

function selectAll() {
  DATA.forEach((_,i) => {
    const cb = document.getElementById('cb_'+i);
    const row = document.getElementById('row_'+i);
    if (cb && row && !row.classList.contains('hidden')) {
      cb.checked = true; row.classList.add('checked');
    }
  });
  updateSumBar();
}
function selectNone() {
  DATA.forEach((_,i) => {
    const cb = document.getElementById('cb_'+i);
    if (cb) cb.checked = false;
    document.getElementById('row_'+i)?.classList.remove('checked');
  });
  updateSumBar();
}

function showExport() {
  const items = DATA.filter((_,i) => document.getElementById('cb_'+i)?.checked);
  if (!items.length) { alert('선택된 항목이 없습니다.'); return; }
  document.getElementById('exportCount').textContent = items.length;
  document.getElementById('exportText').value = items.map(d => d.fname).join('\n');
  const box = document.getElementById('exportBox');
  box.style.display = 'block';
  box.scrollIntoView({behavior:'smooth'});
}
function copyExport() {
  navigator.clipboard.writeText(document.getElementById('exportText').value)
    .then(() => alert('클립보드에 복사됐습니다.'));
}

renderStats();
render();
</script>
