<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/cozy-cottage-design-system-d8a5c001-32d2-4e8f-9c86-9441765e0481/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/cozy-cottage-design-system-d8a5c001-32d2-4e8f-9c86-9441765e0481/tokens/colors.css">
  <link rel="stylesheet" href="_ds/cozy-cottage-design-system-d8a5c001-32d2-4e8f-9c86-9441765e0481/tokens/typography.css">
  <link rel="stylesheet" href="_ds/cozy-cottage-design-system-d8a5c001-32d2-4e8f-9c86-9441765e0481/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/cozy-cottage-design-system-d8a5c001-32d2-4e8f-9c86-9441765e0481/tokens/effects.css">
  <link rel="stylesheet" href="_ds/cozy-cottage-design-system-d8a5c001-32d2-4e8f-9c86-9441765e0481/tokens/base.css">
  <link rel="stylesheet" href="_ds/cozy-cottage-design-system-d8a5c001-32d2-4e8f-9c86-9441765e0481/styles.css">
  <script src="_ds/cozy-cottage-design-system-d8a5c001-32d2-4e8f-9c86-9441765e0481/_ds_bundle.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #4B6B44; }
    a { color: var(--coral-600); } a:hover { color: var(--coral-700); }
    .cc-num { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
    @keyframes drGlow { 0%,100% { box-shadow: 0 0 0 3px var(--coral-500), 0 0 12px 2px rgba(222,95,102,0.5); } 50% { box-shadow: 0 0 0 3px var(--coral-400), 0 0 18px 5px rgba(222,95,102,0.7); } }
    @keyframes drPop { 0% { transform: scale(0.9); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  </style>
</helmet>
<div style="min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 18px 12px; background: #4B6B44; font-family: var(--font-body); user-select: none; -webkit-user-select: none;">
  <div style="width: 430px; height: 932px; flex: none; position: relative; border-radius: 32px; overflow: hidden; box-shadow: var(--shadow-float); background: linear-gradient(180deg, #C9A063 0%, #B98A4E 100%);">

    <!-- ===== ROOM PREVIEW (drop-in isometric diner art) ===== -->
    <div style="position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, #E7C79A 0%, #D9B074 45%, #C99C5C 100%);">
      <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="vl-diner-room" shape="rect" placeholder="다이너 인테리어(아이소메트릭) 이미지를 놓으세요" fit="cover" hint-size="100%,100%" style="width: 100%; height: 100%; display: block;"></x-import>
    </div>

    <!-- highlighted renovation zone (the piece being restyled) -->
    <div style="position: absolute; z-index: 6; left: 150px; top: 300px; width: 128px; height: 210px; border-radius: 16px; background: {{ zoneFill }}; animation: drGlow 1.4s ease-in-out infinite; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; pointer-events: none;">
      <span style="background: var(--white); border: 2px solid var(--border-soft); border-radius: 999px; padding: 2px 12px; box-shadow: var(--shadow-soft);"><span class="cc-num" style="font-size: 12px; color: var(--ink-700);">문 리모델링</span></span>
    </div>

    <!-- ===== TOP BAR ===== -->
    <div style="position: absolute; top: 12px; left: 10px; right: 10px; z-index: 20; display: flex; align-items: center; gap: 8px;">
      <a href="vintage_lane_hub.html" aria-label="마을로 돌아가기" style="text-decoration: none; width: 44px; height: 44px; flex: none; border-radius: 14px; border: 2px solid var(--white); background: linear-gradient(180deg, #A9BBC7, #7C93A3); box-shadow: var(--shadow-float); display: flex; align-items: center; justify-content: center;">
        <span class="cc-icon" style="font-size: 26px; color: var(--white);">arrow_back</span>
      </a>
      <div style="flex: 1; display: flex; justify-content: center;">
        <span style="background: linear-gradient(180deg, #7FC7EC, #4FA3D6); border: 3px solid var(--white); border-radius: 16px; padding: 6px 22px; box-shadow: var(--shadow-float);"><span style="font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--white); text-shadow: 0 2px 0 rgba(30,90,85,0.4);">다이너 새단장</span></span>
      </div>
      <div style="position: relative; height: 40px; box-sizing: border-box; background: var(--white); border-radius: 999px; border: 2px solid var(--border-soft); box-shadow: var(--shadow-float); display: flex; align-items: center; padding: 0 12px 0 22px; flex: none;">
        <span class="cc-icon" style="position: absolute; left: -9px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; background: var(--gold-300); color: var(--gold-700); font-size: 20px; display: flex; align-items: center; justify-content: center; box-shadow: var(--sticker-ring), 0 2px 3px rgba(94,66,34,0.3);">paid</span>
        <span class="cc-num" style="font-size: 16px; color: var(--ink-900);">23</span>
      </div>
    </div>

    <!-- ===== BOTTOM: Choose Diner Renovation ===== -->
    <div style="position: absolute; left: 12px; right: 12px; bottom: 18px; z-index: 20; background: var(--cream-50); border: 3px solid var(--white); border-radius: 22px; box-shadow: var(--shadow-float); padding: 12px 14px 14px;">
      <div style="text-align: center; margin-bottom: 10px;"><span style="font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--ink-900);">단장 스타일 고르기</span></div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <sc-for list="{{ variants }}" as="v" hint-placeholder-count="3">
          <button onClick="{{ v.onClick }}" aria-label="{{ v.name }} 스타일" style="flex: 1; border: none; background: transparent; cursor: pointer; padding: 0;">
            <span style="display: block; height: 66px; border-radius: 16px; overflow: hidden; border: 4px solid {{ v.border }}; box-shadow: {{ v.shadow }}; animation: {{ v.anim }};">
              <span style="display: flex; height: 100%;">
                <span style="flex: 1; background: {{ v.c1 }};"></span>
                <span style="flex: 1; background: {{ v.c2 }};"></span>
                <span style="flex: 1; background: {{ v.c3 }};"></span>
              </span>
            </span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: center; margin-top: 12px;">
        <button onClick="{{ onConfirm }}" aria-label="이 스타일로 단장하기" style="border: none; cursor: pointer; background: linear-gradient(180deg, var(--leaf-600), #4b6b3a); border-radius: 16px; padding: 10px 40px; box-shadow: 0 4px 0 var(--edge-leaf); display: flex; align-items: center; gap: 8px;">
          <span class="cc-icon" style="font-size: 26px; color: var(--white);">check</span>
          <span style="font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--white);">단장하기</span>
        </button>
      </div>
    </div>

    <!-- toast -->
    <sc-if value="{{ toastShow }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; top: 120px; left: 0; right: 0; z-index: 40; display: flex; justify-content: center; pointer-events: none;">
        <span style="background: var(--white); border: 2px solid var(--border-soft); border-radius: 999px; padding: 8px 18px; box-shadow: var(--sticker-ring), var(--shadow-float); font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--ink-900);">{{ toastText }}</span>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:454,&quot;height&quot;:968}}">
const VARIANTS = [
  { id: 0, name: "선셋", c1: "#F2B84B", c2: "#F28C7B", c3: "#E8A0A8", fill: "rgba(242,140,123,0.35)" },
  { id: 1, name: "가든", c1: "#F2B84B", c2: "#8FB08A", c3: "#6E9E6A", fill: "rgba(142,176,138,0.35)" },
  { id: 2, name: "플로럴", c1: "#C9B6E4", c2: "#E8A0A8", c3: "#F28C7B", fill: "rgba(201,182,228,0.35)" },
];

class Component extends DCLogic {
  state = { sel: 0, toast: 0 };
  componentWillUnmount() { clearTimeout(this._tt); }
  confirm() {
    const v = VARIANTS[this.state.sel];
    this.setState({ toast: Date.now() });
    clearTimeout(this._tt);
    this._tt = setTimeout(() => this.setState({ toast: 0 }), 1800);
  }
  renderVals() {
    const s = this.state, sel = VARIANTS[s.sel];
    return {
      zoneFill: sel.fill,
      variants: VARIANTS.map((v) => ({
        name: v.name, c1: v.c1, c2: v.c2, c3: v.c3,
        border: v.id === s.sel ? "var(--gold-500)" : "var(--white)",
        shadow: v.id === s.sel ? "0 0 0 2px var(--gold-300), var(--shadow-card)" : "var(--shadow-soft)",
        anim: v.id === s.sel ? "drPop 260ms ease-out" : "none",
        onClick: () => this.setState({ sel: v.id }),
      })),
      onConfirm: () => this.confirm(),
      toastShow: !!s.toast,
      toastText: "멋져요! " + sel.name + " 스타일로 새단장했어요",
    };
  }
}
</script>
</body>
</html>
