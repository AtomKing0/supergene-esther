<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>솔리테어 런칭 동기간 비교</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#EDF0F6;display:flex;flex-direction:column;align-items:center;gap:28px;padding:40px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);width:1280px;overflow:hidden}
.card iframe{width:100%;border:0;border-radius:16px;display:block}
</style>
<script>
// iframe 높이 자동 맞춤 — 차트 비동기 렌더 + 버튼/토글 상호작용으로 높이가 바뀌므로
// ResizeObserver로 콘텐츠 변화를 상시 감지해 재조정(내부 스크롤 완전 방지). setTimeout은 초기 보강.
function fit(f,fb){
  function H(){try{var h=f.contentWindow.document.documentElement.scrollHeight;if(h>50)f.style.height=h+'px';}catch(e){f.style.height=fb;}}
  H();[250,700,1500,3000].forEach(function(t){setTimeout(H,t);});
  try{var d=f.contentWindow.document;new ResizeObserver(H).observe(d.body);
    f.contentWindow.addEventListener('click',function(){setTimeout(H,60);setTimeout(H,250);});}catch(e){}
}
</script>
</head><body>
<div class="card"><iframe id="bench" src="sol_bench.html" onload="fit(this,'840px')"></iframe></div>
<div class="card"><iframe id="trend" src="sol_trend.html" onload="fit(this,'900px')"></iframe></div>
<div class="card"><iframe id="extra" src="sol_extra.html" onload="fit(this,'2600px')"></iframe></div>
</body></html>
