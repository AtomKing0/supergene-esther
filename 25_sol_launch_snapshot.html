<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>솔리테어 런칭 동기간 비교</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#EDF0F6;display:flex;flex-direction:column;align-items:center;gap:28px;padding:40px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);width:1280px;overflow:hidden}
.card iframe{width:100%;border:0;border-radius:16px;display:block}
</style></head><body>
<div class="card"><iframe id="bench" src="sol_bench.html" onload="try{this.style.height=this.contentWindow.document.documentElement.scrollHeight+'px'}catch(e){this.style.height='840px'}"></iframe></div>
<div class="card"><iframe id="trend" src="sol_trend.html" onload="try{this.style.height=this.contentWindow.document.documentElement.scrollHeight+'px'}catch(e){this.style.height='880px'}"></iframe></div>
<div class="card"><iframe id="trk" src="sol_nru_tracker.html" scrolling="no" onload="try{this.style.height=this.contentWindow.document.documentElement.scrollHeight+'px'}catch(e){this.style.height='1040px'}"></iframe></div>
</body></html>
