<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Definition — Solitaire City Journey</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242838;--border:#2e3348;
  --text:#e2e8f0;--muted:#718096;--accent:#6c63ff;
  --green:#48bb78;--red:#f56565;--yellow:#ecc94b;--blue:#63b3ed;--orange:#ed8936;--cyan:#76e4f7;--pink:#f687b3;--purple:#b794f4;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap}
.search{flex:1;min-width:160px;max-width:320px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--text);font-size:13px;outline:none}
.search:focus{border-color:var(--accent)}
.cnt{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto}
.sheet-link{background:var(--green);color:#1a202c;border:none;border-radius:6px;padding:6px 16px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;text-decoration:none;transition:opacity .15s}
.sheet-link:hover{opacity:.85}

/* ── FILTERS ── */
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{color:var(--muted);font-size:11px;white-space:nowrap}
.pill{padding:3px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;transition:all .15s}
.pill:hover{border-color:var(--accent);color:var(--text)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sep{width:1px;height:18px;background:var(--border);flex-shrink:0}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2744;border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── TABLE ── */
.wrap{overflow-x:auto;padding:0 20px 80px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th{text-align:left;padding:7px 10px;background:var(--surface);border-bottom:2px solid var(--border);font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th.sorted-asc::after{content:' ▲';color:var(--accent)}
th.sorted-desc::after{content:' ▼';color:var(--accent)}
td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:var(--surface2)}

.row-num{color:var(--muted);font-size:11px}
.ename{font-family:'SF Mono','Fira Code',monospace;font-size:12px;white-space:nowrap;color:var(--cyan)}
.ecode{font-family:'SF Mono','Fira Code',monospace;font-size:11px;color:var(--yellow);white-space:nowrap}

/* category badges */
.cat{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.c-loading{background:#553c9a22;color:#b794f4;border:1px solid #553c9a55}
.c-login{background:#2c5f9a22;color:#63b3ed;border:1px solid #2c5f9a55}
.c-gameplay{background:#7c3a0022;color:#ed8936;border:1px solid #7c3a0055}
.c-social{background:#3a5c0022;color:#68d391;border:1px solid #3a5c0055}
.c-ads{background:#7c700022;color:#ecc94b;border:1px solid #7c700055}
.c-ui{background:#4a4a4a22;color:#cbd5e0;border:1px solid #4a4a4a55}
.c-session{background:#1a4a7c22;color:#76e4f7;border:1px solid #1a4a7c55}
.c-button{background:#4a7c4e22;color:#9ae6b4;border:1px solid #4a7c4e55}
.c-popup{background:#7c4a6e22;color:#f687b3;border:1px solid #7c4a6e55}
.c-error{background:#7c100022;color:#fc8181;border:1px solid #7c100055}
.c-legacy{background:#4a4a4a22;color:#a0aec0;border:1px solid #4a4a4a55}

.desc{color:var(--muted);font-size:12px;max-width:220px}
.call{font-family:'SF Mono','Fira Code',monospace;font-size:11px;color:var(--cyan);max-width:260px;white-space:normal;word-break:break-word;line-height:1.7}
.params{font-family:'SF Mono','Fira Code',monospace;font-size:10px;color:var(--purple);max-width:200px;word-break:break-all}

/* followup status */
.status-grp{display:flex;gap:3px;align-items:center}
.status-btn{padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.status-btn:hover{border-color:var(--text);color:var(--text)}
.status-btn.active-ok{background:var(--green);border-color:var(--green);color:#1a202c}
.status-btn.active-issue{background:var(--red);border-color:var(--red);color:#fff}
.status-btn.active-skip{background:#4a5568;border-color:#4a5568;color:var(--muted)}
.status-btn.active-new{background:var(--blue);border-color:var(--blue);color:#1a202c}

/* memo */
.memo-input{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--text);font-size:11px;width:100%;min-width:80px;outline:none}
.memo-input:focus{border-color:var(--accent)}

/* group separator */
.group-sep td{padding:8px 10px;background:var(--surface);border-top:2px solid var(--border);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.06em}

/* save bar */
.save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:12px;z-index:100}
.save-bar .info{font-size:12px;color:var(--muted);flex:1}
.save-bar .save-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 20px;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s}
.save-bar .save-btn:hover{opacity:.85}
.save-bar .save-btn:disabled{opacity:.4;cursor:not-allowed}
.save-bar .load-btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12px;transition:all .15s}
.save-bar .load-btn:hover{border-color:var(--accent);color:var(--accent)}
.save-bar .export-btn{background:var(--orange);color:#1a202c;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600;transition:opacity .15s}
.save-bar .export-btn:hover{opacity:.85}

/* ── CLIENT FOLDER SETTINGS ── */
.settings-bar{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.settings-bar .flabel{flex-shrink:0}
.folder-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 14px;color:var(--text);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.folder-btn:hover{border-color:var(--accent);color:var(--accent)}
.folder-btn.connected{border-color:var(--green);color:var(--green)}
.folder-name{font-size:12px;font-family:'SF Mono','Fira Code',monospace;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-status{font-size:11px;padding:3px 10px;border-radius:10px;white-space:nowrap}
.folder-status.on{background:rgba(72,187,120,.15);color:var(--green);border:1px solid rgba(72,187,120,.3)}
.folder-status.off{background:rgba(113,128,150,.1);color:var(--muted);border:1px solid rgba(113,128,150,.2)}
.disconnect-btn{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:2px 6px}
.disconnect-btn:hover{color:var(--red)}
.scan-status{font-size:11px;color:var(--yellow);white-space:nowrap}
.scan-status.done{color:var(--green)}
.scan-status.err{color:var(--red)}
.call .live{color:var(--green)}
.call .stale{color:var(--yellow);text-decoration:line-through;opacity:.5;margin-left:4px;font-size:10px}
.call .file-link{color:var(--cyan);text-decoration:none;border-bottom:1px dashed rgba(118,228,247,.3);cursor:pointer;white-space:nowrap}
.call .file-link:hover{color:#fff;border-bottom-color:var(--cyan)}
.call .no-link{color:var(--muted)}

/* ── CODE PREVIEW PANEL ── */
.code-panel{display:none;position:fixed;top:0;right:0;width:520px;height:100vh;background:var(--surface);border-left:2px solid var(--accent);z-index:200;flex-direction:column}
.code-panel.open{display:flex}
.code-panel-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.code-panel-title{flex:1;font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-panel-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.code-panel-close:hover{color:var(--red)}
.code-panel-body{flex:1;overflow:auto;padding:0}
.code-panel-body pre{margin:0;padding:10px 14px;font-family:'SF Mono','Fira Code',monospace;font-size:12px;line-height:1.6;color:var(--text);tab-size:4}
.code-panel-body .ln{display:inline-block;width:44px;text-align:right;color:var(--muted);margin-right:12px;user-select:none;flex-shrink:0}
.code-panel-body .highlight{background:rgba(108,99,255,.2);display:block;margin:0 -14px;padding:0 14px;border-left:3px solid var(--accent)}
.code-panel-body .ctx{display:block}
.code-panel-nodir{padding:20px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <h1>Log Definition — Solitaire City Journey</h1>
    <input class="search" type="text" placeholder="이벤트명 / 코드 / 설명 / 호출위치 검색..." id="q" oninput="render()">
    <span class="cnt" id="cnt"></span>
    <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1-QxV4ToLnL32qiQkWxbISFd575BYwVKBcaBE4YwJBLo/edit?gid=0#gid=0" target="_blank" rel="noopener">Google Sheet</a>
  </div>
  <div class="settings-bar">
    <span class="flabel">Client:</span>
    <button class="folder-btn" id="folder-btn" onclick="connectFolder()">폴더 연결...</button>
    <span class="folder-name" id="folder-name"></span>
    <span class="folder-status off" id="folder-status">미연결</span>
    <span class="scan-status" id="scan-status"></span>
    <button class="disconnect-btn" id="disconnect-btn" style="display:none" onclick="disconnectFolder()">연결 해제</button>
  </div>
  <div class="filters">
    <span class="flabel">카테고리:</span>
    <button class="pill active" data-cat="all" onclick="setCat(this)">All</button>
    <button class="pill" data-cat="loading" onclick="setCat(this)">Loading</button>
    <button class="pill" data-cat="login" onclick="setCat(this)">Login</button>
    <button class="pill" data-cat="gameplay" onclick="setCat(this)">Gameplay</button>
    <button class="pill" data-cat="social" onclick="setCat(this)">Social</button>
    <button class="pill" data-cat="ads" onclick="setCat(this)">Ads</button>
    <button class="pill" data-cat="ui" onclick="setCat(this)">UI/Shop</button>
    <button class="pill" data-cat="session" onclick="setCat(this)">Session</button>
    <button class="pill" data-cat="popup" onclick="setCat(this)">Popup</button>
    <button class="pill" data-cat="error" onclick="setCat(this)">Error</button>
    <button class="pill" data-cat="legacy" onclick="setCat(this)">Legacy</button>
    <div class="sep"></div>
    <span class="flabel">상태:</span>
    <button class="pill" data-filter="ok" onclick="toggleF(this)">OK</button>
    <button class="pill" data-filter="issue" onclick="toggleF(this)">Issue</button>
    <button class="pill" data-filter="new" onclick="toggleF(this)">New</button>
    <button class="pill" data-filter="skip" onclick="toggleF(this)">Skip</button>
    <button class="pill" data-filter="unmarked" onclick="toggleF(this)">Unmarked</button>
  </div>
</div>

<div class="wrap">
<table>
  <thead>
    <tr>
      <th data-sort="idx">#</th>
      <th data-sort="code">코드</th>
      <th data-sort="name">이벤트명</th>
      <th data-sort="cat">카테고리</th>
      <th>설명</th>
      <th>호출 위치</th>
      <th>파라미터</th>
      <th>상태</th>
      <th>메모</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<div class="save-bar">
  <span class="info" id="save-info">상태/메모는 localStorage에 저장됩니다</span>
  <button class="load-btn" onclick="importJSON()">JSON 불러오기</button>
  <button class="export-btn" onclick="exportJSON()">JSON 내보내기</button>
  <button class="save-btn" onclick="saveState()">저장</button>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept=".json" style="display:none" onchange="handleFileImport(event)">

<!-- Code Preview Panel -->
<div class="code-panel" id="code-panel">
  <div class="code-panel-hdr">
    <span class="code-panel-title" id="code-panel-title"></span>
    <button class="code-panel-close" onclick="closeCodePanel()">&times;</button>
  </div>
  <div class="code-panel-body" id="code-panel-body"></div>
</div>

// ── Scanner ──
async function* walkDir(handle, path = '') {
  for await (const entry of handle.values()) {
    const entryPath = path ? path + '/' + entry.name : entry.name;
    if (entry.kind === 'directory') {
      // skip node_modules, .git, build, temp, library
      if (['node_modules','.git','build','temp','library','local'].includes(entry.name)) continue;
      yield* walkDir(entry, entryPath);
    } else if (entry.name.endsWith('.ts') && !entry.name.endsWith('.d.ts')) {
      yield { handle: entry, path: entryPath };
    }
  }
}

async function scanFolder() {
  if (!dirHandle) return;
  liveCallMap = {};
  scanDone = false;
  const statusEl = document.getElementById('scan-status');
  statusEl.className = 'scan-status';
  statusEl.textContent = '스캔 중...';

  let fileCount = 0;
  let hitCount = 0;

  // Regex patterns for direct string-based calls
  const reLogEvent = /logEvent\(\s*["']([^"']+)["']/g;
  const reLogEventFB = /logEventFBOnly\(\s*["']([^"']+)["']/g;

  // Additional regex: catch LogType.XXX anywhere on a line (ternaries, variables, multi-line)
  const reLogTypeAnywhere = /LogType\.(\w+)/g;
  // Lines to skip (registrations, not actual calls)
  const SKIP_PATTERNS = ['registLogEvent', 'LOGTYPE_TO_CODE', '// '];

  try {
    for await (const entry of walkDir(dirHandle)) {
      fileCount++;
      if (fileCount % 50 === 0) statusEl.textContent = `스캔 중... ${fileCount} files`;

      const file = await entry.handle.getFile();
      const text = await file.text();
      fileCache[entry.path] = text;
      const lines = text.split('\n');

      // Skip the LogManager file's registLogEvent section (only registration, not calls)
      const isLogManager = entry.path.endsWith('LogManager.ts');

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();
        let m;

        // Skip registration lines and comments
        if (SKIP_PATTERNS.some(p => trimmed.includes(p))) continue;
        // In LogManager files, only catch logEvent("xxx") direct calls, skip LogType refs
        if (isLogManager && !trimmed.includes('logEvent')) continue;

        // Catch ALL LogType.XXX on the line (handles ternaries, variables, multi-line)
        reLogTypeAnywhere.lastIndex = 0;
        while ((m = reLogTypeAnywhere.exec(line)) !== null) {
          const code = LOGTYPE_TO_CODE[m[1]];
          if (code) {
            if (!liveCallMap[code]) liveCallMap[code] = [];
            // Dedupe same file+line
            if (!liveCallMap[code].some(h => h.file === entry.path && h.line === i + 1)) {
              liveCallMap[code].push({ file: entry.path, line: i + 1 });
              hitCount++;
            }
          }
        }

        // logEvent("CODE") / logEventFBOnly("CODE") — direct string literals
        for (const re of [reLogEvent, reLogEventFB]) {
          re.lastIndex = 0;
          while ((m = re.exec(line)) !== null) {
            const code = m[1];
            if (!liveCallMap[code]) liveCallMap[code] = [];
            if (!liveCallMap[code].some(h => h.file === entry.path && h.line === i + 1)) {
              liveCallMap[code].push({ file: entry.path, line: i + 1 });
              hitCount++;
            }
          }
        }
      }
    }

    scanDone = true;
    statusEl.className = 'scan-status done';
    statusEl.textContent = `${fileCount} files, ${hitCount} hits`;
    render();
    toast(`스캔 완료: ${fileCount}개 파일에서 ${hitCount}개 호출 발견`);
  } catch (e) {
    statusEl.className = 'scan-status err';
    statusEl.textContent = '스캔 실패';
    toast('스캔 에러: ' + e.message);
  }
}

async function connectFolder() {
  if (!window.showDirectoryPicker) {
    toast('이 브라우저는 폴더 연결을 지원하지 않습니다 (Chrome/Edge 필요)');
    return;
  }
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'read' });
    fileCache = {};
    document.getElementById('folder-btn').classList.add('connected');
    document.getElementById('folder-btn').textContent = dirHandle.name;
    document.getElementById('folder-name').textContent = '';
    document.getElementById('folder-status').textContent = dirHandle.name;
    document.getElementById('folder-status').className = 'folder-status on';
    document.getElementById('disconnect-btn').style.display = '';
    // auto-scan
    await scanFolder();
  } catch (e) {
    if (e.name !== 'AbortError') toast('폴더 연결 실패: ' + e.message);
  }
}

function disconnectFolder() {
  dirHandle = null;
  fileCache = {};
  liveCallMap = {};
  scanDone = false;
  document.getElementById('folder-btn').classList.remove('connected');
  document.getElementById('folder-btn').textContent = '폴더 연결...';
  document.getElementById('folder-name').textContent = '';
  document.getElementById('folder-status').textContent = '미연결';
  document.getElementById('folder-status').className = 'folder-status off';
  document.getElementById('disconnect-btn').style.display = 'none';
  document.getElementById('scan-status').textContent = '';
  closeCodePanel();
  render();
}

async function getFileByPath(relPath) {
  if (fileCache[relPath]) return fileCache[relPath];
  if (!dirHandle) return null;
  try {
    const parts = relPath.split('/');
    let handle = dirHandle;
    for (let i = 0; i < parts.length - 1; i++) {
      handle = await handle.getDirectoryHandle(parts[i]);
    }
    const fileH = await handle.getFileHandle(parts[parts.length - 1]);
    const file = await fileH.getFile();
    const text = await file.text();
    fileCache[relPath] = text;
    return text;
  } catch {
    return null;
  }
}

async function showCodePreview(relPath, lineNum) {
  const panel = document.getElementById('code-panel');
  const title = document.getElementById('code-panel-title');
  const body = document.getElementById('code-panel-body');

  if (!dirHandle) {
    body.innerHTML = '<div class="code-panel-nodir">폴더를 먼저 연결해주세요</div>';
    title.textContent = relPath;
    panel.classList.add('open');
    return;
  }

  title.textContent = `${relPath}${lineNum ? ':'+lineNum : ''}`;
  body.innerHTML = '<div class="code-panel-nodir">로딩...</div>';
  panel.classList.add('open');

  const content = await getFileByPath(relPath);
  if (!content) {
    body.innerHTML = '<div class="code-panel-nodir">파일을 찾을 수 없습니다</div>';
    return;
  }

  const lines = content.split('\n');
  const target = lineNum ? parseInt(lineNum) : 1;
  const start = Math.max(0, target - 16);
  const end = Math.min(lines.length, target + 15);

  let html = '<pre>';
  for (let i = start; i < end; i++) {
    const ln = i + 1;
    const isTarget = ln === target;
    const cls = isTarget ? 'highlight' : 'ctx';
    html += `<span class="${cls}"><span class="ln">${ln}</span>${escHtml(lines[i])}\n</span>`;
  }
  html += '</pre>';
  body.innerHTML = html;

  // scroll to highlight
  requestAnimationFrame(() => {
    const hl = body.querySelector('.highlight');
    if (hl) hl.scrollIntoView({ block: 'center' });
  });
}

function closeCodePanel() {
  document.getElementById('code-panel').classList.remove('open');
}

function makeCallLink(callStr, eventCode) {
  // If we have live scan results, use them
  if (scanDone && liveCallMap[eventCode]) {
    const hits = liveCallMap[eventCode];
    return hits.map(h => {
      const shortName = h.file.split('/').pop();
      return `<span class="file-link live" title="${h.file}:${h.line}" onclick="showCodePreview('${h.file}',${h.line})">${escHtml(shortName)}:${h.line}</span>`;
    }).join(', ');
  }

  // If scanned but no hits found
  if (scanDone) {
    if (!callStr || callStr.startsWith('(')) return `<span class="no-link">미발견</span>`;
    // show static as stale
    return `<span class="no-link stale" title="스캔에서 미발견 (정적 데이터)">${escHtml(callStr)}</span>`;
  }

  // Not scanned yet — show static data with click support
  if (!callStr || callStr.startsWith('(')) return `<span class="no-link">${escHtml(callStr||'—')}</span>`;

  return callStr.replace(/([\w]+\.ts)(?::(\d+))?/g, (match, file, line) => {
    const relPath = FILE_MAP[file];
    if (!relPath) return escHtml(match);
    return `<span class="file-link" title="${relPath}${line?':'+line:''}" onclick="showCodePreview('${relPath}',${line||0})">${escHtml(match)}</span>`;
  });
}

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
const STORAGE_KEY = 'solitaire_log_def_state';
let curCat = 'all';
let activeFilters = new Set();
let sortCol = null, sortDir = 'asc';
let state = {};   // {[code]: {status:'ok'|'issue'|'skip'|'new', memo:''}}

function loadState() {
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { state = {}; }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  toast('저장 완료');
}

loadState();

// ══════════════════════════════════════════════════════════════
// CATEGORY MAP
// ══════════════════════════════════════════════════════════════
const CAT_LABEL = {
  loading:'Loading', login:'Login/Time', gameplay:'Gameplay', social:'Social',
  ads:'Ads', ui:'UI/Shop', session:'Session', popup:'Popup', error:'Error/Log', legacy:'Legacy'
};
const CAT_CSS = {
  loading:'c-loading', login:'c-login', gameplay:'c-gameplay', social:'c-social',
  ads:'c-ads', ui:'c-ui', session:'c-session', button:'c-button', popup:'c-popup', error:'c-error', legacy:'c-legacy'
};

// ══════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════
function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const tbody = document.getElementById('tbody');
  let rows = '';
  let shown = 0;
  let lastCatGroup = '';

  let data = [...EVENTS];

  // sort
  if (sortCol) {
    data.sort((a, b) => {
      let va = a[sortCol] || '', vb = b[sortCol] || '';
      if (sortCol === 'idx') { va = EVENTS.indexOf(a); vb = EVENTS.indexOf(b); }
      if (typeof va === 'string') va = va.toLowerCase();
      if (typeof vb === 'string') vb = vb.toLowerCase();
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  data.forEach((e, i) => {
    // category filter
    if (curCat !== 'all' && e.cat !== curCat) return;

    // text search
    const searchStr = `${e.code} ${e.num} ${e.desc} ${e.call} ${e.params} ${(state[e.code]?.memo||'')}`.toLowerCase();
    if (q && !searchStr.includes(q)) return;

    // status filter
    if (activeFilters.size > 0) {
      const st = state[e.code]?.status || 'unmarked';
      if (!activeFilters.has(st)) return;
    }

    shown++;
    const s = state[e.code] || {};
    const catCss = CAT_CSS[e.cat] || 'c-ui';

    // group separator
    const catGroup = e.cat;
    if (catGroup !== lastCatGroup && !sortCol) {
      lastCatGroup = catGroup;
      rows += `<tr class="group-sep"><td colspan="9">${CAT_LABEL[catGroup] || catGroup} (${e.num.replace(/_.*/,'')}xxx)</td></tr>`;
    }

    rows += `<tr>
      <td class="row-num">${shown}</td>
      <td class="ecode">${e.num}</td>
      <td class="ename">${e.code}</td>
      <td><span class="cat ${catCss}">${CAT_LABEL[e.cat]||e.cat}</span></td>
      <td class="desc">${e.desc}</td>
      <td class="call">${makeCallLink(e.call, e.code)}</td>
      <td class="params">${e.params||'—'}</td>
      <td>
        <div class="status-grp">
          <button class="status-btn ${s.status==='ok'?'active-ok':''}" onclick="setStatus('${e.code}','ok',this)">OK</button>
          <button class="status-btn ${s.status==='issue'?'active-issue':''}" onclick="setStatus('${e.code}','issue',this)">Issue</button>
          <button class="status-btn ${s.status==='new'?'active-new':''}" onclick="setStatus('${e.code}','new',this)">New</button>
          <button class="status-btn ${s.status==='skip'?'active-skip':''}" onclick="setStatus('${e.code}','skip',this)">Skip</button>
        </div>
      </td>
      <td><input class="memo-input" value="${escHtml(s.memo||'')}" onchange="setMemo('${e.code}',this.value)" placeholder="메모..."></td>
    </tr>`;
  });

  tbody.innerHTML = rows;
  document.getElementById('cnt').textContent = `${shown} / ${EVENTS.length} events`;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ══════════════════════════════════════════════════════════════
// INTERACTIONS
// ══════════════════════════════════════════════════════════════
function setCat(el) {
  document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  curCat = el.dataset.cat;
  render();
}

function toggleF(el) {
  const f = el.dataset.filter;
  if (activeFilters.has(f)) { activeFilters.delete(f); el.classList.remove('active'); }
  else { activeFilters.add(f); el.classList.add('active'); }
  render();
}

function setStatus(code, status, btn) {
  if (!state[code]) state[code] = {};
  if (state[code].status === status) { delete state[code].status; }
  else { state[code].status = status; }
  autoSave();
  render();
}

function setMemo(code, val) {
  if (!state[code]) state[code] = {};
  state[code].memo = val;
  autoSave();
}

// debounced auto-save
let _saveTimer = null;
function autoSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }, 300);
}

// sorting
document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    if (sortCol === col) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
    else { sortCol = col; sortDir = 'asc'; }
    document.querySelectorAll('th').forEach(t => t.classList.remove('sorted-asc','sorted-desc'));
    th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
    render();
  });
});

// ══════════════════════════════════════════════════════════════
// IMPORT / EXPORT
// ══════════════════════════════════════════════════════════════
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `log-def-state-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('JSON 내보내기 완료');
}

function importJSON() {
  document.getElementById('file-input').click();
}

function handleFileImport(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      Object.assign(state, imported);
      saveState();
      render();
      toast(`${Object.keys(imported).length}개 항목 불러오기 완료`);
    } catch { toast('JSON 파싱 에러'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

// ══════════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════════
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Initial render ──
loadClientSettings();
render();
</script>
