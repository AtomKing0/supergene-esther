<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound List — Solitaire</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242838;--border:#2e3348;
  --text:#e2e8f0;--muted:#718096;--accent:#6c63ff;
  --green:#48bb78;--red:#f56565;--yellow:#ecc94b;--blue:#63b3ed;--orange:#ed8936;
  --cc-c:#9ae6b4;--cc-b:#4a7c4e;
  --sgh-c:#63b3ed;--sgh-b:#2c5f9a;
  --tiki-c:#ed8936;--tiki-b:#7c4a00;
  --rec-c:#fbd38d;--rec-b:#744210;
  --rec2-c:#fdba74;--rec2-b:#c2410c;
  --rec3-c:#fde68a;--rec3-b:#a16207;
  --rec4-c:#86efac;--rec4-b:#166534;
  --rec5-c:#c4b5fd;--rec5-b:#6d28d9;
  --rec6-c:#67e8f9;--rec6-b:#0e7490;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap}
.search{flex:1;min-width:160px;max-width:260px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;color:var(--text);font-size:13px;outline:none}
.search:focus{border-color:var(--accent)}

/* now playing */
.now{display:none;align-items:center;gap:8px;font-size:12px;color:var(--accent);min-width:0;overflow:hidden}
.now-lbl{color:var(--muted);white-space:nowrap}
.now-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.now-theme{color:var(--muted);white-space:nowrap}
.prog{width:64px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;flex-shrink:0}
.prog-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}
.stop-btn{background:var(--red);color:#fff;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px;white-space:nowrap;flex-shrink:0}

/* save button */
.save-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 16px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:opacity .15s}
.save-btn:hover{opacity:.85}
.save-btn:disabled{opacity:.4;cursor:not-allowed}
.cnt{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto}

/* ── FILTERS ── */
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{color:var(--muted);font-size:11px;white-space:nowrap}
.pill{padding:3px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;transition:all .15s}
.pill:hover{border-color:var(--accent);color:var(--text)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sep{width:1px;height:18px;background:var(--border);flex-shrink:0}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2744;border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--red);background:#2a1414}

/* ── NOTICE ── */
.notice{margin:10px 20px 0;padding:8px 14px;background:#1e2535;border:1px solid #3a4a6a;border-radius:6px;font-size:12px;color:var(--muted)}
.notice code{background:#0f1117;padding:1px 5px;border-radius:3px;color:var(--yellow);font-family:monospace}

/* ── TABLE ── */
.wrap{overflow:auto;padding:0 20px 80px;height:calc(100vh - var(--hdr-h,80px))}
table{width:100%;border-collapse:collapse;margin-top:12px}
th{text-align:left;padding:7px 10px;background:var(--surface);border-bottom:2px solid var(--border);font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;position:sticky;top:0;z-index:10}
td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--surface2)}
tr.playing td{background:rgba(108,99,255,.1)}
tr.sel-cc   td{border-left:3px solid var(--cc-b)}
tr.sel-sgh  td{border-left:3px solid var(--sgh-b)}
tr.sel-tiki td{border-left:3px solid var(--tiki-b)}
tr.sel-rec  td{border-left:3px solid var(--rec-b)}
tr.sel-rec2 td{border-left:3px solid var(--rec2-b)}
tr.sel-rec3 td{border-left:3px solid var(--rec3-b)}
tr.sel-rec4 td{border-left:3px solid var(--rec4-b)}
tr.sel-rec5 td{border-left:3px solid var(--rec5-b)}
tr.sel-rec6 td{border-left:3px solid var(--rec6-b)}

.sname{font-family:'SF Mono','Fira Code',monospace;font-size:12px;white-space:nowrap}

/* category */
.cat{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.c-bgm{background:#553c9a22;color:#b794f4;border:1px solid #553c9a55}
.c-card{background:#2c5f9a22;color:#63b3ed;border:1px solid #2c5f9a55}
.c-booster{background:#7c3a0022;color:#ed8936;border:1px solid #7c3a0055}
.c-gimmick{background:#3a5c0022;color:#68d391;border:1px solid #3a5c0055}
.c-coin{background:#7c700022;color:#ecc94b;border:1px solid #7c700055}
.c-streak{background:#7c100022;color:#fc8181;border:1px solid #7c100055}
.c-reward{background:#4a7c4e22;color:#9ae6b4;border:1px solid #4a7c4e55}
.c-event{background:#1a4a7c22;color:#76e4f7;border:1px solid #1a4a7c55}
.c-ui{background:#4a4a4a22;color:#cbd5e0;border:1px solid #4a4a4a55}

/* status badges */
.bk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700}
.bon{background:var(--green);color:#1a202c}
.boff{background:#2d3748;color:var(--muted)}
.bex{background:#7c1000;color:#fc8181}

.desc{color:var(--muted);font-size:12px;max-width:200px}
.call{font-family:monospace;font-size:11px;color:#76e4f7;white-space:nowrap}

.row-num{color:var(--muted);font-size:11px}

/* ── PLAY BUTTONS ── */
.pgrp{display:flex;gap:4px;align-items:center}
.pb{padding:3px 8px;border-radius:4px;border:1px solid;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;line-height:1.4}
.pb:disabled{opacity:.22;cursor:not-allowed}
.pb.cc {border-color:var(--cc-b);color:var(--cc-c);background:rgba(74,124,78,.12)}
.pb.cc:not(:disabled):hover{background:rgba(74,124,78,.4)}
.pb.cc.active{background:var(--cc-b);color:#0d1f10}
.pb.sgh{border-color:var(--sgh-b);color:var(--sgh-c);background:rgba(44,95,154,.12)}
.pb.sgh:not(:disabled):hover{background:rgba(44,95,154,.4)}
.pb.sgh.active{background:var(--sgh-b);color:#fff}
.pb.tiki{border-color:var(--tiki-b);color:var(--tiki-c);background:rgba(124,74,0,.12)}
.pb.tiki:not(:disabled):hover{background:rgba(124,74,0,.4)}
.pb.tiki.active{background:var(--tiki-b);color:#fff}
.pb.rec{border-color:var(--rec-b);color:var(--rec-c);background:rgba(116,66,16,.12)}
.pb.rec:not(:disabled):hover{background:rgba(116,66,16,.4)}
.pb.rec.active{background:var(--rec-b);color:#fff}
.pb.rec2{border-color:var(--rec2-b);color:var(--rec2-c);background:rgba(194,65,12,.12)}
.pb.rec2:not(:disabled):hover{background:rgba(194,65,12,.4)}
.pb.rec2.active{background:var(--rec2-b);color:#fff}
.pb.rec3{border-color:var(--rec3-b);color:var(--rec3-c);background:rgba(161,98,7,.12)}
.pb.rec3:not(:disabled):hover{background:rgba(161,98,7,.4)}
.pb.rec3.active{background:var(--rec3-b);color:#fff}
.pb.rec4{border-color:var(--rec4-b);color:var(--rec4-c);background:rgba(22,101,52,.12)}
.pb.rec4:not(:disabled):hover{background:rgba(22,101,52,.4)}
.pb.rec4.active{background:var(--rec4-b);color:#fff}
.pb.rec5{border-color:var(--rec5-b);color:var(--rec5-c);background:rgba(109,40,217,.12)}
.pb.rec5:not(:disabled):hover{background:rgba(109,40,217,.4)}
.pb.rec5.active{background:var(--rec5-b);color:#fff}
.pb.rec6{border-color:var(--rec6-b);color:var(--rec6-c);background:rgba(14,116,144,.12)}
.pb.rec6:not(:disabled):hover{background:rgba(14,116,144,.4)}
.pb.rec6.active{background:var(--rec6-b);color:#fff}

/* ── SELECTION RADIO ── */
.sel-grp{display:flex;gap:3px;align-items:center}
.sel-btn{padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.sel-btn:hover:not(:disabled){border-color:var(--text);color:var(--text)}
.sel-btn:disabled{opacity:.2;cursor:not-allowed}
.sel-btn.chosen.cc  {background:var(--cc-b);border-color:var(--cc-b);color:#0d1f10}
.sel-btn.chosen.sgh {background:var(--sgh-b);border-color:var(--sgh-b);color:#fff}
.sel-btn.chosen.tiki{background:var(--tiki-b);border-color:var(--tiki-b);color:#fff}
.sel-btn.chosen.rec {background:var(--rec-b);border-color:var(--rec-b);color:#fff}
.sel-btn.chosen.rec2{background:var(--rec2-b);border-color:var(--rec2-b);color:#fff}
.sel-btn.chosen.rec3{background:var(--rec3-b);border-color:var(--rec3-b);color:#fff}
.sel-btn.chosen.rec4{background:var(--rec4-b);border-color:var(--rec4-b);color:#fff}
.sel-btn.chosen.rec5{background:var(--rec5-b);border-color:var(--rec5-b);color:#fff}
.sel-btn.chosen.rec6{background:var(--rec6-b);border-color:var(--rec6-b);color:#fff}
.sel-btn.chosen.none{background:#2d3748;border-color:#4a5568;color:var(--muted)}

/* ── BEFORE / AFTER CHIPS ── */
.ba-chip{display:inline-flex;align-items:center;gap:2px;padding:3px 7px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;border:none;transition:all .15s;font-family:monospace}
.ba-chip.before{background:#3d2a1a;color:#f6ad55;border:1px solid #744210}
.ba-chip.after{background:#1a3020;color:#68d391;border:1px solid #276749}
.ba-chip:hover{opacity:.8}
.ba-chip.active{filter:brightness(1.4);outline:1px solid currentColor}
.ba-chip:disabled{opacity:.25;cursor:not-allowed}
.ba-sep{display:inline-block;width:1px;height:14px;background:var(--border);margin:0 5px;vertical-align:middle;opacity:.5}
tr.ba-row td:first-child::after{content:'';display:block;width:3px;height:100%;background:linear-gradient(#f6ad55,#68d391);position:absolute;left:0;top:0}
tr.ba-row td:first-child{position:relative}
/* ── DRAG & DROP ── */
tr.drag-over td{background:rgba(99,179,237,.12) !important;outline:2px dashed var(--accent)}
.pb[draggable="true"]{cursor:grab}
.pb[draggable="true"]:active{cursor:grabbing}
/* ── ARCHIVE PANEL ── */
.arch-panel{background:var(--surface);border-top:1px solid var(--border);padding:8px 14px;display:none;flex-wrap:wrap;gap:6px;align-items:center;min-height:42px;transition:background .2s,border-color .2s}
.arch-panel.open{display:flex}
.arch-panel.drag-active{background:rgba(246,173,85,.12);border-color:#f6ad55;outline:2px dashed #f6ad55;outline-offset:-2px}
.arch-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;border:1px solid #744210;background:#2d1f00;color:#f6ad55;font-size:11px;font-family:monospace;white-space:nowrap;cursor:grab}
.arch-chip:active{cursor:grabbing}
.arch-chip .arch-theme{font-size:10px;opacity:.7;font-family:sans-serif}
.arch-restore,.arch-play{background:none;border:none;color:#f6ad55;cursor:pointer;font-size:12px;padding:0 2px;opacity:.7;transition:opacity .15s}
.arch-restore:hover,.arch-play:hover{opacity:1}
.arch-empty{color:var(--muted);font-size:12px;font-style:italic}

/* ── CONFIRM BUTTON ── */
.conf-btn{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.conf-btn:hover{border-color:var(--green);color:var(--green)}
.conf-btn.confirmed{background:var(--green);border-color:var(--green);color:#1a202c}
tr.confirmed-row td{background:rgba(72,187,120,.13) !important;border-left:3px solid var(--green) !important}
tr.confirmed-row:hover td{background:rgba(72,187,120,.2) !important}

/* ── ARCHIVED ── */
tr.archived td{opacity:.38}
tr.archived:hover td{opacity:.55;background:var(--surface2)}
tr.archived td{border-left:3px solid #2d3748 !important}
.archive-sep td{padding:6px 10px;background:var(--surface);border-top:2px solid var(--border);font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <h1>🔊 Sound List</h1>
    <input class="search" type="text" placeholder="사운드명 / 설명 / 호출위치 검색..." id="q" oninput="render()">
    <div class="now" id="now">
      <span class="now-lbl">▶</span>
      <span class="now-name" id="now-name"></span>
      <span class="now-theme" id="now-theme"></span>
      <div class="prog"><div class="prog-fill" id="pfill"></div></div>
      <button class="stop-btn" onclick="stopAll()">■ 정지</button>
    </div>
    <span class="cnt" id="cnt"></span>
    <button class="save-btn" id="save-btn" onclick="saveSelections()">💾 선택 저장</button>
  </div>
  <div class="filters">
    <span class="flabel">카테고리:</span>
    <button class="pill active" data-cat="all" onclick="setCat(this)">All</button>
    <button class="pill" data-cat="BGM" onclick="setCat(this)">BGM</button>
    <button class="pill" data-cat="bgm" onclick="setCat(this)">bgm</button>
    <button class="pill" data-cat="card" onclick="setCat(this)">card</button>
    <button class="pill" data-cat="booster" onclick="setCat(this)">booster</button>
    <button class="pill" data-cat="gimmick" onclick="setCat(this)">gimmick</button>
    <button class="pill" data-cat="coin" onclick="setCat(this)">coin</button>
    <button class="pill" data-cat="streak" onclick="setCat(this)">streak</button>
    <button class="pill" data-cat="reward" onclick="setCat(this)">reward</button>
    <button class="pill" data-cat="event" onclick="setCat(this)">event</button>
    <button class="pill" data-cat="ui" onclick="setCat(this)">ui</button>
    <div class="sep"></div>
    <span class="flabel">상태:</span>
    <button class="pill" data-filter="applied" onclick="toggleF(this)">✓ 적용됨</button>
    <button class="pill" data-filter="notApplied" onclick="toggleF(this)">✗ 미적용</button>
    <div class="sep"></div>
    <span class="flabel">선택:</span>
    <button class="pill" data-filter="selCC"   onclick="toggleF(this)">CC 선택됨</button>
    <button class="pill" data-filter="selSGH"  onclick="toggleF(this)">SGH 선택됨</button>
    <button class="pill" data-filter="selTIKI" onclick="toggleF(this)">TIKI 선택됨</button>
    <button class="pill" data-filter="unsel"   onclick="toggleF(this)">미선택</button>
    <div class="sep"></div>
    <button class="pill" id="arch-toggle-btn" onclick="toggleArchivePanel()">📦 보관함 <span id="arch-count"></span></button>
  </div>
  <div class="arch-panel" id="arch-panel" ondragover="archZoneDragOver(event)" ondragleave="archZoneDragLeave(event)" ondrop="archZoneDrop(event)"></div>
</div>

<div class="notice" id="notice">
  ⚠️ 오디오 재생을 위해 로컬 서버가 필요합니다 —
  <code>cd /Users/estherpark/esther_solitaire/solitaire-esther-1/docs && python3 server.py</code>
  → <code>http://localhost:8080/docs/sound-list.html</code>
</div>

<div class="wrap">
<table>

      <th>#</th>

      <th>테마 선택</th>
      <th>확정</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<div class="toast" id="toast"></div>
<audio id="ap" preload="none"></audio>

let confirmations = JSON.parse(localStorage.getItem(CONF_KEY) || '{}');

function getPath(name, theme) {
  if (theme === 'cc')   return CC.has(name)  ? `../audio_sets/cc/${name}.wav` : null;
  if (theme === 'sgh')  return SGH.has(name) ? `../audio_sets/sgh/${name}.wav` : null;
  if (theme === 'tiki') return TIKI[name]    ? `../audio_sets/tiki/${name}.${TIKI[name]}` : null;
  if (theme === 'rec')  return REC.has(name) ? `../audio_sets/rec/${name}.wav` : null;
  if (theme === 'rec2') return REC2.has(name) ? `../audio_sets/rec/${name}_2.wav` : null;
  if (theme === 'rec3') return REC3.has(name) ? `../audio_sets/rec/${name}_3.wav` : null;
  if (theme === 'rec4') return REC4.has(name) ? `../audio_sets/rec/${name}_4.wav` : null;
  if (theme === 'rec5') return REC5.has(name) ? `../audio_sets/rec/${name}_5.wav` : null;
  if (theme === 'rec6') return REC6.has(name) ? `../audio_sets/rec/${name}_6.wav` : null;
  return null;
}

function hasFile(name, theme) { return !!getPath(name, theme); }

// ── playback ──
let curBtn = null, progTimer = null;

function stopAll() {
  const ap = document.getElementById('ap');
  ap.pause(); ap.currentTime = 0;
  if (curBtn) { curBtn.classList.remove('active'); curBtn.textContent = curBtn.dataset.lbl; }
  clearInterval(progTimer);
  document.getElementById('now').style.display = 'none';
  document.getElementById('pfill').style.width = '0%';
  document.querySelectorAll('tr.playing').forEach(r => r.classList.remove('playing'));
  curBtn = null;
}

function play(name, theme, btn) {
  const p = getPath(name, theme);
  if (!p) return;
  const same = curBtn === btn;
  stopAll();
  if (same) return;
  const ap = document.getElementById('ap');
  ap.src = p;
  ap.play().then(() => {
    curBtn = btn;
    btn.classList.add('active'); btn.dataset.lbl = btn.textContent; btn.textContent = '■';
    document.getElementById('now-name').textContent = name;
    document.getElementById('now-theme').textContent = '(' + theme.toUpperCase() + ')';
    document.getElementById('now').style.display = 'flex';
    btn.closest('tr').classList.add('playing');
    clearInterval(progTimer);
    progTimer = setInterval(() => {
      if (ap.duration) document.getElementById('pfill').style.width = (ap.currentTime / ap.duration * 100) + '%';
    }, 100);
    ap.onended = stopAll;
  }).catch(() => { btn.disabled = true; btn.style.opacity = '0.2'; });
}

function playDirect(path, btn, lbl) {
  const same = curBtn === btn;
  stopAll();
  if (same) return;
  const ap = document.getElementById('ap');
  ap.src = path;
  ap.play().then(() => {
    curBtn = btn;
    btn.classList.add('active'); btn.dataset.lbl = btn.textContent; btn.textContent = '■';
    document.getElementById('now-name').textContent = btn.closest('tr').dataset.name;
    document.getElementById('now-theme').textContent = '(' + lbl + ')';
    document.getElementById('now').style.display = 'flex';
    btn.closest('tr').classList.add('playing');
    clearInterval(progTimer);
    progTimer = setInterval(() => {
      if (ap.duration) document.getElementById('pfill').style.width = (ap.currentTime / ap.duration * 100) + '%';
    }, 100);
    ap.onended = stopAll;
  }).catch(() => {
    btn.textContent = btn.dataset.lbl || lbl;
    showToast('❌ 오디오 로드 실패 — server.py 재시작 확인', true);
  });
}

// ── selection ──
function applySelToRow(name, val) {
  // update all rows that show this sound name
  document.querySelectorAll(`tr[data-name="${name}"]`).forEach(row => {
    row.classList.remove('sel-cc','sel-sgh','sel-tiki','sel-rec','sel-rec2','sel-rec3','sel-rec4','sel-rec5','sel-rec6');
    if (val) row.classList.add('sel-' + val);
    row.querySelectorAll('.sel-btn').forEach(b => {
      b.classList.remove('chosen');
      if (b.dataset.theme === val) b.classList.add('chosen');
    });
  });
}

function select(name, theme, btn) {
  const prev = selections[name];
  const newVal = (prev === theme) ? null : theme;

  if (newVal) selections[name] = newVal;
  else delete selections[name];
  applySelToRow(name, newVal);

  localStorage.setItem(SEL_KEY, JSON.stringify(selections));
}

// ── confirm ──
function toggleConfirm(name, btn) {
  if (confirmations[name]) {
    delete confirmations[name];
    btn.classList.remove('confirmed');
    btn.textContent = '확정';
    btn.closest('tr').classList.remove('confirmed-row');
  } else {
    confirmations[name] = true;
    btn.classList.add('confirmed');
    btn.textContent = '✓ 확정';
    btn.closest('tr').classList.add('confirmed-row');
  }
  localStorage.setItem(CONF_KEY, JSON.stringify(confirmations));
}

// ── save ──
async function saveSelections() {
  const payload = SOUNDS.map(s => ({
    name: s.name,
    cat: s.cat,
    selected: selections[s.name] || null,
    confirmed: confirmations[s.name] || false
  }));
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    const res = await fetch('/api/save-selections', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.ok) {
      showToast(`✅ ${json.saved}개 항목 저장 완료 → docs/sound-selections.json`, false);
    } else {
      showToast('❌ 저장 실패: ' + json.error, true);
    }
  } catch(e) {
    showToast('❌ 서버 연결 실패 — server.py 실행 확인', true);
  } finally {
    btn.disabled = false; btn.textContent = '💾 선택 저장';
  }
}

// ── render ──
function mkRow(s, n, isArchived) {
  const sel     = selections[s.name];
  const conf    = confirmations[s.name];
  const catKey  = s.cat.toLowerCase();
  const grpTag  = GROUP_MAP[s.name] ? ' <span style="font-size:10px;color:var(--muted);opacity:.7">그룹</span>' : '';
  const selCls  = sel ? ` sel-${sel}` : '';
  const confCls = conf ? ' confirmed-row' : '';
  const archCls = isArchived ? ' archived' : '';
  const baCls   = BEFORE_AFTER[s.name] ? ' ba-row' : '';

  const ba = BEFORE_AFTER[s.name];
  const mkBA = () => {
    if (!ba) return '';
    const bBtn = ba.before
      ? `<button class="ba-chip before" data-lbl="◀ BEFORE" onclick="playDirect('${ba.before}',this,'BEFORE')">◀ BEFORE</button>`
      : `<button class="ba-chip before" disabled title="이전 사운드 없음">◀ BEFORE</button>`;
    const aBtn = ba.after
      ? `<button class="ba-chip after" data-lbl="AFTER ▶" onclick="playDirect('${ba.after}',this,'AFTER')">AFTER ▶</button>`
      : '';
    return bBtn + aBtn + `<span class="ba-sep"></span>`;
  };

  const mkPlay = (th) => {
    const p = getPath(s.name, th);
    return p
      ? `<button class="pb ${th}" draggable="true" ondragstart="chipDragStart(event,'${s.name}','${th}')" onclick="play('${s.name}','${th}',this)" data-lbl="${th.toUpperCase()}">${th.toUpperCase()}</button>`
      : `<button class="pb ${th}" disabled>${th.toUpperCase()}</button>`;
  };
  const mkSel = (th, label) => {
    const avail = hasFile(s.name, th);
    const chosen = sel === th;
    return avail
      ? `<button class="sel-btn ${th}${chosen?' chosen':''}" data-theme="${th}" onclick="select('${s.name}','${th}',this)">${label}</button>`
      : `<button class="sel-btn" disabled title="파일 없음">${label}</button>`;
  };
  const applBadge = s.excluded
    ? '<span class="bk bex" title="제외됨">✕</span>'
    : s.applied ? '<span class="bk bon">✓</span>' : '<span class="bk boff">—</span>';
  const confBtn = `<button class="conf-btn${conf?' confirmed':''}" onclick="toggleConfirm('${s.name}',this)">${conf?'✓ 확정':'확정'}</button>`;

  return `<tr class="${selCls}${confCls}${archCls}${baCls}" data-name="${s.name}" ondragover="rowDragOver(event,this)" ondragleave="this.classList.remove('drag-over')" ondrop="rowDrop(event,'${s.name}')">
    <td class="row-num">${n}</td>
    <td><span class="sname">${s.name}</span>${grpTag}</td>
    <td><span class="cat c-${catKey}">${s.cat}</span></td>
    <td><span class="desc">${s.desc}</span></td>
    <td>${applBadge}</td>
    <td><span class="call">${s.call}</span></td>
    <td><div class="pgrp">${mkBA()}${mkPlay('cc')}${mkPlay('sgh')}${mkPlay('tiki')}${mkPlay('rec')}${mkPlay('rec2')}${mkPlay('rec3')}${mkPlay('rec4')}${mkPlay('rec5')}${mkPlay('rec6')}</div></td>
    <td><div class="sel-grp">${mkSel('cc','CC')}${mkSel('sgh','SGH')}${mkSel('tiki','TIKI')}${mkSel('rec','추천1')}${mkSel('rec2','추천2')}${mkSel('rec3','추천3')}${mkSel('rec4','추천4')}${mkSel('rec5','추천5')}${mkSel('rec6','추천6')}</div></td>
    <td>${confBtn}</td>
  </tr>`;
}

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  let active = [], archived = [];

  SOUNDS.forEach(s => {
    if (activeCat !== 'all' && s.cat !== activeCat) return;
    if (q && !s.name.toLowerCase().includes(q) && !s.desc.toLowerCase().includes(q) && !s.call.toLowerCase().includes(q)) return;
    if (activeFilters.has('applied')    && !s.applied) return;
    if (activeFilters.has('notApplied') &&  s.applied) return;
    const sel = selections[s.name];
    if (activeFilters.has('selCC')   && sel !== 'cc')   return;
    if (activeFilters.has('selSGH')  && sel !== 'sgh')  return;
    if (activeFilters.has('selTIKI') && sel !== 'tiki') return;
    if (activeFilters.has('unsel')   && sel)             return;
    if (sel || s.name === 'BGM_LOBBY') active.push(s); else archived.push(s);
  });

  // BGM 카테고리를 active 섹션 맨 아래로 정렬
  active.sort((a, b) => {
    const aIsBgm = a.cat === 'bgm' || a.cat === 'BGM';
    const bIsBgm = b.cat === 'bgm' || b.cat === 'BGM';
    if (aIsBgm && !bIsBgm) return 1;
    if (!aIsBgm && bIsBgm) return -1;
    return 0;
  });

  let rows = '';
  active.forEach((s, i)  => { rows += mkRow(s, i + 1, false); });
  if (archived.length) {
    rows += `<tr class="archive-sep"><td colspan="9">⬇ ARCHIVED — 미선택 음원 (${archived.length}개)</td></tr>`;
    archived.forEach((s, i) => { rows += mkRow(s, i + 1, true); });
  }

  document.getElementById('tbody').innerHTML = rows;
  document.getElementById('cnt').textContent = (active.length + archived.length) + '개';
}

if (location.protocol !== 'file:') document.getElementById('notice').style.display = 'none';

// ── drag & drop ──
let dragData = null;

let panelAutoOpened = false;

function chipDragStart(event, name, theme) {
  dragData = { name, theme };
  event.dataTransfer.effectAllowed = 'all';
  event.dataTransfer.setData('text/plain', name + '/' + theme);
  // 보관함 패널 자동 열기
  const panel = document.getElementById('arch-panel');
  if (!panel.classList.contains('open')) {
    panel.classList.add('open');
    panelAutoOpened = true;
    requestAnimationFrame(updateHdrHeight);
  } else {
    panelAutoOpened = false;
  }
}

document.addEventListener('dragend', () => {
  // 드래그 취소 or 드롭 완료 후 자동 열린 패널 닫기 (아이템 없을 때만)
  if (panelAutoOpened && archivedItems.length === 0) {
    document.getElementById('arch-panel').classList.remove('open');
    requestAnimationFrame(updateHdrHeight);
  }
  panelAutoOpened = false;
  document.getElementById('arch-panel').classList.remove('drag-active');
});

function rowDragOver(event, tr) {
  if (!dragData) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'copy';
  tr.classList.add('drag-over');
}

function nextRecSlot(name) {
  if (!REC.has(name))  return 'rec';
  if (!REC2.has(name)) return 'rec2';
  if (!REC3.has(name)) return 'rec3';
  if (!REC4.has(name)) return 'rec4';
  if (!REC5.has(name)) return 'rec5';
  if (!REC6.has(name)) return 'rec6';
  return null;
}

async function rowDrop(event, toName) {
  event.preventDefault();
  document.querySelectorAll('tr.drag-over').forEach(r => r.classList.remove('drag-over'));
  if (!dragData) return;
  const { name: fromName, theme: fromTheme, source } = dragData;
  dragData = null;
  const slot = nextRecSlot(toName);
  if (!slot) { showToast(toName + ' 추천 슬롯이 모두 찼습니다 (최대 6개)', true); return; }
  // archive 칩 드롭: arch_ prefix로 copy-sound 호출
  const apiTheme = source === 'archive' ? 'arch_' + fromTheme : fromTheme;
  if (source !== 'archive' && fromName === toName) { showToast('같은 키로는 복사할 수 없음', true); return; }
  try {
    const res = await fetch('/api/copy-sound', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ from_name: fromName, from_theme: apiTheme, to_name: toName, to_slot: slot })
    });
    const data = await res.json();
    if (data.ok) {
      showToast('✓ ' + fromName + '(' + fromTheme.toUpperCase() + ') → ' + toName + ' ' + slot);
      if (slot === 'rec')  REC.add(toName);
      if (slot === 'rec2') REC2.add(toName);
      if (slot === 'rec3') REC3.add(toName);
      if (slot === 'rec4') REC4.add(toName);
      if (slot === 'rec5') REC5.add(toName);
      if (slot === 'rec6') REC6.add(toName);
      render();
    } else {
      showToast(data.error || '복사 실패', true);
    }
  } catch(e) {
    showToast('서버 오류: ' + e.message, true);
  }
}

// ── archive zone (보관) ──
function archZoneDragOver(event) {
  if (!dragData || dragData.source === 'archive') return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  document.getElementById('arch-panel').classList.add('drag-active');
}
function archZoneDragLeave(event) {
  // relatedTarget이 패널 내부면 무시 (자식 요소로 이동 시 flicker 방지)
  const panel = document.getElementById('arch-panel');
  if (panel.contains(event.relatedTarget)) return;
  panel.classList.remove('drag-active');
}
async function archZoneDrop(event) {
  event.preventDefault();
  document.getElementById('arch-panel').classList.remove('drag-active');
  console.log('[archive] drop, dragData:', dragData);
  if (!dragData || dragData.source === 'archive') return;
  const { name, theme } = dragData;
  dragData = null;
  if (selections[name] === theme) {
    showToast('선택된 항목은 보관 불가 (먼저 선택 해제)', true);
    return;
  }
  try {
    const res = await fetch('/api/archive-sound', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, theme })
    });
    const data = await res.json();
    console.log('[archive] response:', data);
    if (data.ok) {
      showToast('📦 ' + name + ' (' + theme.toUpperCase() + ') 보관됨');
      if (theme === 'cc')   CC.delete(name);
      if (theme === 'sgh')  SGH.delete(name);
      if (theme === 'tiki') delete TIKI[name];
      if (theme === 'rec')  REC.delete(name);
      if (theme === 'rec2') REC2.delete(name);
      if (theme === 'rec3') REC3.delete(name);
      if (theme === 'rec4') REC4.delete(name);
      if (theme === 'rec5') REC5.delete(name);
      if (theme === 'rec6') REC6.delete(name);
      render();
      await loadArchived();
      document.getElementById('arch-panel').classList.add('open');  // 자동 열기
    } else {
      showToast(data.error || '보관 실패', true);
    }
  } catch(e) {
    console.error('[archive] error:', e);
    showToast('서버 오류: ' + e.message, true);
  }
}

// ── archive playback ──
function getArchivePath(name, theme) {
  if (theme === 'cc')   return `../audio_sets/archive/cc/${name}.wav`;
  if (theme === 'sgh')  return `../audio_sets/archive/sgh/${name}.wav`;
  if (theme === 'tiki') { const ext = TIKI[name] || 'wav'; return `../audio_sets/archive/tiki/${name}.${ext}`; }
  if (theme === 'rec')  return `../audio_sets/archive/rec/${name}.wav`;
  if (theme === 'rec2') return `../audio_sets/archive/rec/${name}_2.wav`;
  if (theme === 'rec3') return `../audio_sets/archive/rec/${name}_3.wav`;
  if (theme === 'rec4') return `../audio_sets/archive/rec/${name}_4.wav`;
  if (theme === 'rec5') return `../audio_sets/archive/rec/${name}_5.wav`;
  if (theme === 'rec6') return `../audio_sets/archive/rec/${name}_6.wav`;
  return null;
}

function playArchive(name, theme, btn) {
  const p = getArchivePath(name, theme);
  if (!p) return;
  const same = curBtn === btn;
  stopAll();
  if (same) return;
  const ap = document.getElementById('ap');
  ap.src = p;
  ap.play().then(() => {
    curBtn = btn;
    btn.classList.add('active'); btn.dataset.lbl = btn.textContent; btn.textContent = '■';
    document.getElementById('now-name').textContent = name;
    document.getElementById('now-theme').textContent = '(' + theme.toUpperCase() + ') [보관]';
    document.getElementById('now').style.display = 'flex';
    clearInterval(progTimer);
    progTimer = setInterval(() => {
      if (ap.duration) document.getElementById('pfill').style.width = (ap.currentTime / ap.duration * 100) + '%';
    }, 100);
    ap.onended = stopAll;
  }).catch(() => { btn.disabled = true; btn.style.opacity = '0.2'; });
}

// ── archive panel ──
let archivedItems = [];

async function loadArchived() {
  try {
    const res = await fetch('/api/archived-files');
    archivedItems = await res.json();
  } catch(e) {
    archivedItems = [];
  }
  renderArchivePanel();
}

function renderArchivePanel() {
  const count = archivedItems.length;
  document.getElementById('arch-count').textContent = count ? `(${count})` : '';
  const panel = document.getElementById('arch-panel');
  if (!count) {
    panel.innerHTML = '<span class="arch-empty">보관된 음원 없음</span>';
  } else {
    panel.innerHTML = archivedItems.map(it =>
      `<span class="arch-chip" draggable="true" ondragstart="archiveDragStart(event,'${it.name}','${it.theme}')">
        ${it.name} <span class="arch-theme">${it.theme.toUpperCase()}</span>
        <button class="arch-play" onclick="playArchive('${it.name}','${it.theme}',this)" title="미리듣기">▶</button>
        <button class="arch-restore" onclick="restoreSound('${it.name}','${it.theme}')" title="원래 위치로 복원">↩</button>
      </span>`
    ).join('');
  }
}

function toggleArchivePanel() {
  const panel = document.getElementById('arch-panel');
  panel.classList.toggle('open');
  requestAnimationFrame(updateHdrHeight);
}

function archiveDragStart(event, name, theme) {
  dragData = { name, theme, source: 'archive' };
  event.dataTransfer.effectAllowed = 'copy';
  event.dataTransfer.setData('text/plain', name + '/' + theme);
}

async function restoreSound(name, theme) {
  try {
    const res = await fetch('/api/restore-sound', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, theme })
    });
    const data = await res.json();
    if (data.ok) {
      showToast('↩ ' + name + ' (' + theme + ') 복원됨');
      // Set에 다시 추가
      if (theme === 'cc')   CC.add(name);
      if (theme === 'sgh')  SGH.add(name);
      if (theme === 'tiki') { /* tiki ext는 서버가 결정 — 페이지 리로드 */ location.reload(); return; }
      if (theme === 'rec')  REC.add(name);
      if (theme === 'rec2') REC2.add(name);
      if (theme === 'rec3') REC3.add(name);
      if (theme === 'rec4') REC4.add(name);
      if (theme === 'rec5') REC5.add(name);
      if (theme === 'rec6') REC6.add(name);
      archivedItems = archivedItems.filter(it => !(it.name === name && it.theme === theme));
      renderArchivePanel();
      render();
    } else {
      showToast(data.error || '복원 실패', true);
    }
  } catch(e) {
    showToast('서버 오류: ' + e.message, true);
  }
}

// ── sticky header height ──
function updateHdrHeight() {
  const h = document.querySelector('.hdr').offsetHeight;
  document.documentElement.style.setProperty('--hdr-h', h + 'px');
}
window.addEventListener('resize', updateHdrHeight);

// ── init: fetch rec-files then render ──
(async () => {
  if (location.protocol !== 'file:') {
    try {
      const [recRes, archRes] = await Promise.all([
        fetch('/api/rec-files'),
        fetch('/api/archived-files')
      ]);
      const recMap = await recRes.json();
      Object.entries(recMap).forEach(([name, slots]) => {
        if (slots.includes('rec'))  REC.add(name);
        if (slots.includes('rec2')) REC2.add(name);
        if (slots.includes('rec3')) REC3.add(name);
        if (slots.includes('rec4')) REC4.add(name);
        if (slots.includes('rec5')) REC5.add(name);
        if (slots.includes('rec6')) REC6.add(name);
      });
      archivedItems = await archRes.json();
      renderArchivePanel();
      if (archivedItems.length > 0) document.getElementById('arch-panel').classList.add('open');
    } catch(e) { console.error('[init]', e); }
  }
  render();
  requestAnimationFrame(() => { updateHdrHeight(); });
})();
</script>
