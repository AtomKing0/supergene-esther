.wire-stage{position:relative;display:block;width:100%;height:100%;min-height:0}
.wire-stage img{width:100%;height:100%;object-fit:contain}
#wire-highlight{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.highlight-box{fill:#fbbf242e;stroke:#ef9b0f;stroke-width:3}
.highlight-pin{fill:#ec950b;stroke:#fff;stroke-width:2}
.highlight-number{fill:#fff;font-size:13px;font-weight:800;font-family:var(--f-mono)}
.element[tabindex]{border-radius:6px;outline-offset:2px}
.element.is-highlighted,.element[tabindex]:focus-visible{background:#fff2cf;outline:1px solid #edc46c}
@media print{#wire-highlight{display:none}.element.is-highlighted{background:none;outline:none}}

/* 도해는 가로 공간을 먼저 확보하고 원작 이미지는 별도 참고 칸에 둔다. */
.diagram-page .spread{grid-template-columns:800px minmax(0,1fr);gap:24px}
.diagram-page .visual{padding-right:20px}
.diagram-page .image-pair{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 130px;gap:12px}
.diagram-page figure.reference{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;align-items:center}
.diagram-page figure.reference figcaption{margin:0}
.diagram-page figure.reference .image-button{height:130px;justify-self:start;width:180px}
.diagram-page .ref-note{font-size:11px;line-height:1.35;margin-top:6px}
.diagram-page .element dl{grid-template-columns:60px minmax(0,1fr);gap:3px 7px}
.diagram-page .column-label span{display:none}
#nav details details{margin:4px 0 7px 10px;padding-left:8px;border-left:1px solid #d4ddca}
#nav .nav-level-0>summary{font-size:15px;padding:10px 0;color:#2d4934}
#nav .nav-level-1>summary{font-size:13px}
#nav .nav-level-2>summary{font-size:12px}
#nav button{font-size:11px;padding:6px 4px;gap:5px}

.comparison-page .spread{display:none}
#comparison{flex:1;min-height:0;padding-top:12px}
#comparison[hidden]{display:none}
.comparison-note{font-size:12px;margin:0 0 8px;color:#66745f}
.comparison-grid{display:grid;gap:7px;height:calc(100% - 27px)}
.comparison-grid.infobar{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
.comparison-grid.cells{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
.comparison-card{border:1px solid #d3ddcc;background:#fff;border-radius:6px;padding:5px 7px;display:flex;flex-direction:column;min-height:0}
.comparison-card h2{font-size:12px;line-height:1.2;margin:0 0 3px}
.compare-image{padding:0;border:0;background:transparent;display:block;min-height:0;width:100%;flex:1;cursor:zoom-in}
.compare-image img{width:100%;height:100%;object-fit:contain;display:block}
.comparison-card p{font-size:10px;line-height:1.25;margin:3px 0 0;color:#5e6d57}
.reference-card{background:#f4f7ef}
.structure-top{display:grid;grid-template-columns:820px minmax(0,1fr);gap:22px;height:300px}
.structure-top>.compare-image{height:100%}
.structure-notes h2{font-size:15px;margin:3px 0 5px}
.structure-notes p{font-size:13px;line-height:1.5;margin:0 0 12px}
.tone-note{padding:8px;background:#eff3e9;border-radius:5px}
.slot-title{font-size:16px;margin:12px 0 9px}
.structure-bottom{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:18px;height:280px}
.slot-table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.4}
.slot-table th,.slot-table td{border:1px solid #d9e1d3;padding:7px 10px;text-align:left}
.slot-table th{background:#ecf1e6;color:#47623e}
.structure-reference{display:flex;flex-direction:column;min-height:0}
.structure-reference p{font-size:11px;color:#617258;margin:0 0 8px}
#zoom-caption{white-space:pre-line;max-height:180px;overflow:auto;text-align:left;line-height:1.5}

#scope-status:not(:empty){background:#fae0dd;color:#983d32;border:1px solid #e7aaa1;border-radius:5px;padding:5px 9px}.spec-excluded{border:2px solid #d59083}#scope-out[aria-pressed=true]{background:#fae0dd;color:#983d32;border-color:#d59083}

/* 항목별로 줄을 나누고, 넘치는 요소는 다음 페이지로 보낸다. */
#rows-content{width:100%}
.element{grid-template-columns:21px minmax(0,1fr);gap:7px;padding:5px 0}
.element-number{width:21px;height:21px;font-size:10px}
.element h2{font-size:13px;line-height:1.25;margin:0 0 3px}
.element dl,.diagram-page .element dl{display:grid;grid-template-columns:82px minmax(0,1fr);gap:2px 8px;font-size:12px;line-height:1.4}
.element dt{display:block;font-size:10px;font-weight:600;padding:1px 0 0;margin:0;color:#718268}
.element dd{display:block;margin:0;word-break:normal}
.element dd::after{content:none}
#zoom{cursor:zoom-out}

.intro-lead{font-size:19px;line-height:1.5;margin:0 0 14px;color:#40593c}
.intro-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.intro-stats>div{background:#edf2e6;padding:12px 18px;border-radius:7px;display:flex;align-items:baseline;gap:12px}
.intro-stats b{font-size:26px;color:#3d6538}.intro-stats span{font-size:13px;color:#6d7c62}
.intro-main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;height:425px}
.intro-cards{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:15px}
.intro-cards article{border-top:2px solid #aabca0;padding:14px 8px}
.intro-cards h2{font-size:18px;line-height:1.4;margin:0 0 12px}
.intro-cards p{font-size:16px;line-height:1.65;margin:0;color:#4b5844}
.intro-visuals{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}.intro-visuals figure{min-height:0}
.intro-note{font-size:11px;line-height:1.45;color:#79846e;margin:12px 0 0}

.ladder-comparison{display:grid;grid-template-rows:1fr 1fr;gap:22px;height:calc(100% - 40px)}
.ladder-comparison section{min-height:0;border:1px solid #d7e1d1;border-radius:8px;padding:14px;background:#f7f9f3}
.ladder-comparison h2{font-size:17px;margin:0 0 16px}
.ladder-items{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:8px}
.ladder-items figure{height:172px;min-height:0;text-align:center}
.ladder-items .compare-image{background:white;border-radius:6px}
.ladder-items figcaption{font-size:12px;line-height:1.4;height:50px;margin:8px 0 0}
.reference-comparison{display:grid;gap:20px;height:calc(100% - 44px)}
.reference-comparison article{display:flex;flex-direction:column;min-height:0;padding:14px;background:#f7f9f3;border:1px solid #d9e2d3;border-radius:8px}
.reference-comparison h2{font-size:16px;line-height:1.4;margin:0 0 10px}
.reference-comparison p{font-size:12px;line-height:1.5;color:#67775c;margin:10px 0 0}
.reference-comparison .compare-image{min-height:0;flex:1}

.reference-comparison.strip{grid-template-columns:1fr!important;grid-template-rows:1fr 1fr}

.animation-related{background:#edf2e6;border:1px solid #b9c5b0;border-radius:6px;padding:6px 12px;color:#40503d;cursor:pointer;margin-bottom:12px}.animation-grid{display:grid;gap:18px;align-items:start}.animation-grid article{min-width:0;padding:12px;background:#f5f7f1;border:1px solid #d8dfd1;border-radius:8px}.animation-grid h2{font-size:17px;margin:6px 0 10px}.animation-grid .compare-image{height:330px;width:100%;background:#fff}.animation-grid img{max-height:100%;max-width:100%;object-fit:contain}.animation-grid p{font-size:13px;line-height:1.5;margin:8px 0}.animation-grid .animation-origin{font-size:11px;color:#68775f}.animation-grid .animation-trigger{font-weight:700}

#ref-button[hidden],#reference-gallery[hidden]{display:none}#reference-gallery{display:grid;flex:1;min-height:0;gap:8px}.reference-thumb{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid #d4dbcf;border-radius:7px;background:#fafbf7;padding:5px;cursor:zoom-in}.reference-thumb img{flex:1;min-height:0;width:100%;height:0;object-fit:contain}.reference-thumb span{flex:none;font-size:10px;line-height:1.4;color:#5e6e55;margin-top:6px}

.milestone-lead{font-size:18px;line-height:1.5;margin:4px 0 24px;color:#52674c}.milestone-body{display:grid;gap:18px;min-height:350px}.milestone-body.flow{grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}.milestone-body.village,.milestone-body.art{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}.milestone-card{position:relative;background:#eff3e9;border:1px solid #cbd6c0;border-top:5px solid #75925f;border-radius:8px;padding:22px}.milestone-card h2{font-size:21px;margin:14px 0}.milestone-card p{font-size:16px;line-height:1.65;margin:10px 0}.milestone-step{font-size:30px;color:#7d936c}.flow .milestone-card:not(:last-child):after{content:'→';position:absolute;right:-22px;top:45%;font-size:26px;color:#799268;z-index:1}.milestone-body.timeline{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.timeline .milestone-card{padding:16px}.timeline h2{font-size:18px;margin:8px 0}.timeline p{font-size:14px;line-height:1.5}.milestone-date{font-size:19px;color:#506d40}.milestone-note{font-size:15px;line-height:1.65;background:#faf4e3;border-left:4px solid #c5a456;padding:12px 16px;margin:20px 0 8px}.milestone-source{font-size:11px;color:#87907e}.calendar{display:block}.schedule-header{display:grid;grid-template-columns:180px repeat(3,1fr);font-size:15px;color:#536947;margin-bottom:12px}.schedule-header span:not(:first-child){text-align:center}.schedule-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:0;margin-bottom:14px;align-items:center}.schedule-row>b{font-size:14px}.schedule-track{display:grid;grid-template-columns:repeat(84,minmax(0,1fr));height:32px;background:repeating-linear-gradient(90deg,#f0f3eb 0,#f0f3eb calc(33.333% - 1px),#bbcbb0 calc(33.333% - 1px),#bbcbb0 33.333%)}.schedule-segment{display:flex;align-items:center;justify-content:center;font-size:12px;background:#cbdcbd;color:#344f2d;border:1px solid #fff;border-radius:4px}.theme-2{background:#ead6a1}.theme-3{background:#b8d8db}.theme-4{background:#d8c6e7}.theme-5{background:#f0c7b5}.theme-6{background:#b6cfbd}.planned .schedule-segment{background:#fffaf0;border:2px dashed #ba9d66;font-size:12px}.art-count{display:block;font-size:48px;color:#537441;margin:22px 0}

.event-set-rows{height:calc(100% - 30px);display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:14px}.event-set-row{min-height:0;display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;background:#f2f5ed;border:1px solid #d3ddca;border-radius:8px;padding:12px}.event-set-name{font-size:18px;line-height:1.6;color:#48613b;align-self:center;margin:0}.event-set-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:0;gap:16px}.event-set-grid figure{min-height:0;align-items:stretch}.event-set-grid figcaption{text-align:center;font-size:12px;margin:0 0 6px}.event-set-grid .compare-image{min-height:0;overflow:hidden}.event-set-grid img{width:100%;height:100%;object-fit:contain}
.currency-stage-rows{height:590px;max-height:100%;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;overflow:hidden}.currency-stage-row{min-height:0;overflow:hidden;display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:center;background:#f2f5ed;border:1px solid #d3ddca;border-radius:8px;padding:8px 12px}.currency-stage-name{font-size:17px;color:#48613b;margin:0}.currency-stage-grid{height:100%;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.currency-stage-grid figure{display:grid;grid-template-rows:minmax(0,1fr) 20px;min-width:0;min-height:0;overflow:hidden;margin:0}.currency-stage-grid .compare-image{height:100%;min-height:0;overflow:hidden}.currency-stage-grid img{width:100%;height:100%;object-fit:contain}.currency-stage-grid figcaption{text-align:center;font-size:10px;line-height:1.2;margin:4px 0 0;color:#5e6c56}

/* 도입부: 설명 카드 대신 큰 일정 축과 수량 막대 */
.milestone-body.timeline{position:relative;grid-template-columns:repeat(4,minmax(0,1fr));align-content:center;gap:42px 22px;background:linear-gradient(#b8c9aa,#b8c9aa) center/96% 3px no-repeat}
.timeline .milestone-card{min-height:140px;background:#fffef9;border:1px solid #cad7bf;border-top:7px solid #75925f;padding:18px}

"역전 읍내 → 시장 거리 · 옛 극장"},{"id":"update-appendix","title":"추가 이벤트 · 빙고·협동·휠","chapter":"부록 · 업데이트 스펙","brief":"현재 제작 범위 제외 · 향후 업데이트 검토용 원작 참고"},{"id":"archive","title":"이전 기획 모음","chapter":"Archive","brief":"현재 기획에서 제외한 기존 화면을 참고용으로 보관한다."},{"id":"settings-options","title":"설정 · 프로필 · 공통 오류 / 설정","chapter":"보상 · 상점 · 공통","brief":"설정 관련 화면을 설명한다."},{"id":"profile-level","title":"설정 · 프로필 · 공통 오류 / 프로필 · 레벨","chapter":"보상 · 상점 · 공통","brief":"프로필 · 레벨 관련 화면을 설명한다."},{"id":"common-errors","title":"설정 · 프로필 · 공통 오류 / 공통 오류","chapter":"보상 · 상점 · 공통","brief":"공통 오류 관련 화면을 설명한다."},{"id":"update-characters","title":"업데이트 손님 아트","chapter":"부록 · 업데이트 스펙","brief":"런칭에서 제외하고 업데이트로 분리한 손님 아트."},{"id":"version-history","title":"기획서 버전 이력","chapter":"Version History","brief":"변경 내역과 수정 위치를 연결한다."}],"pages":[{"id":"glossary-1","screen":"용어","group":"glossary","layout":"glossary","title":"용어 정의","status":"","part":1,"parts":3,"rows":[],"sections":[{"title":"보드와 보드 아이템","items":[{"term":"보드","meaning":"아이템을 놓고 생산·머지·수확하는 플레이 공간입니다."},{"term":"보드 칸","meaning":"보드 아이템 하나를 놓을 수 있는 자리입니다."},{"term":"보드 아이템","meaning":"보드에 놓이는 물체 전체입니다. 생성기·머지 재료·보상 상자·수확 아이템을 포함합니다."},{"term":"생성기(Generator)","meaning":"머지 재료를 생산하는 보드 아이템입니다."},{"term":"머지 재료","meaning":"같은 아이템끼리 합쳐 다음 단계로 만들거나 주문에 납품하는 아이템입니다."},{"term":"보상 상자","meaning":"열어서 내용물을 얻는 보드 아이템입니다. 내용물을 모두 꺼내면 소진됩니다."},{"term":"수확 아이템","meaning":"탭하면 코인·젬·에너지 등의 보상을 받고 소모되는 보드 아이템입니다."}]},{"title":"머지와 아이템 단계","items":[{"term":"머지(Merge)","meaning":"같은 종류·같은 단계의 아이템 두 개를 합쳐 다음 단계 아이템 하나로 만드는 행동입니다."},{"term":"머지 체인","meaning":"한 종류의 아이템이 첫 단계부터 마지막 단계까지 이어지는 목록입니다."},{"term":"아이템 단계","meaning":"머지 체인 안에서 해당 아이템이 몇 번째 단계인지 나타냅니다."},{"term":"최고 단계","meaning":"해당 체인에서 더 이상 머지로 성장시킬 수 없는 마지막 단계입니다."}]},{"title":"재화","items":[{"term":"재화","meaning":"보유 수량으로 관리하며 생산·구매·진행 등에 사용하는 자원입니다."},{"term":"에너지","meaning":"주로 생성기에서 아이템을 생산할 때 사용하는 재화입니다."},{"term":"코인","meaning":"주문 보상 등으로 얻고 마을 복원 등에 사용하는 재화입니다."},{"term":"젬","meaning":"상품 구매나 대기시간 즉시 완료 등에 사용하는 재화입니다."},{"term":"수확","meaning":"보드의 수확 아이템을 사용해 보상을 받는 행동입니다."}]}],"note":"보드에 놓이는 물체, 합치는 행동, 보유 재화를 구분한다.","source":"https://docs.google.com/spreadsheets/d/1vHsmiZx9crWPjCJp0c0yCF9cFpW--TMEpps5scUX-6U/edit?gid=958485875#gid=958485875","sourceLabel":"[PMM] 밸런스시트 · 용어 기준","unit":"glossary:https://docs.google.com/spreadsheets/d/1vHsmiZx9crWPjCJp0c0yCF9cFpW--TMEpps5scUX-6U/edit?gid=958485875#gid=958485875:용어 정의","revisions":["v1.2"]},{"id":"glossary-2","screen":"용어","group":"glossary","layout":"glossary","title":"용어 정의","status":"","part":2,"parts":3,"rows":[],"sections":[{"title":"주문과 납품 · 주문 구성","items":[{"term":"주문","meaning":"지정된 요구품을 납품하면 보상을 받는 과제입니다."},{"term":"주문 카드","meaning":"주문의 손님·요구품·보상을 화면에 보여주는 표시 단위입니다."},{"term":"주문 자리(슬롯)","meaning":"주문 하나를 배정하고 진행 상태를 관리하는 자리입니다."},{"term":"요구품","meaning":"주문을 완료하기 위해 납품해야 하는 아이템입니다."},{"term":"요구품 종류 수","meaning":"한 주문이 서로 다른 아이템을 몇 종류 요구하는지 뜻합니다. PMM은 최대 2종입니다."},{"term":"요구 수량","meaning":"각 요구품을 몇 개 납품해야 하는지 뜻합니다. 종류 수와 구분합니다."},{"term":"주문 생성·발급","meaning":"요구품과 보상 등을 결정해 빈 주문 자리에 배정하는 과정입니다."},{"term":"주문 발급 기회","meaning":"랜덤 주문 생성을 시도할 수 있는 남은 횟수입니다. 빈자리 수와 구분합니다."}]},{"title":"주문과 납품 · 생성·완료","items":[{"term":"고정 주문","meaning":"요구품과 진행 순서 등이 미리 정해진 주문입니다."},{"term":"랜덤 주문","meaning":"현재 조건을 검사하고 후보 중에서 요구품을 추첨해 만드는 주문입니다."},{"term":"특수 주문","meaning":"별도로 정한 진행 조건과 생성 규칙을 따르는 주문입니다."},{"term":"주문 후보","meaning":"해금·단계·생산 가능 여부·중복 제한 등을 통과한 요구품 후보입니다."},{"term":"주문 난이도 점수","meaning":"주문 구성과 난이도를 판단하는 값입니다. 지급 코인과 구분합니다."},{"term":"납품","meaning":"요구품을 소비해 주문을 완료하는 행동입니다."},{"term":"보상","meaning":"주문 완료 등의 조건을 만족했을 때 받는 재화나 아이템입니다."}]},{"title":"성장과 해금","items":[{"term":"유저 레벨","meaning":"플레이어의 성장 단계입니다. 보드 아이템의 단계와 구분합니다."},{"term":"게임 Day","meaning":"이야기와 복원 진행을 나누는 게임 안의 일차입니다. 실제 플레이 날짜 수와 구분합니다."},{"term":"해금","meaning":"레벨이나 진행 조건을 만족해 기능·아이템 등을 사용할 수 있게 되는 것입니다."}]}],"note":"주문 구성과 플레이어 진행에 사용하는 공통 명칭을 구분한다.","source":"https://docs.google.com/spreadsheets/d/1vHsmiZx9crWPjCJp0c0yCF9cFpW--TMEpps5scUX-6U/edit?gid=958485875#gid=958485875","sourceLabel":"[PMM] 밸런스시트 · 용어 기준","unit":"glossary:https://docs.google.com/spreadsheets/d/1vHsmiZx9crWPjCJp0c0yCF9cFpW--TMEpps5scUX-6U/edit?gid=958485875#gid=958485875:용어 정의"},{"id":"glossary-3","screen":"용어","group":"glossary","layout":"glossary","title":"용어 정의","status":"","part":3,"parts":3,"rows":[],"sections":[{"title":"상시 콘텐츠","items":[{"term":"머지 보드","meaning":"아이템을 생산하고 합치는 기본 플레이입니다."},{"term":"주문","meaning":"요구품을 납품하고 보상을 받는 콘텐츠입니다."},{"term":"특수 주문","meaning":"별도 진행 조건을 따라 이어지는 주문 콘텐츠입니다."},{"term":"마을 복원","meaning":"코인을 사용해 공간을 복원하고 꾸미는 콘텐츠입니다."},{"term":"스토리","meaning":"복원 진행에 따라 열리는 인물들의 이야기입니다."},{"term":"일일 출석","meaning":"접속한 날짜에 따라 보상을 받는 콘텐츠입니다."},{"term":"일일 과제","meaning":"하루 단위로 갱신되는 목표입니다."},{"term":"주간 과제","meaning":"한 주 동안 목표를 달성하고 보상을 받는 콘텐츠입니다."}]},{"title":"라이브옵스","items":[{"term":"시즌 패스","meaning":"기간 중 목표를 달성해 패스 보상을 받는 이벤트입니다.","scope":"기획서 작성중"},{"term":"5인 레이스","meaning":"5명이 한 그룹에서 경쟁하는 이벤트입니다.","scope":"기획서 작성중"},{"term":"순위전","meaning":"대규모 그룹에서 점수와 순위로 경쟁하는 이벤트입니다. 인원은 이벤트 설정을 따릅니다.","scope":"기획서 작성중"},{"term":"주문 러시","meaning":"기간 중 주문을 완료해 추가 보상을 받는 이벤트입니다.","scope":"기획서 작성중"},{"term":"시즈널 수집앨범","meaning":"계절 테마의 수집품을 모아 세트와 앨범을 완성하는 이벤트입니다.","scope":"기획서 작성중"},{"term":"에너지 챌린지","meaning":"에너지를 사용하며 목표를 달성하는 이벤트입니다.","scope":"런칭 제외 · 후속 검토"},{"term":"팀 챌린지","meaning":"팀 단위로 목표를 달성하는 이벤트입니다.","scope":"런칭 제외 · 후속 검토"}]}],"note":"상시 콘텐츠와 기간 한정 라이브옵스의 명칭과 현재 범위를 구분한다.","source":"https://docs.google.com/spreadsheets/d/1vHsmiZx9crWPjCJp0c0yCF9cFpW--TMEpps5scUX-6U/edit?gid=958485875#gid=958485875","sourceLabel":"[PMM] 밸런스시트 · 용어 기준","unit":"glossary:https://docs.google.com/spreadsheets/d/1vHsmiZx9crWPjCJp0c0yCF9cFpW--TMEpps5scUX-6U/edit?gid=958485875#gid=958485875:용어 정의"},{"id":"milestone-loop","screen":"요약","group":"review-start","title":"런칭 한눈에 보기","lead":"생산 → 머지 → 납품 → 꾸미기 → 다음 목표","stats":[["머지","아이템 생산·합성"],["복원","코인으로 chore 진행"],["이야기","인물과 마을의 사연"]],"cards":[["① 생산하고 합친다","생성기에서 아이템을 얻고 같은 아이템 두 개를 합쳐 다음 단계로 만든다. 생성기별 산출물과 기다리는 시간이 다음 행동을 결정한다."],["② 오더를 납품한다","요구 아이템을 모아 오더를 완료하고 코인을 얻는다. 체인은 만들 목표를, 오더는 보상을 받는 목표를 제공한다."],["③ 꾸미기와 심부름을 진행한다","코인을 써서 수선하거나 세 가지 디자인 중 하나를 고른다. 대화만 진행하는 chore도 있으며, 하루의 할 일을 마치면 다음 날로 넘어간다."],["④ 새 목표를 만나 다시 보드로 간다","복원이 진행되면 다음 장소와 이야기가 이어지고, 특정 chore는 특수 오더를 연다. 이후 상세 설명은 로비부터 이 흐름을 따라간다."]],"notes":"","sourceDocs":"rosewood_milestone.html · §01 / §04 / §06","layout":"launch-overview","part":1,"parts":1,"status":"","wire":"86c1781e59ac13b3","ref":"40a575f021ba7d01","refKind":"원작 참고","refNote":"Gossip Harbor 실제 화면","source":"https://www.figma.com/design/ysNSu4MLTZriGqwqOB41GT/PMM?node-id=406-196","rows":[{"no":"—","title":"게임 구조 · 보드에서 마을까지 한 바퀴","fields":[["출처","마일스톤 문서의 게임 구조·제작 일정·운영 계획"]]},{"no":"—","title":"마을 진행 · 런칭 20일차의 구성","fields":[["출처","마일스톤 문서의 게임 구조·제작 일정·운영 계획"]]},{"no":"—","title":"출시 후 일정 · 첫 운영 84일","fields":[["출처","마일스톤 문서의 게임 구조·제작 일정·운영 계획"]]},{"no":"—","title":"제작 일정 · 기획 리뷰부터 출시까지","fields":[["출처","마일스톤 문서의 게임 구조·제작 일정·운영 계획"]]},{"no":"—","title":"아트 준비 · 런칭 전과 운영 중 물량","fields":[["출처","마일스톤 문서의 게임 구조·제작 일정·운영 계획"]]}],"visualKind":"flow","after":"intro-loop","nodes":[["생성기","에너지 사용 → 아이템 생산"],["머지","같은 아이템 2개 → 다음 단계"],["오더 납품","요구 아이템 제출 → 코인 획득"],["chore","코인 사용 → 수선·디자인 선택·대화"],["마을 진행","새 장소와 이야기 → 다음 목표"]],"note":"코인은 마을 복원에 사용한다.","unit":"review-start:launch-overview","overviewParts":[{"id":"milestone-loop","screen":"요약","group":"review-start","title":"게임 구조 · 보드에서 마을까지 한 바퀴","lead":"생산 → 머지 → 납품 → 꾸미기 → 다음 목표","stats":[["머지","아이템 생산·합성"],["복원","코인으로 chore 진행"],["이야기","인물과 마을의 사연"]],"cards":[["① 생산하고 합친다","생성기에서 아이템을 얻고 같은 아이템 두 개를 합쳐 다음 단계로 만든다. 생성기별 산출물과 기다리는 시간이 다음 행동을 결정한다."],["② 오더를 납품한다","요구 아이템을 모아 오더를 완료하고 코인을 얻는다. 체인은 만들 목표를, 오더는 보상을 받는 목표를 제공한다."],["③ 꾸미기와 심부름을 진행한다","코인을 써서 수선하거나 세 가지 디자인 중 하나를 고른다. 대화만 진행하는 chore도 있으며, 하루의 할 일을 마치면 다음 날로 넘어간다."],["④ 새 목표를 만나 다시 보드로 간다","복원이 진행되면 다음 장소와 이야기가 이어지고, 특정 chore는 특수 오더를 연다. 이후 상세 설명은 로비부터 이 흐름을 따라간다."]],"notes":"","sourceDocs":"rosewoo "id":"reward-delivery","screen":"정의","group":"rewards","title":"보상 · 지급 경로","status":"","part":1,"parts":1,"wire":"384f244d9f16d591","wireLabel":"보상 수령 공통 규칙","ref":"c53414abd355f800","refKind":"원작 참고","refNote":"Gossip Harbor 실제 화면","rows":[{"no":"1","title":"01 즉시 HUD · 동전·보석·에너지","fields":[["대상","동전 +수량, 보석 +수량, 에너지 +수량"],["지급","수령 확정 시 보유량에 즉시 가산한다. 보상 인벤토리에 넣지 않는다."],["표시","각 재화 HUD로 아이콘이 이동하고 증가량을 표시한다."],["예외","보드 빈칸과 무관하게 지급한다. 보상 에너지는 자연 회복 한도 100을 넘겨 보유할 수 있다."]]},{"no":"2","title":"02 보상 인벤토리 · 상자와 보드 아이템","fields":[["대상","기본 보상 상자 5종, 심플·팬시 상자, 생성기·생성기 부품, 일반 체인 아이템"],["지급","보상 인벤토리에 오브젝트와 개수를 저장한다. 수령 순간 재화 HUD는 증가하지 않는다."],["사용","보상 인벤토리에서 꺼내 보드 빈칸에 배치한다. 상자는 보드에서 개봉한다."],["보드 가득 참","꺼내기만 막고 보상은 인벤토리에 유지한다. 일반 창고 슬롯을 차감하지 않는다."]]},{"no":"3","title":"03 보상 인벤토리 · 재화 체인·특수 아이템","fields":[["대상","합성 가능한 동전·보석·에너지 단계 아이템, 무지개 유리알, 가위"],["지급","아이템 상태로 보상 인벤토리에 저장한다."],["재화 회수","재화 체인은 보드에 배치한 뒤 탭해 회수할 때만 해당 HUD가 증가한다."],["도구 사용","유리알·가위는 보드 대상을 선택해 사용한다. 수령만으로 자동 사용하지 않는다."]]},{"no":"4","title":"04 즉시 반영 · 경험치·이벤트 포인트","fields":[["경험치","경험치를 지급하는 보상에서 레벨 경험치에 즉시 가산한다. 오더 납품에는 경험치를 추가하지 않는다."],["이벤트 포인트","시즈널 패스·라파의 배달 레이스·로지의 주문 수첩 등의 해당 이벤트 진행도에 가산한다."],["표시","레벨 게이지 또는 해당 이벤트 아이콘·진행도에 반영한다. 동전·보석·에너지 HUD에 합산하지 않는다."],["구분","포인트 수량과 보드에 떨어지는 이벤트 오브젝트를 구분한다."]]},{"no":"5","title":"05 업데이트 · 카드팩과 카드","fields":[["카드팩","미개봉 팩을 앨범의 개봉 대기로 보관한다. 보드용 상자와 구분한다."],["개봉 결과","카드는 해당 앨범 세트에 등록하고 중복 수량을 갱신한다."],["완성 보상","세트·앨범 완성 보상도 구성품별로 분리한다. 재화 수량은 HUD, 보드 오브젝트는 보상 인벤토리로 지급한다."],["범위","런칭 미적용. 팩 보관·개봉 대기 UI의 세부 구성은 업데이트 명세에서 확정한다."]]},{"no":"6","title":"06 IAP 구매 보상 지급","fields":[["혼합 예시","동전 수량 + 초록 상자: 동전은 HUD에 가산, 상자는 보상 인벤토리에 1개 추가."],["판정 기준","보상 아이콘 모양이 아니라 지급 데이터가 재화 수량인지 보드 아이템인지로 구분한다."],["처리 시점","IAP 결제 성공과 구매 검증 완료 후 상품 구성품을 지급하고 저장한다. 팝업 닫기·연출 완료는 추가 지급 조건이 아니다."],["중복 방지","같은 IAP 거래는 한 번만 지급한다. 재접속·재시도·연출 재생으로 중복 지급하지 않는다."]]}],"source":"https://www.figma.com/design/ysNSu4MLTZriGqwqOB41GT/PMM?node-id=410-231","titleNote":"샘플 이미지 재첨부 예정","layout":"feedba function locate(element,quote){
 if(!element||panel.contains(element)||element===trigger||element.closest('nav,header'))return;
 context={pageId:currentPage(),heading:currentHeading(),quote:(quote||element.textContent||element.getAttribute('alt')||'').trim().slice(0,1600)};
 paintContext();
}
D.addEventListener('mouseup',event=>{
 if(panel.contains(event.target)||event.target===trigger)return;
 const selection=window.getSelection();
 if(selection&&selection.toString().trim()){const node=selection.anchorNode;locate(node.nodeType===1?node:node.parentElement,selection.toString());}
 else{const element=event.target.closest('td,th,dd,dt,p,li,h2,h3,figure,img');if(element)locate(element,'');}
});

async function load(message='공유 코멘트를 불러왔습니다.'){
 if(busy)return;
 setBusy(true);status('공유 코멘트를 불러오는 중…');
 try{threads=await rpc('rosewood_review_read',{p_document:documentName});loaded=true;render();status(message);}
 catch(error){status(error.message+' 잠시 후 새로고침을 눌러주세요.');}
 finally{setBusy(false);}
}

trigger.onclick=()=>{
 panel.hidden=!panel.hidden;trigger.setAttribute('aria-expanded',String(!panel.hidden));
 if(!panel.hidden){if(context.pageId!==currentPage())resetContext();if(!loaded)load();else render();}
};
$('rw-note-close').onclick=()=>{panel.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();};
$('rw-note-refresh').onclick=()=>load();
panel.addEventListener('keydown',event=>{if(event.key==='Escape')$('rw-note-close').click();});
$('rw-note-author').onchange=()=>{const value=$('rw-note-author').value.trim();if(value)try{localStorage.setItem(authorKey,value);}catch(_){ }};
$('rw-note-this-page').onchange=render;
$('rw-note-show-done').onchange=render;

$('rw-note-save').onclick=async()=>{
 const name=author(),body=$('rw-note-text').value.trim();
 if(!name||busy)return;
 if(!body){status('코멘트 내용을 입력해주세요.');$('rw-note-text').focus();return;}
 setBusy(true);status('코멘트를 저장하는 중…');
 try{
  await rpc('rosewood_review_create',{p_document:documentName,p_page_id:context.pageId,p_heading:context.heading,p_quote:context.quote,p_author:name,p_body:body});
  $('rw-note-text').value='';threads=await rpc('rosewood_review_read',{p_document:documentName});render();status('코멘트를 공유했습니다.');
 }catch(error){status(error.message+' 입력 내용은 그대로 남아 있습니다.');}
 finally{setBusy(false);}
};

async function changeStatus(thread,next,reason=''){
 const name=author();
 if(!name||busy)return;
 if((next==='resolved'||next==='withdrawn')&&!reason.trim()){status(next==='resolved'?'완료 사유를 입력해주세요.':'철회 사유를 입력해주세요.');return;}
 setBusy(true);status('처리 이력을 저장하는 중…');
 try{await rpc('rosewood_review_set_status',{p_thread_id:thread.id,p_status:next,p_author:name,p_reason:reason.trim()});threads=await rpc('rosewood_review_read',{p_document:documentName});render();status(next==='resolved'?'완료 사유와 이력을 저장했습니다.':next==='withdrawn'?'철회 사유와 이력을 저장했습니다.':'다시 연 이력을 저장했습니다.');}
 catch(error){status(error.message);}
 finally{setBusy(false);}
}

async function reply(thread,textarea){
 const name=author(),body=textarea.value.trim();if(!name||busy)return;
 if(!body){status('답글 내용을 입력해주세요.');textarea.focus();return;}
 setBusy(true);status('답글을 저장하는 중…');
 try{await rpc('rosewood_review_reply',{p_thread_id:thread.id,p_author:name,p_body:body});textarea.value='';threads=await rpc('rosewood_review_read',{p_document:documentName});render();status('답글을 공유했습니다.');}
 catch(error){status(error.message+' 입력 내용은 그대로 남아 있습니다.');}
 finally{setBusy(false);}
}

function button(label,action,kind=''){const value=D.createElement('button');value.type='button';value.textContent=label;if(kind)value.className=kind;value.onclick=action;return value;}
function statusEditor(controls,thread,next){
 controls.querySelector('.rw-note-status-form')?.remove();
 const form=D.createElement('div');form.className='rw-note-status-form';
 const textarea=D.createElement('textarea');textarea.maxLength=2000;textarea.rows=2;textarea.placeholder=next==='resolved'?'완료 내용이나 처리 사유를 남겨주세요':'철회 사유를 남겨주세요';
 const actions=D.createElement('div');
 actions.append(button(next==='resolved'?'완료 저장':'철회 저장',()=>changeStatus(thread,next,textarea.value),next==='resolved'?'rw-note-resolve':'rw-note-withdraw'),button('취소',()=>form.remove()));
 form.append(textarea,actions);controls.append(form);textarea.focus();
}
function renderHistory(thread,article){
 const history=thread.history||[];if(!history.length)return;
 const details=D.createElement('details');details.className='rw-note-history';
 const summary=D.createElement('summary');summary.textContent='처리 이력 '+history.length;
 const list=D.createElement('div');
 history.forEach(event=>{
  const item=D.createElement('div');item.className='rw-note-history-item';
  const label=event.to_status==='resolved'?'완료':event.to_status==='withdrawn'?'철회':'다시 열기';
  const meta=D.createElement('small');const name=D.createElement('strong');name.textContent=event.author;meta.append(name,D.createTextNode(' · '+label+' · '+new Date(event.created_at).toLocaleString('ko-KR')));
  item.append(meta);if(event.reason){const reason=D.createElement('p');reason.textContent=event.reason;item.append(reason);}list.append(item);
 });
 details.append(summary,list);article.append(details);
}
function render(){
 const list=$('rw-note-list');list.replaceChildren();
 const pageOnly=$('rw-note-this-page').checked,showDone=$('rw-note-show-done').checked,page=currentPage();
 const visible=threads.filter(thread=>(!pageOnly||thread.page_id===page)&&(showDone||thread.status==='open'));
 const openCount=threads.filter(thread=>thread.status==='open').length;
 trigger.textContent='코멘트 '+openCount;
 if(!visible.length){const empty=D.createElement('p');empty.className='rw-note-empty';empty.textContent=loaded?'표시할 코멘트가 없습니다.':'코멘트를 불러오는 중…';list.append(empty);return;}
 visible.forEach(thread=>{
  const article=D.createElement('article');article.className='rw-note-thread rw-note-'+thread.status;
  const heading=D.createElement('div');heading.className='rw-note-thread-head';
  const link=D.createElement('a');link.href='#'+encodeURIComponent(thread.page_id||'');link.textContent=thread.heading||'문서 전체';
  const state=D.createElement('span');state.textContent=thread.status==='open'?'미해결':thread.status==='resolved'?'해결 완료':'철회';heading.append(link,state);article.append(heading);
  if(thread.quote){const quote=D.createElement('blockquote');quote.textContent=thread.quote;article.append(quote);}
  const messages=D.createElement('div');messages.className='rw-note-messages';
  (thread.messages||[]).forEach((message,index)=>{const item=D.createElement('div');item.className='rw-note-message'+(index?' rw-note-reply':'');const meta=D.createElement('small');const name=D.createElement('strong');name.textContent=message.author;meta.append(name,D.createTextNode(' · '+new Date(message.created_at).toLocaleString('ko-KR')));const body=D.createElement('p');body.textContent=message.body;item.append(meta,body);messages.append(item);});article.append(messages);
  const controls=D.createElement('div');controls.className='rw-note-actions';
  if(thread.status==='open'){controls.append(button('완료 처리',()=>statusEditor(controls,thread,'resolved'),'rw-note-resolve'),button('철회',()=>statusEditor(controls,thread,'withdrawn'),'rw-note-withdraw'));}
  else controls.append(button('다시 열기',()=>changeStatus(thread,'open')));
  article.append(controls);
  renderHistory(thread,article);
  if(thread.status!=='withdrawn'){
   const details=D.createElement('details');details.className='rw-note-reply-form';const summary=D.createElement('summary');summary.textContent='답글 쓰기';const textarea=D.createElement('textarea');textarea.maxLength=4000;textarea.rows=2;textarea.placeholder='답변이나 추가 의견을 남겨주세요';details.append(summary,textarea,button('답글 등록',()=>reply(thread,textarea)));article.append(details);
  }
  list.append(article);
 });
}

window.addEventListener('hashchange',()=>{if(context.pageId!==currentPage())resetContext();if(!panel.hidden)render();});
window.addEventListener('rosewood-page-change',()=>{if(context.pageId!==currentPage())resetContext();if(!panel.hidden)render();});
setInterval(()=>{if(!panel.hidden&&!busy)load('새 코멘트를 확인했습니다.');},30000);
resetContext();render();
})();

/* Read-only compatibility for legacy local spec-out markers. */
(function(){
 let records=[];
 try{const data=JSON.parse(localStorage.getItem('rosewood-review-comments-v1')||'null');if(data&&Array.isArray(data.comments))records=data.comments;}catch(_){ }
 const documentName=decodeURIComponent(location.pathname.split('/').pop()).replace('_review.html','.html');
 window.rosewoodScope={
  isOut(anchor){return records.some(record=>record.document===documentName&&record.kind==='spec-out'&&record.anchor===anchor&&record.status!=='dismissed'&&record.excluded===true);},
  async toggle(){return false;}
 };
 window.dispatchEvent(new Event('rosewood-scope-change'));
})();
</script></body></html>
